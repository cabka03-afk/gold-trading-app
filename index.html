<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gold Trading System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
–gold: #C9A84C;
–gold-light: #F0D080;
–gold-dark: #8B6914;
–bg: #0F0E0A;
–surface: #1A1810;
–surface2: #242118;
–border: #2E2B1F;
–text: #F0EAD6;
–muted: #7A7260;
–green: #4CAF50;
–red: #E05555;
}

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘DM Sans’, sans-serif;
background: var(–bg);
color: var(–text);
min-height: 100vh;
}

/* LOGIN */
.login-wrap {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: radial-gradient(ellipse at 50% 0%, #2a2310 0%, var(–bg) 70%);
}

.login-box {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 16px;
padding: 48px 40px;
width: 100%;
max-width: 420px;
text-align: center;
}

.login-box h1 {
font-family: ‘Playfair Display’, serif;
font-size: 2rem;
color: var(–gold);
margin-bottom: 4px;
}

.login-box h3 {
font-size: 0.85rem;
color: var(–muted);
font-weight: 400;
margin-bottom: 32px;
letter-spacing: 0.05em;
text-transform: uppercase;
}

.login-box input {
width: 100%;
padding: 14px 16px;
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 8px;
color: var(–text);
font-family: ‘DM Sans’, sans-serif;
font-size: 0.95rem;
margin-bottom: 12px;
outline: none;
transition: border-color 0.2s;
}

.login-box input:focus { border-color: var(–gold); }

.btn {
background: var(–gold);
color: #0F0E0A;
border: none;
border-radius: 8px;
padding: 13px 24px;
font-family: ‘DM Sans’, sans-serif;
font-size: 0.95rem;
font-weight: 600;
cursor: pointer;
transition: background 0.2s, transform 0.1s;
}

.btn:hover { background: var(–gold-light); }
.btn:active { transform: scale(0.98); }
.btn-full { width: 100%; margin-top: 4px; }

.btn-sm {
padding: 7px 14px;
font-size: 0.8rem;
border-radius: 6px;
}

.btn-outline {
background: transparent;
border: 1px solid var(–gold);
color: var(–gold);
}

.btn-outline:hover { background: var(–gold); color: #0F0E0A; }

.btn-danger {
background: var(–red);
color: #fff;
}

.btn-danger:hover { background: #c94444; }

.error-msg {
color: var(–red);
font-size: 0.85rem;
margin-top: 10px;
}

.login-hint {
margin-top: 28px;
padding: 16px;
background: var(–surface2);
border-radius: 8px;
text-align: left;
font-size: 0.8rem;
color: var(–muted);
line-height: 1.8;
}

.login-hint strong { color: var(–gold); }
.login-hint code { color: var(–text); background: var(–border); padding: 1px 5px; border-radius: 3px; }

/* APP LAYOUT */
.app { display: flex; flex-direction: column; min-height: 100vh; }

.header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 16px 28px;
background: var(–surface);
border-bottom: 1px solid var(–border);
position: sticky;
top: 0;
z-index: 10;
}

.header h1 {
font-family: ‘Playfair Display’, serif;
font-size: 1.3rem;
color: var(–gold);
}

.user-info {
display: flex;
align-items: center;
gap: 14px;
font-size: 0.85rem;
color: var(–muted);
}

.tabs {
display: flex;
gap: 0;
background: var(–surface);
border-bottom: 1px solid var(–border);
overflow-x: auto;
padding: 0 20px;
}

.tab-btn {
background: none;
border: none;
padding: 14px 20px;
color: var(–muted);
font-family: ‘DM Sans’, sans-serif;
font-size: 0.85rem;
cursor: pointer;
border-bottom: 2px solid transparent;
transition: all 0.2s;
white-space: nowrap;
}

.tab-btn:hover { color: var(–text); }
.tab-btn.active { color: var(–gold); border-bottom-color: var(–gold); }

.content { padding: 28px; max-width: 1100px; margin: 0 auto; width: 100%; }

/* CARDS & GRIDS */
.stats-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 16px;
margin-bottom: 28px;
}

.stat-card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 20px 22px;
}

.stat-card h3 {
font-size: 0.75rem;
color: var(–muted);
text-transform: uppercase;
letter-spacing: 0.06em;
margin-bottom: 10px;
font-weight: 500;
}

.stat-value {
font-family: ‘Playfair Display’, serif;
font-size: 1.7rem;
color: var(–gold);
}

.card {
background: var(–surface);
border: 1px solid var(–border);
border-radius: 12px;
padding: 24px;
margin-bottom: 20px;
}

.card h2 {
font-family: ‘Playfair Display’, serif;
font-size: 1.15rem;
color: var(–gold);
margin-bottom: 18px;
}

.card h3 {
font-size: 0.9rem;
color: var(–text);
margin-bottom: 14px;
font-weight: 600;
}

/* FORM */
.form-row {
display: flex;
gap: 12px;
flex-wrap: wrap;
align-items: flex-end;
margin-bottom: 16px;
}

.form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 130px; }

.form-group label { font-size: 0.78rem; color: var(–muted); text-transform: uppercase; letter-spacing: 0.04em; }

.form-group input {
padding: 11px 14px;
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 8px;
color: var(–text);
font-family: ‘DM Sans’, sans-serif;
font-size: 0.9rem;
outline: none;
transition: border-color 0.2s;
}

.form-group input:focus { border-color: var(–gold); }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th { text-align: left; padding: 10px 14px; color: var(–muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; border-bottom: 1px solid var(–border); }
td { padding: 12px 14px; border-bottom: 1px solid var(–border); color: var(–text); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(–surface2); }

/* BALANCE LIST */
.balance-item {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 0;
border-bottom: 1px solid var(–border);
}

.balance-item:last-child { border-bottom: none; }
.balance-name { font-weight: 500; }
.balance-amount { font-family: ‘Playfair Display’, serif; font-size: 1.1rem; color: var(–gold); }

.badge {
display: inline-block;
padding: 3px 10px;
border-radius: 20px;
font-size: 0.75rem;
font-weight: 600;
}

.badge-pending { background: #2a2210; color: var(–gold); border: 1px solid var(–gold-dark); }
.badge-approved { background: #0f2010; color: var(–green); border: 1px solid #2a5a2a; }

.positive { color: var(–green); }
.negative { color: var(–red); }

.access-denied {
text-align: center;
padding: 40px;
color: var(–muted);
}

.divider { border: none; border-top: 1px solid var(–border); margin: 20px 0; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

.empty { text-align: center; color: var(–muted); padding: 30px; font-size: 0.88rem; }
</style>

</head>
<body>

<div id="app"></div>

<script>
// ── DATA ────────────────────────────────────────────────────────────────
const DEFAULT_DATA = {
  goldPurchases: [],
  goldSales: [],
  expenses: [],
  surveyRevenues: [],
  withdrawalRequests: [],
  shareholders: [
    { id: 1, name: "Ahmed", password: "ahmed123", balance: 0 },
    { id: 2, name: "Sara",  password: "sara123",  balance: 0 },
    { id: 3, name: "Omar",  password: "omar123",  balance: 0 }
  ],
  companyCash: 0
};

function loadData() {
  try { return JSON.parse(localStorage.getItem('goldTradingData')) || DEFAULT_DATA; }
  catch { return DEFAULT_DATA; }
}

function saveData(d) { localStorage.setItem('goldTradingData', JSON.stringify(d)); }

let data = loadData();
let user = null;
let activeTab = 'dashboard';

// ── HELPERS ─────────────────────────────────────────────────────────────
function fmt(n) { return '$' + (parseFloat(n) || 0).toFixed(2); }
function fmtG(n) { return (parseFloat(n) || 0).toFixed(2) + 'g'; }
function fmtDate(iso) { return new Date(iso).toLocaleDateString(); }

function stats() {
  const bought = data.goldPurchases.reduce((s, p) => s + p.grams, 0);
  const sold   = data.goldSales.reduce((s, p) => s + p.grams, 0);
  const goldVal = data.goldPurchases.reduce((s, p) => s + p.totalCost, 0);
  const salesRev = data.goldSales.reduce((s, p) => s + p.totalRevenue, 0);
  const expenses = data.expenses.reduce((s, e) => s + e.amount, 0);
  const surveyRev = data.surveyRevenues.reduce((s, r) => s + r.amount, 0);
  const goldProfit = data.goldSales.reduce((s, p) => s + p.profit, 0);
  return { bought, sold, inventory: bought - sold, goldVal, salesRev, expenses, surveyRev, goldProfit, net: goldProfit + surveyRev - expenses };
}

// ── BUSINESS LOGIC ───────────────────────────────────────────────────────
function addPurchase(grams, rate) {
  const cost = grams * rate;
  data.goldPurchases.push({ id: Date.now(), date: new Date().toISOString(), grams, rate, totalCost: cost, remainingGrams: grams });
  data.companyCash -= cost;
  saveData(data); render();
}

function addSale(grams, rate) {
  let rem = grams, costBasis = 0;
  data.goldPurchases.forEach(p => {
    if (rem <= 0 || p.remainingGrams <= 0) return;
    const take = Math.min(p.remainingGrams, rem);
    costBasis += take * p.rate;
    p.remainingGrams -= take;
    rem -= take;
  });
  const rev = grams * rate;
  const profit = rev - costBasis;
  const perShare = profit / 3;
  data.goldSales.push({ id: Date.now(), date: new Date().toISOString(), grams, sellRate: rate, totalRevenue: rev, profit, profitPerShareholder: perShare });
  data.shareholders.forEach(s => s.balance += perShare);
  data.companyCash += rev;
  saveData(data); render();
}

function addExpense(desc, amount) {
  const perShare = amount / 3;
  data.expenses.push({ id: Date.now(), date: new Date().toISOString(), description: desc, amount });
  data.shareholders.forEach(s => s.balance -= perShare);
  data.companyCash -= amount;
  saveData(data); render();
}

function addSurveyRevenue(amount) {
  const perShare = amount / 3;
  data.surveyRevenues.push({ id: Date.now(), date: new Date().toISOString(), amount, dividendPerPerson: perShare });
  data.shareholders.forEach(s => s.balance += perShare);
  data.companyCash += amount;
  saveData(data); render();
}

function requestWithdrawal(shId, amount) {
  const sh = data.shareholders.find(s => s.id === shId);
  if (!sh || sh.balance < amount) { alert('Insufficient balance!'); return; }
  data.withdrawalRequests.push({ id: Date.now(), date: new Date().toISOString(), shareholderId: shId, shareholderName: sh.name, amount, status: 'pending' });
  saveData(data); render();
}

function approveWithdrawal(reqId) {
  const req = data.withdrawalRequests.find(r => r.id === reqId);
  if (!req || req.status !== 'pending') return;
  const sh = data.shareholders.find(s => s.id === req.shareholderId);
  if (sh) sh.balance -= req.amount;
  req.status = 'approved';
  data.companyCash -= req.amount;
  saveData(data); render();
}

// ── RENDER ───────────────────────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = user ? renderApp() : renderLogin();
  attachEvents();
}

function renderLogin() {
  return `
  <div class="login-wrap">
    <div class="login-box">
      <h1>💰 Gold Trading</h1>
      <h3>Shareholder & Dividend Management</h3>
      <input id="uname" type="text" placeholder="Username" />
      <input id="upass" type="password" placeholder="Password" />
      <button class="btn btn-full" id="loginBtn">Login</button>
      <div id="loginErr" class="error-msg"></div>
      <div class="login-hint">
        <strong>Login Credentials</strong><br/>
        👑 Admin: <code>admin</code> / <code>admin123</code><br/>
        👤 Ahmed: <code>ahmed</code> / <code>ahmed123</code><br/>
        👤 Sara: <code>sara</code> / <code>sara123</code><br/>
        👤 Omar: <code>omar</code> / <code>omar123</code>
      </div>
    </div>
  </div>`;
}

function renderApp() {
  const isAdmin = user.role === 'admin';
  const s = stats();
  const tabs = ['dashboard','transactions','shareholders','withdrawals','reports'];
  const tabLabels = { dashboard:'📊 Dashboard', transactions:'💸 Transactions', shareholders:'👥 Shareholders', withdrawals:'💰 Withdrawals', reports:'📈 Reports' };

  return `
  <div class="app">
    <div class="header">
      <h1>💰 Gold Trading System</h1>
      <div class="user-info">
        <span>👤 ${user.name} (${user.role})</span>
        <button class="btn btn-sm btn-outline" id="logoutBtn">Logout</button>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(t => `<button class="tab-btn ${activeTab===t?'active':''}" data-tab="${t}">${tabLabels[t]}</button>`).join('')}
    </div>
    <div class="content">
      ${activeTab === 'dashboard'     ? renderDashboard(s, isAdmin) : ''}
      ${activeTab === 'transactions'  ? renderTransactions(isAdmin) : ''}
      ${activeTab === 'shareholders'  ? renderShareholders(isAdmin) : ''}
      ${activeTab === 'withdrawals'   ? renderWithdrawals(isAdmin) : ''}
      ${activeTab === 'reports'       ? renderReports(s, isAdmin) : ''}
    </div>
  </div>`;
}

function renderDashboard(s, isAdmin) {
  const posNeg = v => v >= 0 ? 'positive' : 'negative';
  return `
  <div class="stats-grid">
    <div class="stat-card"><h3>Company Cash</h3><div class="stat-value">${fmt(data.companyCash)}</div></div>
    <div class="stat-card"><h3>Gold Inventory</h3><div class="stat-value">${fmtG(s.inventory)}</div></div>
    <div class="stat-card"><h3>Gold Profit</h3><div class="stat-value ${posNeg(s.goldProfit)}">${fmt(s.goldProfit)}</div></div>
    <div class="stat-card"><h3>Net Profit</h3><div class="stat-value ${posNeg(s.net)}">${fmt(s.net)}</div></div>
  </div>
  <div class="card">
    <h2>💰 Shareholder Balances</h2>
    ${data.shareholders.map(sh => `
      <div class="balance-item">
        <span class="balance-name">${sh.name}</span>
        <span class="balance-amount">${fmt(sh.balance)}</span>
        ${!isAdmin && user.shareholderId === sh.id ? `<button class="btn btn-sm" data-withdraw="${sh.id}">Request Withdrawal</button>` : ''}
      </div>`).join('')}
  </div>`;
}

function renderTransactions(isAdmin) {
  if (!isAdmin) return `<div class="card"><div class="access-denied"><p>⚠️ Only Admin can add transactions.</p><p style="margin-top:8px;font-size:0.85rem;">Shareholders can view reports and request withdrawals.</p></div></div>`;
  return `
  <div class="two-col">
    <div class="card">
      <h2>💰 Buy Gold</h2>
      <div class="form-group"><label>Grams</label><input id="buyGrams" type="number" placeholder="0.00"/></div>
      <div class="form-group" style="margin-top:12px"><label>Rate per gram ($)</label><input id="buyRate" type="number" placeholder="0.00"/></div>
      <button class="btn" style="margin-top:16px;width:100%" id="addPurchaseBtn">Add Purchase</button>
    </div>
    <div class="card">
      <h2>💵 Sell Gold</h2>
      <div class="form-group"><label>Grams</label><input id="sellGrams" type="number" placeholder="0.00"/></div>
      <div class="form-group" style="margin-top:12px"><label>Sell rate per gram ($)</label><input id="sellRate" type="number" placeholder="0.00"/></div>
      <button class="btn" style="margin-top:16px;width:100%" id="addSaleBtn">Add Sale</button>
    </div>
    <div class="card">
      <h2>📝 Add Expense</h2>
      <div class="form-group"><label>Description</label><input id="expDesc" type="text" placeholder="e.g. Rent"/></div>
      <div class="form-group" style="margin-top:12px"><label>Amount ($)</label><input id="expAmount" type="number" placeholder="0.00"/></div>
      <button class="btn" style="margin-top:16px;width:100%" id="addExpBtn">Add Expense</button>
    </div>
    <div class="card">
      <h2>📊 Survey Revenue</h2>
      <div class="form-group"><label>Total Amount ($)</label><input id="surveyAmount" type="number" placeholder="0.00"/></div>
      <button class="btn" style="margin-top:16px;width:100%" id="addSurveyBtn">Add & Distribute</button>
    </div>
  </div>`;
}

function renderShareholders(isAdmin) {
  return `
  <div class="card">
    <h2>👥 Shareholder Details</h2>
    <table>
      <thead><tr><th>Name</th><th>Balance</th>${!isAdmin ? '<th>Action</th>' : ''}</tr></thead>
      <tbody>
        ${data.shareholders.map(sh => `
          <tr>
            <td>${sh.name}</td>
            <td class="${sh.balance >= 0 ? 'positive' : 'negative'}">${fmt(sh.balance)}</td>
            ${!isAdmin && user.shareholderId === sh.id ? `<td><button class="btn btn-sm" data-withdraw="${sh.id}">Request Withdrawal</button></td>` : (!isAdmin ? '<td>—</td>' : '')}
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderWithdrawals(isAdmin) {
  const reqs = data.withdrawalRequests.filter(r => isAdmin || r.shareholderId === user.shareholderId);
  return `
  <div class="card">
    <h2>💰 Withdrawal Requests</h2>
    ${reqs.length === 0 ? '<div class="empty">No withdrawal requests yet.</div>' : `
    <table>
      <thead><tr><th>Date</th><th>Shareholder</th><th>Amount</th><th>Status</th>${isAdmin ? '<th>Action</th>' : ''}</tr></thead>
      <tbody>
        ${reqs.map(r => `
          <tr>
            <td>${fmtDate(r.date)}</td>
            <td>${r.shareholderName}</td>
            <td>${fmt(r.amount)}</td>
            <td><span class="badge ${r.status === 'pending' ? 'badge-pending' : 'badge-approved'}">${r.status}</span></td>
            ${isAdmin ? `<td>${r.status === 'pending' ? `<button class="btn btn-sm btn-danger" data-approve="${r.id}">Approve & Pay</button>` : '—'}</td>` : ''}
          </tr>`).join('')}
      </tbody>
    </table>`}
  </div>`;
}

function renderReports(s, isAdmin) {
  const posNeg = v => v >= 0 ? 'positive' : 'negative';
  const sh = user.shareholderId ? data.shareholders.find(x => x.id === user.shareholderId) : null;
  return `
  <div class="two-col">
    <div class="card">
      <h2>🏆 Gold Trading Summary</h2>
      <table>
        <tbody>
          <tr><td>Total Bought</td><td>${fmtG(s.bought)}</td></tr>
          <tr><td>Total Sold</td><td>${fmtG(s.sold)}</td></tr>
          <tr><td>Current Inventory</td><td>${fmtG(s.inventory)}</td></tr>
          <tr><td>Purchase Value</td><td>${fmt(s.goldVal)}</td></tr>
          <tr><td>Sales Revenue</td><td>${fmt(s.salesRev)}</td></tr>
          <tr><td>Gold Profit</td><td class="${posNeg(s.goldProfit)}">${fmt(s.goldProfit)}</td></tr>
        </tbody>
      </table>
    </div>
    <div class="card">
      <h2>📊 Revenue & Expenses</h2>
      <table>
        <tbody>
          <tr><td>Survey Revenue</td><td>${fmt(s.surveyRev)}</td></tr>
          <tr><td>Total Expenses</td><td class="negative">${fmt(s.expenses)}</td></tr>
          <tr><td><strong>Net Profit</strong></td><td class="${posNeg(s.net)}"><strong>${fmt(s.net)}</strong></td></tr>
        </tbody>
      </table>
    </div>
    ${!isAdmin && sh ? `
    <div class="card">
      <h2>👤 Your Balance</h2>
      <div class="stat-value ${posNeg(sh.balance)}" style="font-size:2rem;margin-bottom:16px">${fmt(sh.balance)}</div>
      <button class="btn" data-withdraw="${sh.id}">Request Withdrawal</button>
    </div>` : ''}
  </div>`;
}

// ── EVENTS ───────────────────────────────────────────────────────────────
function attachEvents() {
  // Login
  const loginBtn = document.getElementById('loginBtn');
  if (loginBtn) {
    const doLogin = () => {
      const un = document.getElementById('uname').value.trim();
      const pw = document.getElementById('upass').value;
      if (un === 'admin' && pw === 'admin123') { user = { role: 'admin', name: 'Admin' }; activeTab = 'dashboard'; render(); return; }
      const sh = data.shareholders.find(s => s.name.toLowerCase() === un.toLowerCase() && s.password === pw);
      if (sh) { user = { role: 'shareholder', name: sh.name, shareholderId: sh.id }; activeTab = 'dashboard'; render(); return; }
      document.getElementById('loginErr').textContent = 'Invalid username or password';
    };
    loginBtn.addEventListener('click', doLogin);
    document.getElementById('upass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  }

  // Logout
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', () => { user = null; render(); });

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
  });

  // Transactions
  const addPurchaseBtn = document.getElementById('addPurchaseBtn');
  if (addPurchaseBtn) addPurchaseBtn.addEventListener('click', () => {
    const g = parseFloat(document.getElementById('buyGrams').value);
    const r = parseFloat(document.getElementById('buyRate').value);
    if (!g || !r) { alert('Enter grams and rate'); return; }
    addPurchase(g, r);
  });

  const addSaleBtn = document.getElementById('addSaleBtn');
  if (addSaleBtn) addSaleBtn.addEventListener('click', () => {
    const g = parseFloat(document.getElementById('sellGrams').value);
    const r = parseFloat(document.getElementById('sellRate').value);
    if (!g || !r) { alert('Enter grams and rate'); return; }
    addSale(g, r);
  });

  const addExpBtn = document.getElementById('addExpBtn');
  if (addExpBtn) addExpBtn.addEventListener('click', () => {
    const desc = document.getElementById('expDesc').value.trim();
    const amt = parseFloat(document.getElementById('expAmount').value);
    if (!desc || !amt) { alert('Enter description and amount'); return; }
    addExpense(desc, amt);
  });

  const addSurveyBtn = document.getElementById('addSurveyBtn');
  if (addSurveyBtn) addSurveyBtn.addEventListener('click', () => {
    const amt = parseFloat(document.getElementById('surveyAmount').value);
    if (!amt) { alert('Enter amount'); return; }
    addSurveyRevenue(amt);
  });

  // Withdrawal requests
  document.querySelectorAll('[data-withdraw]').forEach(btn => {
    btn.addEventListener('click', () => {
      const shId = parseInt(btn.dataset.withdraw);
      const sh = data.shareholders.find(s => s.id === shId);
      const amt = parseFloat(prompt(`Enter amount to withdraw (Balance: ${fmt(sh.balance)}):`));
      if (isNaN(amt) || amt <= 0) return;
      requestWithdrawal(shId, amt);
    });
  });

  // Approve withdrawals
  document.querySelectorAll('[data-approve]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (confirm('Approve and pay this withdrawal?')) approveWithdrawal(parseInt(btn.dataset.approve));
    });
  });
}

// ── INIT ─────────────────────────────────────────────────────────────────
render();
</script>

</body>
</html>
