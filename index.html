<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gold Trading Pro | User Management + USD + Exchange</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a07; font-family: 'Inter', system-ui, sans-serif; color: #ece3cf; }
        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 30% 40%, #131210, #020202); padding: 1.5rem; }
        .login-card { background: #131210e6; backdrop-filter: blur(6px); border: 1px solid rgba(218, 185, 105, 0.4); border-radius: 2rem; padding: 2rem; width: 100%; max-width: 420px; }
        .login-card h1 { font-size: 1.9rem; color: #e2bc6e; text-align: center; }
        .field { margin-bottom: 1rem; }
        .field label { font-size: 0.7rem; color: #cdbc8f; display: block; margin-bottom: 6px; }
        .field input { width: 100%; background: #1f1e1a; border: 1px solid #3a3528; padding: 12px 18px; border-radius: 40px; color: #f7efdb; }
        .btn-gold { width: 100%; background: linear-gradient(135deg, #a8822c, #e0b867); border: none; padding: 13px; border-radius: 40px; font-weight: bold; color: #0c0b07; cursor: pointer; }
        .error-msg { color: #f5a67b; font-size: 0.75rem; margin-top: 12px; text-align: center; }
        .app-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: #0e0e0b; border-right: 1px solid #2a261d; position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; overflow-y: auto; }
        .logo-area { padding: 24px 20px; border-bottom: 1px solid #2f2b20; }
        .logo-area h2 { color: #e8c87a; font-size: 1.3rem; }
        .nav-menu { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; }
        .nav-btn { background: none; border: none; padding: 10px 16px; text-align: left; font-size: 0.85rem; color: #cbbf97; border-radius: 34px; cursor: pointer; }
        .nav-btn.active, .nav-btn:hover { background: #25231c; color: #f5de9c; }
        .user-section { padding: 20px; border-top: 1px solid #2b271f; }
        .user-badge { background: #191814; border-radius: 28px; padding: 12px; margin-bottom: 14px; }
        .btn-outline { width: 100%; background: none; border: 1px solid #5f553b; padding: 8px; border-radius: 40px; color: #dcceaa; cursor: pointer; }
        .content-main { margin-left: 280px; padding: 28px 32px; flex: 1; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 28px; }
        .stat-card { background: #12120f; border: 1px solid #2b271f; border-radius: 28px; padding: 1.2rem; cursor: pointer; transition: 0.2s; }
        .stat-card:hover { border-color: #e0b867; }
        .stat-label { font-size: 0.7rem; color: #a3946b; }
        .stat-value { font-size: 1.6rem; font-weight: 700; color: #e9cf8b; }
        .card { background: #11110e; border: 1px solid #2b281f; border-radius: 26px; padding: 1.5rem; margin-bottom: 1.8rem; }
        .card-title { font-size: 1.1rem; border-left: 3px solid #e0b867; padding-left: 12px; margin-bottom: 20px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { font-size: 0.7rem; color: #c7b584; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; background: #1e1d18; border: 1px solid #3f392b; padding: 10px 14px; border-radius: 36px; color: #f2e7cf; }
        .btn-action { background: linear-gradient(100deg, #9e7d30, #d6ae5a); border: none; padding: 12px; border-radius: 40px; font-weight: bold; color: #0c0a04; cursor: pointer; width: 100%; }
        .btn-sm { background: #2a271f; border: 1px solid #7a6b47; padding: 6px 14px; border-radius: 30px; color: #f0daa0; cursor: pointer; font-size: 0.7rem; }
        .btn-danger { background: #5a1e1e; border-color: #a54a4a; color: #ffb4b4; }
        .btn-danger:hover { background: #7a2a2a; }
        .green { color: #8bcb8b; }
        .red { color: #e69474; }
        .muted { color: #8e8160; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #181714; border-radius: 28px; padding: 28px; max-width: 500px; width: 90%; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #2f2b20; }
        .user-row:hover { background: #1c1b16; }
        .password-dots { font-family: monospace; letter-spacing: 2px; color: #c8a96e; }
        .mobile-header { display: none; }
        
        /* Bright Reports */
        .report-container { background: #fef9ef !important; border-radius: 20px !important; padding: 20px !important; color: #1e1b15 !important; }
        .report-header { background: linear-gradient(135deg, #1e5631, #3a7d2c) !important; color: white !important; padding: 18px 22px !important; border-radius: 16px !important; margin-bottom: 20px !important; }
        .report-summary { background: white !important; border-radius: 16px !important; padding: 15px !important; margin-bottom: 20px !important; display: flex !important; gap: 15px !important; flex-wrap: wrap !important; }
        .summary-card { flex: 1 !important; background: #faf7f0 !important; padding: 12px !important; border-radius: 12px !important; text-align: center !important; }
        .transaction-list { background: white !important; border-radius: 16px !important; overflow: hidden !important; border: 1px solid #e2d5bd !important; }
        .transaction-item { border-bottom: 1px solid #eee5d8 !important; padding: 12px 15px !important; display: flex !important; flex-wrap: wrap !important; gap: 10px !important; background: white !important; }
        .transaction-type { font-weight: 600 !important; padding: 3px 10px !important; border-radius: 30px !important; font-size: 0.7rem !important; }
        .transaction-type.GOLD_PURCHASE { background: #fff3e0 !important; color: #e65100 !important; }
        .transaction-type.GOLD_SALE { background: #e8f5e9 !important; color: #2e7d32 !important; }
        .filter-btn { background: white !important; border: 1px solid #d4c5a8 !important; color: #4a3e2c !important; padding: 8px 16px; border-radius: 40px; cursor: pointer; }
        .filter-btn:hover { background: #c8a96e !important; color: white !important; }
        @media print { .sidebar, .mobile-header, .filter-bar, .btn-sm, nav { display: none !important; } }
        @media (max-width: 760px) { .sidebar { transform: translateX(-100%); transition: 0.2s; } .sidebar.open { transform: translateX(0); } .content-main { margin-left: 0; padding: 18px; } .stats-row { grid-template-columns: 1fr 1fr; } .two-col { grid-template-columns: 1fr; } .mobile-header { display: flex; justify-content: space-between; padding: 14px 18px; background: #0e0e0b; position: sticky; top: 0; } }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    // ==================== COMPLETE STATE ====================
    const defaultState = {
        companyCashZMW: 0,
        companyCashUSD: 0,
        exchangeRate: 26.5,
        exchangeLogs: [],
        goldPurchases: [],
        goldSales: [],
        expenses: [],
        surveyRevenues: [],
        deposits: [],
        withdrawalRequests: [],
        cashTransactions: [],
        shareholders: [
            { id: 1, name: "Yuusuf", password: "yuusuf123", balanceZMW: 0 },
            { id: 2, name: "Abdirisak", password: "abdirisak123", balanceZMW: 0 },
            { id: 3, name: "Ahmed", password: "ahmed123", balanceZMW: 0 }
        ],
        adminUser: { name: "Admin", password: "Muhiim1998", role: "admin" },
        managerUser: { name: "Samatar", password: "samatar123", role: "manager" },
        salesReps: ["Samatar", "Yuusuf", "Abdirisak", "Jamal"],
        defaultMashiin: 750,
        defaultTransport: 150,
        // Track next shareholder ID
        nextShareholderId: 4
    };

    let state = JSON.parse(localStorage.getItem('gold_pro_usermanager')) || JSON.parse(JSON.stringify(defaultState));
    let currentUser = null;
    let activeTab = "dashboard";
    let modalData = null;
    let showPasswords = false;

    function persist() { localStorage.setItem('gold_pro_usermanager', JSON.stringify(state)); }

    const formatZMW = (v) => 'K' + (parseFloat(v)||0).toFixed(2);
    const formatUSD = (v) => '$' + (parseFloat(v)||0).toFixed(2);

    function addToCashTransactions(type, amountZMW, amountUSD, description, date) {
        state.cashTransactions.unshift({
            id: Date.now(), date: date || new Date().toISOString(), type, amountZMW, amountUSD, description,
            runningBalanceZMW: state.companyCashZMW,
            runningBalanceUSD: state.companyCashUSD
        });
        persist();
    }

    // ==================== USER MANAGEMENT ====================
    function getAllUsers() {
        const users = [
            { id: 'admin', name: state.adminUser.name, role: 'admin', password: state.adminUser.password, isSystem: true },
            { id: 'manager', name: state.managerUser.name, role: 'manager', password: state.managerUser.password, isSystem: true }
        ];
        state.shareholders.forEach(sh => {
            users.push({ id: sh.id, name: sh.name, role: 'shareholder', password: sh.password, balanceZMW: sh.balanceZMW, isSystem: false });
        });
        return users;
    }

    function changeUserPassword(targetName, newPassword, currentUserRole) {
        // Admin can change anyone, Manager can only change shareholders (not Admin/Manager)
        if (currentUserRole !== 'admin') {
            // Manager can only change shareholders
            const targetIsAdminOrManager = targetName === state.adminUser.name || targetName === state.managerUser.name;
            if (targetIsAdminOrManager) throw new Error("Only Admin can change Admin or Manager passwords");
        }
        
        // Check if target is Admin
        if (state.adminUser.name === targetName) {
            state.adminUser.password = newPassword;
            persist();
            return true;
        }
        // Check Manager
        if (state.managerUser.name === targetName) {
            state.managerUser.password = newPassword;
            persist();
            return true;
        }
        // Check Shareholders
        const shareholder = state.shareholders.find(s => s.name === targetName);
        if (shareholder) {
            shareholder.password = newPassword;
            persist();
            return true;
        }
        throw new Error("User not found");
    }

    function addShareholder(name, password) {
        if (!name || !password) throw new Error("Name and password required");
        if (state.shareholders.some(s => s.name.toLowerCase() === name.toLowerCase())) throw new Error("Shareholder name already exists");
        if (state.adminUser.name.toLowerCase() === name.toLowerCase() || state.managerUser.name.toLowerCase() === name.toLowerCase()) throw new Error("Name conflicts with system user");
        
        const newId = state.nextShareholderId++;
        state.shareholders.push({ id: newId, name: name, password: password, balanceZMW: 0 });
        // Also add to salesReps for purchase dropdown
        if (!state.salesReps.includes(name)) state.salesReps.push(name);
        persist();
        return true;
    }

    function deleteShareholder(shareholderId, currentUserRole) {
        if (currentUserRole !== 'admin') throw new Error("Only Admin can delete shareholders");
        const shareholder = state.shareholders.find(s => s.id === shareholderId);
        if (!shareholder) throw new Error("Shareholder not found");
        if (shareholder.balanceZMW !== 0) throw new Error(`Cannot delete ${shareholder.name} - balance is ${formatZMW(shareholder.balanceZMW)}. Withdraw first.`);
        
        // Remove from salesReps if exists
        const repIndex = state.salesReps.indexOf(shareholder.name);
        if (repIndex !== -1) state.salesReps.splice(repIndex, 1);
        
        state.shareholders = state.shareholders.filter(s => s.id !== shareholderId);
        persist();
        return true;
    }

    // ==================== BUSINESS FUNCTIONS ====================
    function addDeposit(type, source, amountZMW, description, transDate) {
        if (amountZMW <= 0) throw new Error("Amount must be positive");
        if (type === "shareholder") {
            const shareholder = state.shareholders.find(s => s.name === source);
            if (!shareholder) throw new Error("Shareholder not found");
            shareholder.balanceZMW += amountZMW;
            state.companyCashZMW += amountZMW;
            addToCashTransactions("DEPOSIT_SHAREHOLDER", amountZMW, 0, `Deposit from shareholder ${source}`, transDate);
        } else if (type === "loan_payment") {
            state.companyCashZMW += amountZMW;
            addToCashTransactions("DEPOSIT_LOAN", amountZMW, 0, `Loan payment from ${source}`, transDate);
        } else {
            state.companyCashZMW += amountZMW;
            addToCashTransactions("DEPOSIT_EXTERNAL", amountZMW, 0, `External: ${description || source}`, transDate);
        }
        state.deposits.push({ id: Date.now(), date: transDate, type, source, amountZMW, description });
        persist();
    }

    function exchangeCurrency(fromCurr, amount, rate, transDate) {
        if (amount <= 0 || rate <= 0) throw new Error("Invalid amount or rate");
        if (fromCurr === "ZMW") {
            if (state.companyCashZMW < amount) throw new Error(`Insufficient ZMW. Available: ${formatZMW(state.companyCashZMW)}`);
            const usdReceived = amount / rate;
            state.companyCashZMW -= amount;
            state.companyCashUSD += usdReceived;
            addToCashTransactions("EXCHANGE", -amount, usdReceived, `ZMW → USD at rate ${rate}`, transDate);
        } else {
            if (state.companyCashUSD < amount) throw new Error(`Insufficient USD. Available: ${formatUSD(state.companyCashUSD)}`);
            const zmwReceived = amount * rate;
            state.companyCashUSD -= amount;
            state.companyCashZMW += zmwReceived;
            addToCashTransactions("EXCHANGE", zmwReceived, -amount, `USD → ZMW at rate ${rate}`, transDate);
        }
        state.exchangeRate = rate;
        state.exchangeLogs.push({ id: Date.now(), date: transDate, fromCurr, amount, rate });
        persist();
    }

    function recordPurchase(grams, ratePerGram, mashiinAmt, transportAmt, salesRep, transDate) {
        const gross = grams * ratePerGram;
        const netPaid = gross - (mashiinAmt + transportAmt);
        if (netPaid < 0) throw new Error("Deductions exceed value");
        if (state.companyCashZMW < netPaid) throw new Error(`Insufficient ZMW. Need ${formatZMW(netPaid)}`);
        state.goldPurchases.push({
            id: Date.now(), date: transDate, grams, ratePerGram, grossAmount: gross,
            mashiinFee: mashiinAmt, transportFee: transportAmt, netPaid, salesRep, remainingGrams: grams
        });
        state.companyCashZMW -= netPaid;
        addToCashTransactions("GOLD_PURCHASE", -netPaid, 0, `Buy ${grams}g @ ${ratePerGram} ZMW/g, Mashiin:${mashiinAmt}, Transport:${transportAmt}, Rep:${salesRep}`, transDate);
        persist();
    }

    function recordSale(gramsSold, sellRateUSD, conversionChoice, customConvertUSD, transDate) {
        let remaining = gramsSold;
        let totalCostBasisZMW = 0;
        for (let p of state.goldPurchases) {
            if (remaining <= 0) break;
            if (p.remainingGrams <= 0) continue;
            const taken = Math.min(p.remainingGrams, remaining);
            const proportionCost = (taken / p.grams) * p.netPaid;
            totalCostBasisZMW += proportionCost;
            p.remainingGrams -= taken;
            remaining -= taken;
        }
        if (remaining > 0) throw new Error("Insufficient gold inventory");
        const revenueUSD = gramsSold * sellRateUSD;
        const costBasisUSD = totalCostBasisZMW / state.exchangeRate;
        const profitUSD = revenueUSD - costBasisUSD;
        const profitZMW = profitUSD * state.exchangeRate;
        const perShare = profitZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW += perShare);
        
        let usdKept = 0, zmwConverted = 0;
        if (conversionChoice === "keep_all") { usdKept = revenueUSD; state.companyCashUSD += revenueUSD; }
        else if (conversionChoice === "convert_all") { zmwConverted = revenueUSD * state.exchangeRate; state.companyCashZMW += zmwConverted; }
        else if (conversionChoice === "partial" && customConvertUSD > 0) {
            const convertUSD = Math.min(customConvertUSD, revenueUSD);
            zmwConverted = convertUSD * state.exchangeRate;
            usdKept = revenueUSD - convertUSD;
            state.companyCashZMW += zmwConverted;
            state.companyCashUSD += usdKept;
        }
        state.goldSales.push({ id: Date.now(), date: transDate, gramsSold, sellRateUSD, revenueUSD, profitUSD });
        addToCashTransactions("GOLD_SALE", zmwConverted, usdKept, `Sold ${gramsSold}g @ ${sellRateUSD} USD/g, profit ${formatUSD(profitUSD)}`, transDate);
        persist();
    }

    function addExpense(desc, amountZMW, transDate) {
        if (state.companyCashZMW < amountZMW) throw new Error(`Insufficient ZMW`);
        const perShare = amountZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW -= perShare);
        state.expenses.push({ id: Date.now(), date: transDate, description: desc, amountZMW });
        state.companyCashZMW -= amountZMW;
        addToCashTransactions("EXPENSE", -amountZMW, 0, desc, transDate);
        persist();
    }

    function addSurveyRevenue(amountZMW, customerName, transDate) {
        const perShare = amountZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW += perShare);
        state.surveyRevenues.push({ id: Date.now(), date: transDate, amountZMW, customerName });
        state.companyCashZMW += amountZMW;
        addToCashTransactions("SURVEY_REVENUE", amountZMW, 0, `Survey from ${customerName}`, transDate);
        persist();
    }

    function requestWithdrawal(shareholderId, amountZMW) {
        const sh = state.shareholders.find(s => s.id === shareholderId);
        if (!sh || sh.balanceZMW < amountZMW) throw new Error("Insufficient balance");
        state.withdrawalRequests.push({ id: Date.now(), date: new Date().toISOString(), shareholderId, shareholderName: sh.name, amountZMW, status: "pending" });
        persist();
    }

    function approveWithdrawal(reqId) {
        const req = state.withdrawalRequests.find(r => r.id === reqId);
        if (!req || req.status !== "pending") return false;
        const shareholder = state.shareholders.find(s => s.id === req.shareholderId);
        if (!shareholder || shareholder.balanceZMW < req.amountZMW || state.companyCashZMW < req.amountZMW) return false;
        shareholder.balanceZMW -= req.amountZMW;
        state.companyCashZMW -= req.amountZMW;
        req.status = "approved";
        addToCashTransactions("WITHDRAWAL", -req.amountZMW, 0, `Withdrawal by ${shareholder.name}`, new Date().toISOString());
        persist();
        return true;
    }

    // ==================== RENDER ====================
    function render() {
        const root = document.getElementById('root');
        if (!currentUser) {
            root.innerHTML = `<div class="login-screen"><div class="login-card">
                <h1>🏦 Gold Trade Pro</h1>
                <div class="field"><label>Username</label><input id="loginUser" placeholder="Admin / Samatar / Yuusuf" /></div>
                <div class="field"><label>Password</label><input id="loginPass" type="password" /></div>
                <button class="btn-gold" id="loginBtn">Access System</button>
                <div id="loginError" class="error-msg"></div>
            </div></div>`;
            document.getElementById('loginBtn')?.addEventListener('click', () => {
                const user = document.getElementById('loginUser').value.trim();
                const pwd = document.getElementById('loginPass').value;
                if (user === state.adminUser.name && pwd === state.adminUser.password) { currentUser = { name: state.adminUser.name, role: "admin" }; render(); return; }
                if (user === state.managerUser.name && pwd === state.managerUser.password) { currentUser = { name: state.managerUser.name, role: "manager" }; render(); return; }
                const sh = state.shareholders.find(s => s.name.toLowerCase() === user.toLowerCase() && s.password === pwd);
                if (sh) { currentUser = { name: sh.name, role: "shareholder", shareholderId: sh.id }; render(); return; }
                document.getElementById('loginError').innerText = "Invalid credentials";
            });
            return;
        }
        
        const isPriv = (currentUser.role === 'admin' || currentUser.role === 'manager');
        const navItems = [
            { id: "dashboard", label: "📊 Dashboard" }, { id: "purchase", label: "💎 Buy Gold" },
            { id: "sales", label: "💰 Sell Gold" }, { id: "survey", label: "📋 Survey" },
            { id: "deposits", label: "💵 Deposits" }, { id: "exchange", label: "🔄 Exchange" },
            { id: "users", label: "👥 Users" }, { id: "reports", label: "📅 Reports" }, 
            { id: "withdrawals", label: "🏧 Withdrawals" }
        ];
        const navBtns = navItems.map(t => `<button class="nav-btn ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');
        
        let content = "";
        
        // DASHBOARD
        if (activeTab === "dashboard") {
            const totalGoldStock = state.goldPurchases.reduce((a,b)=>a+b.grams,0) - state.goldSales.reduce((a,b)=>a+b.gramsSold,0);
            content = `<div class="stats-row">
                <div class="stat-card" id="clickZMW"><div class="stat-label">💰 ZMW Cash</div><div class="stat-value">${formatZMW(state.companyCashZMW)}</div></div>
                <div class="stat-card" id="clickUSD"><div class="stat-label">💵 USD Cash</div><div class="stat-value">${formatUSD(state.companyCashUSD)}</div></div>
                <div class="stat-card"><div class="stat-label">📦 Gold Stock</div><div class="stat-value">${(parseFloat(totalGoldStock)||0).toFixed(2)} g</div></div>
                <div class="stat-card"><div class="stat-label">💱 Exchange Rate</div><div class="stat-value">1 USD = ${state.exchangeRate.toFixed(2)} ZMW</div></div>
            </div>
            <div class="two-col">
                <div class="card"><div class="card-title">👤 Shareholder Balances (ZMW)</div>${state.shareholders.map(s => `<div style="display:flex;justify-content:space-between;padding:8px 0"><span>${s.name}</span><span class="green">${formatZMW(s.balanceZMW)}</span></div>`).join('')}</div>
                <div class="card"><div class="card-title">📊 Recent Activity</div>${state.cashTransactions.slice(0,6).map(t => `<div style="border-bottom:1px solid #2a261d;padding:6px 0;font-size:0.8rem">${new Date(t.date).toLocaleString().slice(0,10)} | ${t.type.slice(0,15)} | ${formatZMW(t.amountZMW)}</div>`).join('') || '<div class="muted">No transactions</div>'}</div>
            </div>`;
        }
        // USER MANAGEMENT (Admin & Manager can see, but only Admin can delete)
        else if (activeTab === "users" && isPriv) {
            const users = getAllUsers();
            const canDelete = currentUser.role === 'admin';
            content = `<div class="card"><div class="card-title">👥 User Management</div>
                <div style="margin-bottom:20px; padding:12px; background:#1a1a17; border-radius:16px;">
                    <span class="muted">🔐 Admin can change any password & delete shareholders. Manager can change shareholder passwords only.</span>
                    <button class="btn-sm" id="togglePasswords" style="margin-left:15px;">${showPasswords ? '🙈 Hide' : '👁️ Show'} Passwords</button>
                </div>
                <div style="max-height:400px; overflow-y:auto;">
                ${users.map(u => `
                    <div class="user-row">
                        <div><strong>${u.name}</strong> <span class="muted">(${u.role})</span> ${u.balanceZMW !== undefined ? `<span class="green">${formatZMW(u.balanceZMW)}</span>` : ''}</div>
                        <div class="password-dots">${showPasswords ? u.password : '••••••••'}</div>
                        <div><button class="btn-sm" data-change-pwd="${u.name}">Change</button>
                        ${(u.role === 'shareholder' && canDelete) ? `<button class="btn-sm btn-danger" data-del-user="${u.id}" style="margin-left:8px;">Delete</button>` : ''}
                        </div>
                    </div>
                `).join('')}
                </div>
                ${canDelete ? `<div style="margin-top:20px; padding-top:15px; border-top:1px solid #2f2b20;">
                    <h4>➕ Add New Shareholder</h4>
                    <div class="form-group"><label>Full Name</label><input id="newUserName" placeholder="e.g., Hassan" /></div>
                    <div class="form-group"><label>Password</label><input id="newUserPass" type="text" placeholder="password123" /></div>
                    <button class="btn-action" id="addUserBtn">Add Shareholder</button>
                </div>` : ''}
            </div>`;
            setTimeout(() => {
                document.getElementById('togglePasswords')?.addEventListener('click', () => { showPasswords = !showPasswords; render(); });
                document.querySelectorAll('[data-change-pwd]').forEach(btn => btn.addEventListener('click', () => {
                    const targetName = btn.dataset.changePwd;
                    const newPwd = prompt(`Enter new password for ${targetName}:`);
                    if (newPwd && newPwd.trim()) {
                        try { changeUserPassword(targetName, newPwd, currentUser.role); alert(`Password for ${targetName} changed!`); render(); } 
                        catch(e) { alert(e.message); }
                    }
                }));
                if (canDelete) {
                    document.querySelectorAll('[data-del-user]').forEach(btn => btn.addEventListener('click', () => {
                        const id = parseInt(btn.dataset.delUser);
                        if (confirm("Delete this shareholder? They must have zero balance.")) {
                            try { deleteShareholder(id, currentUser.role); render(); } catch(e) { alert(e.message); }
                        }
                    }));
                    document.getElementById('addUserBtn')?.addEventListener('click', () => {
                        const name = document.getElementById('newUserName').value.trim();
                        const pwd = document.getElementById('newUserPass').value.trim();
                        if (!name || !pwd) return alert("Enter name and password");
                        try { addShareholder(name, pwd); alert(`Shareholder ${name} added!`); render(); } catch(e) { alert(e.message); }
                    });
                }
            }, 10);
        }
        // Other tabs (simplified for brevity - they work the same)
        else if (activeTab === "deposits" && isPriv) {
            const today = new Date().toISOString().slice(0,10);
            const shareholderOptions = state.shareholders.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
            content = `<div class="card"><div class="card-title">💵 Cash Deposits</div>
                <div class="form-group"><label>Date</label><input type="date" id="depositDate" value="${today}" /></div>
                <div class="form-group"><label>Type</label><select id="depositType"><option value="shareholder">Shareholder Deposit</option><option value="loan_payment">Loan Payment</option><option value="external">External Deposit</option></select></div>
                <div class="form-group"><label>Source</label><select id="depositSource">${shareholderOptions}</select></div>
                <div class="form-group"><label>Amount (ZMW)</label><input id="depositAmount" type="number" /></div>
                <div class="form-group"><label>Description</label><input id="depositDesc" /></div>
                <button class="btn-action" id="doDeposit">Record Deposit</button></div>`;
            setTimeout(() => { document.getElementById('doDeposit')?.addEventListener('click', () => {
                const type = document.getElementById('depositType').value;
                let source = document.getElementById('depositSource').value;
                const amt = parseFloat(document.getElementById('depositAmount').value);
                const desc = document.getElementById('depositDesc').value;
                const date = document.getElementById('depositDate').value;
                if(!source||!amt) return alert("Fill all");
                try { addDeposit(type, source, amt, desc, date); render(); } catch(e) { alert(e.message); }
            }); }, 10);
        }
        else if (activeTab === "exchange" && isPriv) {
            const today = new Date().toISOString().slice(0,10);
            content = `<div class="card"><div class="card-title">🔄 Currency Exchange</div>
                <div class="form-group"><label>Date</label><input type="date" id="exDate" value="${today}" /></div>
                <div class="form-group"><label>Direction</label><select id="exDir"><option value="ZMW">ZMW → USD</option><option value="USD">USD → ZMW</option></select></div>
                <div class="form-group"><label>Amount</label><input id="exAmount" type="number" /></div>
                <div class="form-group"><label>Rate (1 USD = X ZMW)</label><input id="exRate" value="${state.exchangeRate}" /></div>
                <button class="btn-action" id="doExchange">Exchange</button></div>`;
            setTimeout(() => { document.getElementById('doExchange')?.addEventListener('click', () => {
                const dir = document.getElementById('exDir').value;
                const amt = parseFloat(document.getElementById('exAmount').value);
                const rate = parseFloat(document.getElementById('exRate').value);
                const date = document.getElementById('exDate').value;
                if(!amt||!rate) return;
                try { exchangeCurrency(dir, amt, rate, date); render(); } catch(e) { alert(e.message); }
            }); }, 10);
        }
        else if (activeTab === "purchase" && isPriv) {
            const today = new Date().toISOString().slice(0,10);
            content = `<div class="card"><div class="card-title">🛒 Buy Gold</div>
                <div class="form-group"><label>Date</label><input type="date" id="purchaseDate" value="${today}" /></div>
                <div class="form-group"><label>Grams</label><input id="grams" type="number" /></div>
                <div class="form-group"><label>Rate (ZMW/g)</label><input id="rate" type="number" /></div>
                <div class="form-group"><label>Mashiin</label><input id="mashiin" value="${state.defaultMashiin}" /></div>
                <div class="form-group"><label>Transport</label><input id="transport" value="${state.defaultTransport}" /></div>
                <div class="form-group"><label>Sales Rep</label><select id="rep">${state.salesReps.map(r=>`<option>${r}</option>`).join('')}</select></div>
                <button class="btn-action" id="doPurchase">Record</button></div>`;
            setTimeout(() => { document.getElementById('doPurchase')?.addEventListener('click', () => {
                const g=parseFloat(document.getElementById('grams').value), r=parseFloat(document.getElementById('rate').value);
                const m=parseFloat(document.getElementById('mashiin').value)||0, t=parseFloat(document.getElementById('transport').value)||0, rep=document.getElementById('rep').value, date=document.getElementById('purchaseDate').value;
                if(!g||!r) return;
                try { recordPurchase(g,r,m,t,rep,date); render(); } catch(e) { alert(e.message); }
            }); }, 10);
        }
        else if (activeTab === "sales" && isPriv) {
            const today = new Date().toISOString().slice(0,10);
            content = `<div class="card"><div class="card-title">💰 Sell Gold</div>
                <div class="form-group"><label>Date</label><input type="date" id="saleDate" value="${today}" /></div>
                <div class="form-group"><label>Grams</label><input id="sellGrams" type="number" /></div>
                <div class="form-group"><label>Sell Rate (USD/g)</label><input id="sellRate" type="number" /></div>
                <div class="form-group"><label>Conversion</label><select id="conv"><option value="convert_all">All to ZMW</option><option value="keep_all">Keep USD</option><option value="partial">Partial</option></select></div>
                <div id="partialBox" style="display:none"><input id="partialUsd" type="number" placeholder="USD to convert" /></div>
                <button class="btn-action" id="doSale">Sell</button></div>`;
            setTimeout(() => {
                document.getElementById('conv')?.addEventListener('change', e => document.getElementById('partialBox').style.display = e.target.value === 'partial' ? 'block' : 'none');
                document.getElementById('doSale')?.addEventListener('click', () => {
                    const g=parseFloat(document.getElementById('sellGrams').value), rate=parseFloat(document.getElementById('sellRate').value);
                    const conv=document.getElementById('conv').value, partial=parseFloat(document.getElementById('partialUsd').value)||0, date=document.getElementById('saleDate').value;
                    if(!g||!rate) return;
                    try { recordSale(g,rate,conv,partial,date); render(); } catch(e) { alert(e.message); }
                });
            }, 10);
        }
        else if (activeTab === "survey" && isPriv) {
            const today = new Date().toISOString().slice(0,10);
            content = `<div class="card"><div class="card-title">📋 Survey Revenue</div>
                <div class="form-group"><label>Date</label><input type="date" id="surveyDate" value="${today}" /></div>
                <div class="form-group"><label>Customer</label><input id="custName" /></div>
                <div class="form-group"><label>Amount (ZMW)</label><input id="survAmt" type="number" /></div>
                <button class="btn-action" id="doSurvey">Record</button></div>`;
            setTimeout(() => { document.getElementById('doSurvey')?.addEventListener('click', () => {
                const cust=document.getElementById('custName').value, amt=parseFloat(document.getElementById('survAmt').value), date=document.getElementById('surveyDate').value;
                if(!cust||!amt) return;
                try { addSurveyRevenue(amt,cust,date); render(); } catch(e) { alert(e.message); }
            }); }, 10);
        }
        else if (activeTab === "withdrawals") {
            const reqs = state.withdrawalRequests.filter(r => isPriv || r.shareholderId === currentUser.shareholderId);
            content = `<div class="card"><div class="card-title">🏧 Withdrawals</div>
                ${!isPriv ? `<button class="btn-sm" id="requestWBtn">Request Withdrawal</button>` : ''}
                <table style="width:100%"><thead><tr><th>User</th><th>Amount</th><th>Status</th>${isPriv ? '<th>Action</th>' : ''}</tr></thead>
                <tbody>${reqs.map(r => `<tr><td>${r.shareholderName}</td><td>${formatZMW(r.amountZMW)}</td><td>${r.status}</td>${isPriv && r.status === 'pending' ? `<td><button class="btn-sm" data-apr="${r.id}">Approve</button></td>` : '<td>—</td>'}</tr>`).join('')}</tbody></table></div>`;
            setTimeout(() => {
                if (!isPriv) document.getElementById('requestWBtn')?.addEventListener('click', () => {
                    const amt = parseFloat(prompt("Amount ZMW:"));
                    if(amt) try { requestWithdrawal(currentUser.shareholderId, amt); render(); } catch(e) { alert(e.message); }
                });
                document.querySelectorAll('[data-apr]').forEach(btn => btn.addEventListener('click', (e) => { approveWithdrawal(parseInt(btn.dataset.apr)); render(); }));
            }, 10);
        }
        else if (activeTab === "reports" && isPriv) {
            content = `<div class="card"><div class="card-title">📅 Reports</div><div class="muted">Select date filters to generate report</div><div id="reportOutput"></div></div>`;
        }
        else { content = `<div class="card"><div class="muted">Access restricted</div></div>`; }
        
        root.innerHTML = `<div class="mobile-header"><button id="menuToggle" style="background:none;border:none;font-size:1.6rem;">☰</button><span>Gold Ledger</span><div></div></div>
        <div class="sidebar" id="sidebar"><div class="logo-area"><h2>⚜️ GOLD PRO</h2></div><div class="nav-menu">${navBtns}</div>
        <div class="user-section"><div class="user-badge"><div>${currentUser.name}</div><div style="font-size:0.7rem">${currentUser.role}</div></div>
        <button class="btn-outline" id="logoutBtn">Sign Out</button></div></div>
        <div class="content-main">${content}</div>`;
        
        document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', (e) => { activeTab = btn.dataset.tab; render(); }));
        document.getElementById('logoutBtn')?.addEventListener('click', () => { currentUser = null; render(); });
        document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar')?.classList.toggle('open'));
        document.getElementById('clickZMW')?.addEventListener('click', () => {
            const items = state.cashTransactions.map(t => `${new Date(t.date).toLocaleString()} | ${t.type} | ${t.description} | Balance: ${formatZMW(t.runningBalanceZMW)}`);
            const div = document.createElement('div'); div.className = 'modal'; div.innerHTML = `<div class="modal-content"><h3>ZMW History</h3><div style="max-height:60vh;overflow-y:auto">${items.map(i=>`<div style="padding:6px 0;border-bottom:1px solid #333">${i}</div>`).join('')}</div><button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`;
            document.body.appendChild(div);
        });
        document.getElementById('clickUSD')?.addEventListener('click', () => {
            const items = state.cashTransactions.map(t => `${new Date(t.date).toLocaleString()} | ${t.type} | ${t.description} | Balance: ${formatUSD(t.runningBalanceUSD)}`);
            const div = document.createElement('div'); div.className = 'modal'; div.innerHTML = `<div class="modal-content"><h3>USD History</h3><div style="max-height:60vh;overflow-y:auto">${items.map(i=>`<div style="padding:6px 0;border-bottom:1px solid #333">${i}</div>`).join('')}</div><button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`;
            document.body.appendChild(div);
        });
    }
    render();
</script>
</body>
</html>
