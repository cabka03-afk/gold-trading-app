    <style>
        /* FULL CSS - COMPREHENSIVE PLATFORM STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a07; font-family: 'Inter', system-ui, sans-serif; color: #ece3cf; }
        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 30% 40%, #131210, #020202); padding: 1.5rem; }
        .login-card { background: #131210e6; backdrop-filter: blur(6px); border: 1px solid rgba(218, 185, 105, 0.4); border-radius: 2rem; padding: 2rem; width: 100%; max-width: 420px; }
        .login-card h1 { font-size: 1.9rem; color: #e2bc6e; text-align: center; }
        .field { margin-bottom: 1rem; }

        .field input, .field select { width: 100%; background: #1f1e1a; border: 1px solid #3a3528; padding: 12px 18px; border-radius: 40px; color: #f7efdb; font-size: 1rem; }
        .btn-gold { width: 100%; background: linear-gradient(135deg, #a8822c, #e0b867); border: none; padding: 13px; border-radius: 40px; font-weight: bold; color: #0c0b07; cursor: pointer; font-size: 1rem; }

        .toggle-tab.active { background: #e0b867; color: #0c0b07; }
        
        .sidebar { width: 280px; background: #0e0e0b; border-right: 1px solid #2a261d; position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; overflow-y: auto; }
        .logo-area { padding: 24px 20px; border-bottom: 1px solid #2f2b20; }
        .logo-area h2 { color: #e8c87a; font-size: 1.3rem; }
        .nav-menu { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; }

        .nav-btn.active, .nav-btn:hover { background: #25231c; color: #f5de9c; }
        .user-section { padding: 20px; border-top: 1px solid #2b271f; }

        .content-main { margin-left: 280px; padding: 28px 32px; flex: 1; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 28px; }
        .stat-card { background: #12120f; border: 1px solid #2b271f; border-radius: 28px; padding: 1.2rem; cursor: pointer; transition: 0.2s; }
        .stat-card:hover { border-color: #e0b867; }
        .stat-label { font-size: 0.7rem; color: #a3946b; }
        .stat-value { font-size: 1.6rem; font-weight: 700; color: #e9cf8b; }
        .card { background: #11110e; border: 1px solid #2b281f; border-radius: 26px; padding: 1.5rem; margin-bottom: 1.8rem; }
        .card-title { font-size: 1.1rem; border-left: 3px solid #e0b867; padding-left: 12px; margin-bottom: 20px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { font-size: 0.7rem; color: #c7b584; display: block; margin-bottom: 5px; }
        input, select, textarea { width: 100%; background: #1e1d18; border: 1px solid #3f392b; padding: 10px 14px; border-radius: 36px; color: #f2e7cf; }
        .btn-action { background: linear-gradient(100deg, #9e7d30, #d6ae5a); border: none; padding: 12px; border-radius: 40px; font-weight: bold; color: #0c0a04; cursor: pointer; width: 100%; }
        .btn-sm { background: #2a271f; border: 1px solid #7a6b47; padding: 6px 14px; border-radius: 30px; color: #f0daa0; cursor: pointer; font-size: 0.7rem; }

        .red { color: #e69474; }
        .muted { color: #8e8160; }
        
        /* ========== REPORT DESIGN LAYOUTS ========== */
        .report-container { background: #fef9ef; border-radius: 20px; padding: 20px; color: #1e1b15; margin-top: 15px; }
        .report-header { background: linear-gradient(135deg, #1e5631, #3a7d2c); color: white; padding: 18px 22px; border-radius: 16px; margin-bottom: 20px; }
        .report-header h3 { color: white; font-size: 1.3rem; margin-bottom: 6px; }
        .report-header p { color: rgba(255,255,255,0.85); font-size: 0.8rem; }
        .report-summary { background: white; border-radius: 16px; padding: 15px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2d5bd; }
        .summary-card { flex: 1; background: #faf7f0; padding: 12px; border-radius: 12px; text-align: center; }
        .summary-card .label { font-size: 0.7rem; color: #7a6846; text-transform: uppercase; letter-spacing: 0.05em; }
        .summary-card .value { font-size: 1.6rem; font-weight: bold; }
        .summary-card .value.positive { color: #2b6e2f; }
        .summary-card .value.negative { color: #c0392b; }
        .mashiin-card { background: #fff8e7; border: 1px solid #e8dcc8; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .mashiin-card .label { color: #b8860b; font-size: 0.7rem; text-transform: uppercase; }
        .mashiin-card .value { font-size: 1.3rem; font-weight: bold; color: #8b6914; }
        .transaction-list { background: white; border-radius: 16px; overflow: hidden; border: 1px solid #e2d5bd; }
        .transaction-list-header { background: #efe5d5; padding: 12px 15px; font-weight: bold; color: #5c4a2e; }
        .transaction-item { border-bottom: 1px solid #eee5d8; padding: 12px 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; background: white; }
        .transaction-date { font-size: 0.7rem; color: #8b7a5c; min-width: 140px; }
        .transaction-type { font-weight: 600; padding: 3px 10px; border-radius: 30px; font-size: 0.7rem; text-align: center; min-width: 120px; }
        .transaction-type.PURCHASE { background: #fff3e0; color: #e65100; }
        .transaction-type.SALE { background: #e8f5e9; color: #2e7d32; }
        .transaction-type.SURVEY { background: #e3f2fd; color: #1565c0; }
        .transaction-type.EXPENSE { background: #ffebee; color: #c62828; }
        .transaction-type.DEPOSIT { background: #e0f2f1; color: #00695c; }
        .transaction-type.WITHDRAWAL { background: #fce4ec; color: #ad1457; }
        .transaction-type.EXCHANGE { background: #f3e5f5; color: #6a1b9a; }
        .transaction-desc { flex: 2; font-size: 0.85rem; color: #2c2c2c; margin: 0 10px; }
        .transaction-amount { font-weight: bold; font-size: 1rem; min-width: 100px; text-align: right; }
        .transaction-amount.positive { color: #2e7d32; }
        .transaction-amount.negative { color: #c62828; }
        .report-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; background: #f5efe3; padding: 12px; border-radius: 16px; }
        .filter-btn { background: white; border: 1px solid #d4c5a8; padding: 8px 16px; border-radius: 40px; cursor: pointer; font-size: 0.75rem; color: #4a3e2c; }
        .filter-btn.active { background: #c8a96e; color: white; border-color: #c8a96e; }
        .type-filter-bar { background: #f5efe3; padding: 12px; border-radius: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; }
        .type-filter-bar select { width: auto; background: white; padding: 6px 12px; }
        .sync-status { position: fixed; bottom: 10px; right: 10px; background: #1a1a17; padding: 4px 12px; border-radius: 20px; font-size: 0.65rem; z-index: 100; opacity: 0.8; }
        
        @media (max-width: 760px) { .sidebar { transform: translateX(-100%); transition: 0.2s; } .sidebar.open { transform: translateX(0); } .content-main { margin-left: 0; padding: 18px; } .stats-row { grid-template-columns: 1fr 1fr; } .two-col, .three-col { grid-template-columns: 1fr; } .mobile-header { display: flex; justify-content: space-between; padding: 14px 18px; background: #0e0e0b; position: sticky; top: 0; z-index: 15; } }
    </style>
</head>
<body>
<div id="root"><div class="loading" style="text-align:center; padding:50px; color:#e0b867;">☁️ Connecting to secure cloud ledger...</div></div>
<div id="syncStatus" class="sync-status">🔄 Syncing Engine...</div>

<script>
    // ========== FIREBASE ENGINE CONFIGURATION ==========
    const firebaseConfig = {
        apiKey: "AIzaSyB4uA5m3_1Ps-zaPLF6UWD5X4VOoHn0JxY",
        authDomain: "gold-trading-app-203b8.firebaseapp.com",
        projectId: "gold-trading-app-203b8",
        storageBucket: "gold-trading-app-203b8.firebasestorage.app",
        messagingSenderId: "240340562471",
        appId: "1:240340562471:web:816f7e0026783deccb5402"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Core Registry Remappings
    const settingsRef = db.collection('settings');
    const purchasesRef = db.collection('goldPurchases');
    const salesRef = db.collection('goldSales');
    const expensesRef = db.collection('expenses');
    const surveysRef = db.collection('surveyRevenues');
    const depositsRef = db.collection('deposits');
    const withdrawalsRef = db.collection('withdrawalRequests');
    const cashTransactionsRef = db.collection('cashTransactions');
    const shareholdersRef = db.collection('shareholders');
    
    let currentUser = null;
    let activeTab = "dashboard";
    let showPasswords = false;
    let isMobileMenuOpen = false;
    let loginMode = "shareholder"; // Toggle tracking variable: 'shareholder' or 'admin'
    
    // System Master Cache Object
    let appData = {
        companyCashZMW: 0,
        companyCashUSD: 0,
        exchangeRate: 26.5,
        goldPurchases: [],
        goldSales: [],
        expenses: [],
        surveyRevenues: [],
        withdrawalRequests: [],
        cashTransactions: [],
        shareholders: []
    };
    
    const formatZMW = (v) => 'K' + (parseFloat(v)||0).toFixed(2);
    const formatUSD = (v) => '$' + (parseFloat(v)||0).toFixed(2);
    const formatGrams = (g) => (parseFloat(g)||0).toFixed(2) + ' g';
    const formatTransport = (v) => 'K' + (parseFloat(v)||0).toFixed(2);

    // Bootloader Core Data Fetching Pipeline
    async function loadAllData() {
        try {
            const settingsDoc = await settingsRef.doc('main').get();
            if (settingsDoc.exists) {
                appData.exchangeRate = settingsDoc.data().exchangeRate || 26.5;
            }
            
            const shareholdersSnap = await shareholdersRef.get();
            appData.shareholders = [];
            if (shareholdersSnap.empty) {
                const defaults = [
                    { id: 1, name: "Yuusuf", password: "yuusuf123", balanceZMW: 0 },
                    { id: 2, name: "Abdirisak", password: "abdirisak123", balanceZMW: 0 },
                    { id: 3, name: "Ahmed", password: "ahmed123", balanceZMW: 0 }
                ];
                for (const sh of defaults) {
                    await shareholdersRef.doc(sh.id.toString()).set(sh);
                    appData.shareholders.push(sh);
                }
            } else {
                shareholdersSnap.forEach(doc => appData.shareholders.push({ id: parseInt(doc.id), ...doc.data() }));
            }
            
            const purchasesSnap = await purchasesRef.orderBy('date', 'desc').get();
            appData.goldPurchases = purchasesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const salesSnap = await salesRef.orderBy('date', 'desc').get();
            appData.goldSales = salesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const expensesSnap = await expensesRef.orderBy('date', 'desc').get();
            appData.expenses = expensesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const surveysSnap = await surveysRef.orderBy('date', 'desc').get();
            appData.surveyRevenues = surveysSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const withdrawalsSnap = await withdrawalsRef.orderBy('date', 'desc').get();
            appData.withdrawalRequests = withdrawalsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const transactionsSnap = await cashTransactionsRef.orderBy('date', 'desc').limit(500).get();
            appData.cashTransactions = transactionsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            document.getElementById('syncStatus').innerHTML = '✅ Vault Protected';
            if (currentUser) { renderApp(); } else { showLogin(); }
        } catch(e) {
            console.error(e);
            document.getElementById('syncStatus').innerHTML = '⚠️ Local Safe Mode';
            if (currentUser) { renderApp(); } else { showLogin(); }
        }
    }
    
    async function saveSettings() {
        await settingsRef.doc('main').set({ exchangeRate: appData.exchangeRate });
    }
    
    async function addCashTransaction(type, amountZMW, amountUSD, description, date) {
        const trans = { id: Date.now().toString(), date: date || new Date().toISOString(), type, amountZMW, amountUSD, description };
        appData.cashTransactions.unshift(trans);
        await cashTransactionsRef.doc(trans.id).set(trans);
    }
    
    // User Provision Pipeline
    async function addShareholder(name, password) {
        if (!name || !password) throw new Error("Credentials missing");
        if (appData.shareholders.some(s => s.name.toLowerCase() === name.toLowerCase()) || name.toLowerCase() === 'admin') throw new Error("Identifier name restricted or taken");
        const newId = Math.max(...appData.shareholders.map(s=>s.id), 0) + 1;
        const newSh = { id: newId, name, password, balanceZMW: 0 };
        await shareholdersRef.doc(newId.toString()).set(newSh);
        appData.shareholders.push(newSh);
        return true;
    }
    
    async function deleteShareholder(id) {
        const sh = appData.shareholders.find(s => s.id === id);
        if (!sh) throw new Error("Not found");
        if (sh.balanceZMW !== 0) throw new Error(`Cannot delete: Account contains active balance ${formatZMW(sh.balanceZMW)}`);
        await shareholdersRef.doc(id.toString()).delete();
        appData.shareholders = appData.shareholders.filter(s => s.id !== id);
        return true;
    }
    
    // Operations Logic Modules
    async function addDeposit(type, source, amount, desc, date) {
        if (amount <= 0) throw new Error("Amount must be positive");
        if (type === "shareholder") {
            const sh = appData.shareholders.find(s => s.name === source);
            if (!sh) throw new Error("Shareholder matching profile not found");
            sh.balanceZMW += amount;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
            await addCashTransaction("DEPOSIT", amount, 0, `Equity Injection from ${source}`, date);
        } else {
            await addCashTransaction("DEPOSIT", amount, 0, `External Liquidity: ${desc || source}`, date);
        }
        await loadAllData();
    }
    
    async function exchangeCurrency(fromCurr, amount, rate, date) {
        if (amount <= 0 || rate <= 0) throw new Error("Invalid pricing array data elements");
        if (fromCurr === "ZMW") {
            if (appData.companyCashZMW < amount) throw new Error("Insufficient local ZMW treasury depth");
            const usdReceived = amount / rate;
            await addCashTransaction("EXCHANGE", -amount, usdReceived, `Treasury Swapped ZMW → USD @ ${rate}`, date);
        } else {
            if (appData.companyCashUSD < amount) throw new Error("Insufficient international USD asset portfolio depth");
            const zmwReceived = amount * rate;
            await addCashTransaction("EXCHANGE", zmwReceived, -amount, `Treasury Swapped USD → ZMW @ ${rate}`, date);
        }
        appData.exchangeRate = rate;
        await saveSettings();
        await loadAllData();
    }
    
    async function recordPurchase(g, r, m, t, rep, date) {
        const gross = g * r;
        const net = gross - (m + t);
        if (net < 0) throw new Error("Deduction vectors exceed procurement evaluation value");
        if (appData.companyCashZMW < net) throw new Error("Insufficient procurement ZMW cash stack available");
        const purchase = { id: Date.now().toString(), date, grams: g, ratePerGram: r, grossAmount: gross, mashiinFee: m, transportFee: t, netPaid: net, salesRep: rep, remainingGrams: g };
        await purchasesRef.doc(purchase.id).set(purchase);
        await addCashTransaction("PURCHASE", -net, 0, `Buy ${g}g @ ${r} ZMW/g | Rep: ${rep}`, date);
        await loadAllData();
    }
    
    async function recordSale(g, rate, convChoice, partialUsd, date) {
        let remaining = g;
        let costZMW = 0;
        
        // Audit inventory depletion array tracking FIFO logic
        for (let p of appData.goldPurchases) {
            if (remaining <= 0) break;
            if (p.remainingGrams <= 0) continue;
            const taken = Math.min(p.remainingGrams, remaining);
            costZMW += (taken / p.grams) * p.netPaid;
            p.remainingGrams -= taken;
            await purchasesRef.doc(p.id).update({ remainingGrams: p.remainingGrams });
            remaining -= taken;
        }
        if (remaining > 0) throw new Error("Procurement volume depth violation: Insufficient gold inventory in warehouse stack.");
        
        const revenueUSD = g * rate;
        const costUSD = costZMW / appData.exchangeRate;
        const profitUSD = revenueUSD - costUSD;
        const profitZMW = profitUSD * appData.exchangeRate;
        const perShare = profitZMW / appData.shareholders.length;
        
        for (const sh of appData.shareholders) {
            sh.balanceZMW += perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        
        let usdKept = 0, zmwConverted = 0;
        if (convChoice === "keep_all") { usdKept = revenueUSD; }
        else if (convChoice === "convert_all") { zmwConverted = revenueUSD * appData.exchangeRate; }
        else if (convChoice === "partial") {
            const convertUSD = Math.min(partialUsd, revenueUSD);
            zmwConverted = convertUSD * appData.exchangeRate;
            usdKept = revenueUSD - convertUSD;
        }
        
        await salesRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date, gramsSold: g, sellRateUSD: rate, revenueUSD, profitUSD });
        await addCashTransaction("SALE", zmwConverted, usdKept, `Sold ${g}g @ ${rate} USD/g | Shared Dividend Profit: ${formatZMW(profitZMW)}`, date);
        await loadAllData();
    }
    
    async function addExpense(desc, amt, date) {
        if (amt <= 0) throw new Error("Value entry metric must be positive");
        if (appData.companyCashZMW < amt) throw new Error("Ledger balance sheet capacity constraint: Insufficient ZMW funds");
        const perShare = amt / appData.shareholders.length;
        for (const sh of appData.shareholders) {
            sh.balanceZMW -= perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        await expensesRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date, description: desc, amountZMW: amt });
        await addCashTransaction("EXPENSE", -amt, 0, `Corporate Expense: ${desc}`, date);
        await loadAllData();
    }
    
    async function addSurveyRevenue(amt, cust, date) {
        const perShare = amt / appData.shareholders.length;
        for (const sh of appData.shareholders) {
            sh.balanceZMW += perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        await surveysRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date, amountZMW: amt, customerName: cust });
        await addCashTransaction("SURVEY", amt, 0, `Geological Survey Service Fee cleared from ${cust}`, date);
        await loadAllData();
    }
    
    async function requestWithdrawal(id, amt) {
        const sh = appData.shareholders.find(s => s.id === id);
        if (!sh || sh.balanceZMW < amt) throw new Error("Requested transaction depth exceeds authorized equity threshold");
        const req = { id: Date.now().toString(), date: new Date().toISOString(), shareholderId: id, shareholderName: sh.name, amountZMW: amt, status: "pending" };
        await withdrawalsRef.doc(req.id).set(req);
        await loadAllData();
    }
    
    async function approveWithdrawal(reqId) {
        const req = appData.withdrawalRequests.find(r => r.id === reqId);
        if (!req || req.status !== "pending") return;
        const sh = appData.shareholders.find(s => s.id === req.shareholderId);
        if (!sh || sh.balanceZMW < req.amountZMW || appData.companyCashZMW < req.amountZMW) throw new Error("Distribution routing constraint: Insufficient core asset capital pools.");
        sh.balanceZMW -= req.amountZMW;
        await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        req.status = "approved";
        await withdrawalsRef.doc(req.id).update({ status: "approved" });
        await addCashTransaction("WITHDRAWAL", -req.amountZMW, 0, `Shareholder Dividend Distribution Paid to ${sh.name}`, new Date().toISOString());
        await loadAllData();
    }
    
    // Login Interface Rendering Controller Engine
    function showLogin() {
        let options = appData.shareholders.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        
        let dynamicField = loginMode === "shareholder" ? `
            <div class="field">
                <label>SELECT REGISTERED SHAREHOLDER</label>
                <select id="loginUser">${options}</select>
            </div>
        ` : `
            <div class="field">
                <label>ADMIN ACCESS IDENTIFIER</label>
                <input type="text" id="loginUserText" value="Admin" readonly style="background:#151412; border-color:#d4af37; color:#d4af37; font-weight:bold; text-align:center;">
            </div>
        `;

        document.getElementById('root').innerHTML = `
            <div class="login-screen">
                <div class="login-card">
                    <h1>🏆 Gold Trading Pro</h1>
                    <p style="text-align:center; font-size:0.8rem; color:#a3946b; margin-bottom:20px;">Secure Management Portal</p>
                    
                    <div class="login-toggle-bar">
                        <button class="toggle-tab ${loginMode==='shareholder'?'active':''}" onclick="loginMode='shareholder'; showLogin();">Shareholder</button>
                        <button class="toggle-tab ${loginMode==='admin'?'active':''}" onclick="loginMode='admin'; showLogin();">System Admin</button>
                    </div>

                    <form id="loginForm">
                        ${dynamicField}
                        <div class="field">
                            <label>SECURITY PASS KEY</label>
                            <input type="password" id="loginPass" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn-gold" style="margin-top:10px;">AUTHORIZE SECURE LOGON</button>
                        <div id="loginError" class="error-msg"></div>
                    </form>
                </div>
            </div>`;
            
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

    // Reports Compiler Engine Core Functional Pipeline Logic Module
    let currentStart = null, currentEnd = null, currentType = "all";
    
    function getRange(filter) {
        const today = new Date();
        if (filter === 'today') { let s=new Date(); s.setHours(0,0,0,0); let e=new Date(); e.setHours(23,59,59,999); return {start:s, end:e}; }
        if (filter === 'yesterday') { let s=new Date(); s.setDate(today.getDate()-1); s.setHours(0,0,0,0); let e=new Date(s); e.setHours(23,59,59,999); return {start:s, end:e}; }
        if (filter === 'thisMonth') { return {start: new Date(today.getFullYear(), today.getMonth(), 1), end: new Date(today.getFullYear(), today.getMonth()+1, 0)}; }
        if (filter === 'lastMonth') { return {start: new Date(today.getFullYear(), today.getMonth()-1, 1), end: new Date(today.getFullYear(), today.getMonth(), 0)}; }
        if (filter === 'thisYear') { return {start: new Date(today.getFullYear(), 0, 1), end: new Date(today.getFullYear(), 11, 31)}; }
        return {start: new Date(0), end: new Date()};
    }
    
    function generateReport() {
        let filtered = appData.cashTransactions.filter(t => {
            if (!currentStart || !currentEnd) return true;
            const d = new Date(t.date);
            return d >= currentStart && d <= currentEnd;
        });
        if (currentType !== "all") filtered = filtered.filter(t => t.type === currentType);
        
        const totalIn = filtered.reduce((s,t)=> s + (t.amountZMW > 0 ? t.amountZMW : 0), 0);
        const totalOut = filtered.reduce((s,t)=> s + (t.amountZMW < 0 ? -t.amountZMW : 0), 0);
        
        const filteredPurchases = appData.goldPurchases.filter(p => {
            const d = new Date(p.date);
            return (!currentStart || !currentEnd) || (d >= currentStart && d <= currentEnd);
        });
        const periodMashiin = filteredPurchases.reduce((s,p)=> s + (p.mashiinFee||0), 0);
        const periodTransport = filteredPurchases.reduce((s,p)=> s + (p.transportFee||0), 0);
        const totalMashiin = appData.goldPurchases.reduce((s,p)=> s + (p.mashiinFee||0), 0);
        const totalTransport = appData.goldPurchases.reduce((s,p)=> s + (p.transportFee||0), 0);
        
        const repSummary = {};
        filteredPurchases.forEach(p => {
            if (!repSummary[p.salesRep]) repSummary[p.salesRep] = { count: 0, totalGrams: 0, totalMashiin: 0 };
            repSummary[p.salesRep].count++;
            repSummary[p.salesRep].totalGrams += p.grams;
            repSummary[p.salesRep].totalMashiin += (p.mashiinFee||0);
        });
        
        const customerSummary = {};
        const filteredSurveys = appData.surveyRevenues.filter(s => {
            const d = new Date(s.date);
            return (!currentStart || !currentEnd) || (d >= currentStart && d <= currentEnd);
        });
        filteredSurveys.forEach(s => {
            if (!customerSummary[s.customerName]) customerSummary[s.customerName] = { count: 0, total: 0 };
            customerSummary[s.customerName].count++;
            customerSummary[s.customerName].total += s.amountZMW;
        });
        
        document.getElementById('reportOutput').innerHTML = `
        <div class="report-container">
            <div class="report-header">
                <h3>📊 Business Audit Ledger Report</h3>
                <p>${currentStart && currentEnd ? currentStart.toLocaleDateString() + ' → ' + currentEnd.toLocaleDateString() : 'Comprehensive System Scope'} | Class Categorization: ${currentType}</p>
            </div>
            <div class="report-summary">
                <div class="summary-card"><div class="label">💰 Operational Inflows</div><div class="value positive">${formatZMW(totalIn)}</div></div>
                <div class="summary-card"><div class="label">📉 Operational Outflows</div><div class="value negative">${formatZMW(totalOut)}</div></div>
                <div class="summary-card"><div class="label">📈 Delta Operational Profit</div><div class="value ${(totalIn-totalOut)>=0?'positive':'negative'}">${formatZMW(totalIn-totalOut)}</div></div>
            </div>
            <div class="mashiin-card">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap;">
                    <div><div class="label">⚙️ GLOBAL MASHIIN DEPRECIATION EXPENSE</div><div class="value">${formatZMW(totalMashiin)}</div></div>
                    <div><div class="label">🚚 GLOBAL LOGISTICS TRANSPORT FEES</div><div class="value">${formatTransport(totalTransport)}</div></div>
                </div>
            </div>
            <div class="three-col" style="margin-bottom:20px;">
                <div style="background:white; border-radius:16px; padding:15px; border:1px solid #e2d5bd;">
                    <h4 style="margin-bottom:10px; color:#5c4a2e;">Sales Representative Metrics</h4>
                    ${Object.entries(repSummary).map(([rep, d]) => `<div style="display:flex; justify-content:space-between; padding:5px 0; font-size:0.8rem; border-bottom:1px solid #f4eedf;"><span>${rep}</span><strong>${d.totalGrams.toFixed(2)}g (${d.count} runs)</strong></div>`).join('') || '<div class="muted">No data parameters found</div>'}
                </div>
                <div style="background:white; border-radius:16px; padding:15px; border:1px solid #e2d5bd;">
                    <h4 style="margin-bottom:10px; color:#5c4a2e;">Survey Metrics by Client</h4>
                    ${Object.entries(customerSummary).map(([cust, d]) => `<div style="display:flex; justify-content:space-between; padding:5px 0; font-size:0.8rem; border-bottom:1px solid #f4eedf;"><span>${cust}</span><strong>${formatZMW(d.total)}</strong></div>`).join('') || '<div class="muted">No data parameters found</div>'}
                </div>
                <div style="background:white; border-radius:16px; padding:15px; border:1px solid #e2d5bd;">
                    <h4 style="margin-bottom:10px; color:#5c4a2e;">Foreign Exchange Benchmarks</h4>
                    <div style="font-size:1.2rem; font-weight:bold; color:#1e5631; margin-bottom:5px;">1 USD = ${appData.exchangeRate.toFixed(2)} ZMW</div>
                    <p style="font-size:0.75rem;" class="muted">ZMW Liquid Reserve: ${formatZMW(appData.companyCashZMW)}<br>USD Offshore Base: ${formatUSD(appData.companyCashUSD)}</p>
                </div>
            </div>
            <div class="transaction-list">
                <div class="transaction-list-header">📋 LEDGER STREAM TRANSCRIPT (${filtered.length} entries)</div>
                ${filtered.map(t => `<div class="transaction-item">
                    <div class="transaction-date">${new Date(t.date).toLocaleString()}</div>
                    <div class="transaction-type ${t.type}">${t.type}</div>
                    <div class="transaction-desc">${t.description || ''}</div>
                    <div class="transaction-amount ${t.amountZMW >= 0 ? 'positive' : 'negative'}">
                        ${t.amountUSD !== 0 ? formatUSD(t.amountUSD) : formatZMW(t.amountZMW)}
                    </div>
                </div>`).join('')}
            </div>
        </div>`;
    }

    // Operational Form Submissions Handler Mappings
    function setupEvents() {
        document.getElementById('logoutBtn').addEventListener('click', () => { currentUser = null; showLogin(); });
        document.getElementById('menuToggle')?.addEventListener('click', () => {
            isMobileMenuOpen = !isMobileMenuOpen;
            document.getElementById('sidebar').classList.toggle('open', isMobileMenuOpen);
        });
        
        document.getElementById('navMenu').addEventListener('click', (e) => {
            const tab = e.target.getAttribute('data-tab');
            if (tab) {
                activeTab = tab;
                isMobileMenuOpen = false;
                renderApp();
            }
        });

        document.getElementById('purchaseForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await recordPurchase(
                    parseFloat(document.getElementById('pGrams').value),
                    parseFloat(document.getElementById('pRate').value),
                    parseFloat(document.getElementById('pMashiin').value),
                    parseFloat(document.getElementById('pTransport').value),
                    document.getElementById('pRep').value,
                    document.getElementById('pDate').value
                );
                alert("✅ Purchase Run Evaluated and Dispatched");
            } catch(err) { alert("❌ System Reject Error: " + err.message); }
        });

        document.getElementById('saleForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await recordSale(
                    parseFloat(document.getElementById('sGrams').value),
                    parseFloat(document.getElementById('sRate').value),
                    document.getElementById('sConv').value,
                    parseFloat(document.getElementById('sPartUsd').value),
                    document.getElementById('sDate').value
                );
                alert("✅ Export Settlement Finished & Capital Shared");
            } catch(err) { alert("❌ System Reject Error: " + err.message); }
        });

        document.getElementById('exchangeForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await exchangeCurrency(
                    document.getElementById('eTrack').value,
                    parseFloat(document.getElementById('eAmt').value),
                    parseFloat(document.getElementById('eRate').value),
                    document.getElementById('eDate').value
                );
                alert("✅ Swap Executed Successfully");
            } catch(err) { alert("❌ System Reject Error: " + err.message); }
        });

        document.getElementById('surveyForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addSurveyRevenue(
                    parseFloat(document.getElementById('suAmt').value),
                    document.getElementById('suCust').value,
                    document.getElementById('suDate').value
                );
                alert("✅ Survey transaction mapped and saved.");
            } catch(err) { alert("❌ System Reject Error: " + err.message); }
        });

        document.getElementById('expenseForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addExpense(
                    document.getElementById('exDesc').value,
                    parseFloat(document.getElementById('exAmt').value),
                    document.getElementById('exDate').value
                );
                alert("✅ Corporate expenditure metrics balanced.");
            } catch(err) { alert("❌ System Reject Error: " + err.message); }
        });

        document.getElementById('depositForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addDeposit(
                    document.getElementById('dType').value,
                    document.getElementById('dType').value === 'shareholder' ? document.getElementById('dShSource').value : document.getElementById('dDesc').value,
                    parseFloat(document.getElementById('dAmt').value),
                    document.getElementById('dDesc').value,
                    document.getElementById('dDate').value
                );
                alert("✅ Deposit Stream Allocation Matrix Inflow verified.");
            } catch(err) { alert("❌ System Reject Error: " + err.message); }
        });

        document.getElementById('userForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addShareholder(document.getElementById('uName').value, document.getElementById('uPass').value);
                alert("✅ Security matrix protocol generated. Node saved.");
                renderApp();
            } catch(err) { alert("❌ Registration Blocked: " + err.message); }
        });

        document.getElementById('withdrawForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await requestWithdrawal(currentUser.id, parseFloat(document.getElementById('wAmt').value));
                alert("✅ Distribution entry queued.");
            } catch(err) { alert("❌ System Reject Error: " + err.message); }
        });
    }

    function setReportRange(range) {
        const bounds = getRange(range);
        currentStart = bounds.start;
        currentEnd = bounds.end;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        if(event && event.target) event.target.classList.add('active');
        generateReport();
    }

    async function handleDeleteShareholder(id) {
        if (!confirm("⚠️ De-authorize login vector? This drops individual node data matrix connections.")) return;
        try {
            await deleteShareholder(id);
            alert("✅ Shareholder account revoked.");
            renderApp();
        } catch(e) { alert("❌ Action Revoked: " + e.message); }
    }

    async function handleApproveWithdrawal(id) {
        if (!confirm("⚠️ Finalize distribution payload payout routing sequence?")) return;
        try {
            await approveWithdrawal(id);
            alert("✅ Distribution completed successfully.");
        } catch(e) { alert("❌ Transfer Blocked: " + e.message); }
    }

    // Initialize Boot Sequence Execution Call
    loadAllData();
</script>
</body>
</html>
