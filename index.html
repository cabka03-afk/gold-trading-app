<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gold Trading Pro | Full System</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a07; font-family: 'Inter', system-ui, sans-serif; color: #ece3cf; }
        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 30% 40%, #131210, #020202); padding: 1.5rem; }
        .login-card { background: #131210e6; backdrop-filter: blur(6px); border: 1px solid rgba(218, 185, 105, 0.4); border-radius: 2rem; padding: 2rem; width: 100%; max-width: 420px; }
        .login-card h1 { font-size: 1.9rem; color: #e2bc6e; text-align: center; }
        .field { margin-bottom: 1rem; }
        .field label { font-size: 0.7rem; color: #cdbc8f; display: block; margin-bottom: 6px; }
        .field input { width: 100%; background: #1f1e1a; border: 1px solid #3a3528; padding: 12px 18px; border-radius: 40px; color: #f7efdb; font-size: 1rem; }
        .btn-gold { width: 100%; background: linear-gradient(135deg, #a8822c, #e0b867); border: none; padding: 13px; border-radius: 40px; font-weight: bold; color: #0c0b07; cursor: pointer; font-size: 1rem; }
        .error-msg { color: #f5a67b; font-size: 0.8rem; margin-top: 12px; text-align: center; }
        .sidebar { width: 280px; background: #0e0e0b; border-right: 1px solid #2a261d; position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; overflow-y: auto; }
        .logo-area { padding: 24px 20px; border-bottom: 1px solid #2f2b20; }
        .logo-area h2 { color: #e8c87a; font-size: 1.3rem; }
        .nav-menu { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; }
        .nav-btn { background: none; border: none; padding: 10px 16px; text-align: left; font-size: 0.85rem; color: #cbbf97; border-radius: 34px; cursor: pointer; }
        .nav-btn.active, .nav-btn:hover { background: #25231c; color: #f5de9c; }
        .user-section { padding: 20px; border-top: 1px solid #2b271f; }
        .user-badge { background: #191814; border-radius: 28px; padding: 12px; margin-bottom: 14px; }
        .btn-outline { width: 100%; background: none; border: 1px solid #5f553b; padding: 8px; border-radius: 40px; color: #dcceaa; cursor: pointer; }
        .content-main { margin-left: 280px; padding: 28px 32px; flex: 1; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 28px; }
        .stat-card { background: #12120f; border: 1px solid #2b271f; border-radius: 28px; padding: 1.2rem; cursor: pointer; transition: 0.2s; }
        .stat-card:hover { border-color: #e0b867; }
        .stat-label { font-size: 0.7rem; color: #a3946b; }
        .stat-value { font-size: 1.6rem; font-weight: 700; color: #e9cf8b; }
        .card { background: #11110e; border: 1px solid #2b281f; border-radius: 26px; padding: 1.5rem; margin-bottom: 1.8rem; }
        .card-title { font-size: 1.1rem; border-left: 3px solid #e0b867; padding-left: 12px; margin-bottom: 20px; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { font-size: 0.7rem; color: #c7b584; display: block; margin-bottom: 5px; }
        input, select { width: 100%; background: #1e1d18; border: 1px solid #3f392b; padding: 10px 14px; border-radius: 36px; color: #f2e7cf; }
        .btn-action { background: linear-gradient(100deg, #9e7d30, #d6ae5a); border: none; padding: 12px; border-radius: 40px; font-weight: bold; color: #0c0a04; cursor: pointer; width: 100%; }
        .btn-sm { background: #2a271f; border: 1px solid #7a6b47; padding: 6px 14px; border-radius: 30px; color: #f0daa0; cursor: pointer; font-size: 0.7rem; }
        .green { color: #8bcb8b; }
        .muted { color: #8e8160; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #181714; border-radius: 28px; padding: 28px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .mobile-header { display: none; }
        .loading { text-align: center; padding: 50px; color: #e2bc6e; font-size: 1.2rem; }
        .sync-status { position: fixed; bottom: 10px; right: 10px; background: #1a1a17; padding: 4px 12px; border-radius: 20px; font-size: 0.65rem; z-index: 100; }
        .report-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; padding: 15px; background: #1a1a17; border-radius: 16px; }
        .filter-btn { background: #2a271f; border: 1px solid #7a6b47; padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 0.75rem; color: #f0daa0; }
        .filter-btn:hover { background: #c8a96e; color: #0c0b07; }
        .transaction-item { border-bottom: 1px solid #2a261d; padding: 12px; display: flex; flex-wrap: wrap; justify-content: space-between; }
        .transaction-positive { color: #8bcb8b; }
        .transaction-negative { color: #e69474; }
        @media (max-width: 760px) { .sidebar { transform: translateX(-100%); transition: 0.2s; } .sidebar.open { transform: translateX(0); } .content-main { margin-left: 0; padding: 18px; } .stats-row { grid-template-columns: 1fr 1fr; } .two-col { grid-template-columns: 1fr; } .mobile-header { display: flex; justify-content: space-between; padding: 14px 18px; background: #0e0e0b; position: sticky; top: 0; z-index: 15; } }
    </style>
</head>
<body>
<div id="root"></div>
<div id="syncStatus" class="sync-status">🔄 Connecting...</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyB4uA5m3_1Ps-zaPLF6UWD5X4VOoHn0JxY",
        authDomain: "gold-trading-app-203b8.firebaseapp.com",
        projectId: "gold-trading-app-203b8",
        storageBucket: "gold-trading-app-203b8.firebasestorage.app",
        messagingSenderId: "240340562471",
        appId: "1:240340562471:web:816f7e0026783deccb5402"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    // Collections
    const settingsRef = db.collection('settings');
    const purchasesRef = db.collection('goldPurchases');
    const salesRef = db.collection('goldSales');
    const expensesRef = db.collection('expenses');
    const surveysRef = db.collection('surveyRevenues');
    const depositsRef = db.collection('deposits');
    const withdrawalsRef = db.collection('withdrawalRequests');
    const cashTransactionsRef = db.collection('cashTransactions');
    const shareholdersRef = db.collection('shareholders');
    
    let currentUser = null;
    let activeTab = "dashboard";
    let isLoading = true;
    let appData = {
        companyCashZMW: 0,
        companyCashUSD: 0,
        exchangeRate: 26.5,
        goldPurchases: [],
        goldSales: [],
        expenses: [],
        surveyRevenues: [],
        deposits: [],
        withdrawalRequests: [],
        cashTransactions: [],
        shareholders: []
    };
    
    const formatZMW = (v) => 'K' + (parseFloat(v)||0).toFixed(2);
    const formatUSD = (v) => '$' + (parseFloat(v)||0).toFixed(2);
    
    async function loadAllData() {
        try {
            const settingsDoc = await settingsRef.doc('main').get();
            if (settingsDoc.exists) {
                appData.companyCashZMW = settingsDoc.data().companyCashZMW || 0;
                appData.companyCashUSD = settingsDoc.data().companyCashUSD || 0;
                appData.exchangeRate = settingsDoc.data().exchangeRate || 26.5;
            } else {
                await settingsRef.doc('main').set({ companyCashZMW: 0, companyCashUSD: 0, exchangeRate: 26.5 });
            }
            
            const shareholdersSnap = await shareholdersRef.get();
            appData.shareholders = [];
            if (shareholdersSnap.empty) {
                const defaults = [
                    { id: 1, name: "Yuusuf", password: "yuusuf123", balanceZMW: 0 },
                    { id: 2, name: "Abdirisak", password: "abdirisak123", balanceZMW: 0 },
                    { id: 3, name: "Ahmed", password: "ahmed123", balanceZMW: 0 }
                ];
                for (const sh of defaults) {
                    await shareholdersRef.doc(sh.id.toString()).set(sh);
                    appData.shareholders.push(sh);
                }
            } else {
                shareholdersSnap.forEach(doc => appData.shareholders.push({ id: parseInt(doc.id), ...doc.data() }));
            }
            
            const purchasesSnap = await purchasesRef.orderBy('date', 'desc').get();
            appData.goldPurchases = purchasesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const salesSnap = await salesRef.orderBy('date', 'desc').get();
            appData.goldSales = salesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const expensesSnap = await expensesRef.orderBy('date', 'desc').get();
            appData.expenses = expensesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const surveysSnap = await surveysRef.orderBy('date', 'desc').get();
            appData.surveyRevenues = surveysSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const depositsSnap = await depositsRef.orderBy('date', 'desc').get();
            appData.deposits = depositsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const withdrawalsSnap = await withdrawalsRef.orderBy('date', 'desc').get();
            appData.withdrawalRequests = withdrawalsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const transactionsSnap = await cashTransactionsRef.orderBy('date', 'desc').limit(200).get();
            appData.cashTransactions = transactionsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            isLoading = false;
            document.getElementById('syncStatus').innerHTML = '✅ Cloud Ready';
            setTimeout(() => { const s = document.getElementById('syncStatus'); if(s) s.style.opacity = '0.6'; }, 2000);
            
            if (currentUser) {
                renderApp();
            } else {
                showLogin();
            }
        } catch(e) {
            console.error(e);
            document.getElementById('syncStatus').innerHTML = '⚠️ Offline';
            isLoading = false;
            if (currentUser) {
                renderApp();
            } else {
                showLogin();
            }
        }
    }
    
    async function saveSettings() {
        await settingsRef.doc('main').set({
            companyCashZMW: appData.companyCashZMW,
            companyCashUSD: appData.companyCashUSD,
            exchangeRate: appData.exchangeRate
        });
    }
    
    async function addCashTransaction(type, amountZMW, amountUSD, description, date) {
        const trans = { id: Date.now().toString(), date: date || new Date().toISOString(), type, amountZMW, amountUSD, description, runningBalanceZMW: appData.companyCashZMW, runningBalanceUSD: appData.companyCashUSD };
        appData.cashTransactions.unshift(trans);
        await cashTransactionsRef.doc(trans.id).set(trans);
    }
    
    async function addDeposit(type, source, amountZMW, description, transDate) {
        if (amountZMW <= 0) throw new Error("Amount positive");
        if (type === "shareholder") {
            const sh = appData.shareholders.find(s => s.name === source);
            if (!sh) throw new Error("Shareholder not found");
            sh.balanceZMW += amountZMW;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
            appData.companyCashZMW += amountZMW;
            await saveSettings();
            await addCashTransaction("DEPOSIT_SHAREHOLDER", amountZMW, 0, `Deposit from ${source}`, transDate);
        } else {
            appData.companyCashZMW += amountZMW;
            await saveSettings();
            await addCashTransaction("DEPOSIT_EXTERNAL", amountZMW, 0, `External: ${description || source}`, transDate);
        }
        await depositsRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date: transDate, type, source, amountZMW, description });
        renderApp();
    }
    
    async function exchangeCurrency(fromCurr, amount, rate, transDate) {
        if (amount <= 0 || rate <= 0) throw new Error("Invalid");
        if (fromCurr === "ZMW") {
            if (appData.companyCashZMW < amount) throw new Error("Insufficient ZMW");
            const usdReceived = amount / rate;
            appData.companyCashZMW -= amount;
            appData.companyCashUSD += usdReceived;
            await saveSettings();
            await addCashTransaction("EXCHANGE", -amount, usdReceived, `ZMW → USD at rate ${rate}`, transDate);
        } else {
            if (appData.companyCashUSD < amount) throw new Error("Insufficient USD");
            const zmwReceived = amount * rate;
            appData.companyCashUSD -= amount;
            appData.companyCashZMW += zmwReceived;
            await saveSettings();
            await addCashTransaction("EXCHANGE", zmwReceived, -amount, `USD → ZMW at rate ${rate}`, transDate);
        }
        appData.exchangeRate = rate;
        await saveSettings();
        renderApp();
    }
    
    async function recordPurchase(g, r, m, t, rep, date) {
        const gross = g * r;
        const net = gross - (m + t);
        if (net < 0) throw new Error("Deductions exceed value");
        if (appData.companyCashZMW < net) throw new Error(`Insufficient ZMW`);
        const purchase = { id: Date.now().toString(), date, grams: g, ratePerGram: r, grossAmount: gross, mashiinFee: m, transportFee: t, netPaid: net, salesRep: rep, remainingGrams: g };
        await purchasesRef.doc(purchase.id).set(purchase);
        appData.goldPurchases.unshift(purchase);
        appData.companyCashZMW -= net;
        await saveSettings();
        await addCashTransaction("GOLD_PURCHASE", -net, 0, `Buy ${g}g @ ${r} ZMW/g, Mashiin:${m}, Transport:${t}`, date);
        renderApp();
    }
    
    async function recordSale(g, sellRateUSD, conversionChoice, customConvertUSD, date) {
        let remaining = g;
        let totalCostBasisZMW = 0;
        for (let p of appData.goldPurchases) {
            if (remaining <= 0) break;
            if (p.remainingGrams <= 0) continue;
            const taken = Math.min(p.remainingGrams, remaining);
            const proportionCost = (taken / p.grams) * p.netPaid;
            totalCostBasisZMW += proportionCost;
            p.remainingGrams -= taken;
            await purchasesRef.doc(p.id).update({ remainingGrams: p.remainingGrams });
            remaining -= taken;
        }
        if (remaining > 0) throw new Error("Insufficient gold inventory");
        
        const revenueUSD = g * sellRateUSD;
        const costBasisUSD = totalCostBasisZMW / appData.exchangeRate;
        const profitUSD = revenueUSD - costBasisUSD;
        const profitZMW = profitUSD * appData.exchangeRate;
        const perShare = profitZMW / appData.shareholders.length;
        for (const sh of appData.shareholders) {
            sh.balanceZMW += perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        
        let usdKept = 0, zmwConverted = 0;
        if (conversionChoice === "keep_all") { usdKept = revenueUSD; appData.companyCashUSD += revenueUSD; }
        else if (conversionChoice === "convert_all") { zmwConverted = revenueUSD * appData.exchangeRate; appData.companyCashZMW += zmwConverted; }
        else if (conversionChoice === "partial" && customConvertUSD > 0) {
            const convertUSD = Math.min(customConvertUSD, revenueUSD);
            zmwConverted = convertUSD * appData.exchangeRate;
            usdKept = revenueUSD - convertUSD;
            appData.companyCashZMW += zmwConverted;
            appData.companyCashUSD += usdKept;
        }
        await saveSettings();
        
        const sale = { id: Date.now().toString(), date, gramsSold: g, sellRateUSD, revenueUSD, profitUSD, conversionChoice, usdKept, zmwConverted };
        await salesRef.doc(sale.id).set(sale);
        appData.goldSales.unshift(sale);
        await addCashTransaction("GOLD_SALE", zmwConverted, usdKept, `Sold ${g}g @ ${sellRateUSD} USD/g, profit ${formatUSD(profitUSD)}`, date);
        renderApp();
    }
    
    async function addExpense(desc, amt, date) {
        if (amt <= 0) throw new Error("Amount positive");
        if (appData.companyCashZMW < amt) throw new Error(`Insufficient ZMW`);
        const perShare = amt / appData.shareholders.length;
        for (const sh of appData.shareholders) {
            sh.balanceZMW -= perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        await expensesRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date, description: desc, amountZMW: amt });
        appData.companyCashZMW -= amt;
        await saveSettings();
        await addCashTransaction("EXPENSE", -amt, 0, desc, date);
        renderApp();
    }
    
    async function addSurveyRevenue(amt, cust, date) {
        const perShare = amt / appData.shareholders.length;
        for (const sh of appData.shareholders) {
            sh.balanceZMW += perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        await surveysRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date, amountZMW: amt, customerName: cust });
        appData.companyCashZMW += amt;
        await saveSettings();
        await addCashTransaction("SURVEY_REVENUE", amt, 0, `Survey from ${cust}`, date);
        renderApp();
    }
    
    async function requestWithdrawal(id, amt) {
        const sh = appData.shareholders.find(s => s.id === id);
        if (!sh || sh.balanceZMW < amt) throw new Error("Insufficient balance");
        const req = { id: Date.now().toString(), date: new Date().toISOString(), shareholderId: id, shareholderName: sh.name, amountZMW: amt, status: "pending" };
        await withdrawalsRef.doc(req.id).set(req);
        appData.withdrawalRequests.unshift(req);
        renderApp();
    }
    
    async function approveWithdrawal(reqId) {
        const req = appData.withdrawalRequests.find(r => r.id === reqId);
        if (!req || req.status !== "pending") return;
        const sh = appData.shareholders.find(s => s.id === req.shareholderId);
        if (!sh || sh.balanceZMW < req.amountZMW || appData.companyCashZMW < req.amountZMW) return;
        sh.balanceZMW -= req.amountZMW;
        await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        appData.companyCashZMW -= req.amountZMW;
        await saveSettings();
        req.status = "approved";
        await withdrawalsRef.doc(req.id).update({ status: "approved" });
        await addCashTransaction("WITHDRAWAL", -req.amountZMW, 0, `Withdrawal by ${sh.name}`, new Date().toISOString());
        renderApp();
    }
    
    function showLogin() {
        const root = document.getElementById('root');
        root.innerHTML = `<div class="login-screen"><div class="login-card">
            <h1>🏦 Gold Trade Pro</h1>
            <div class="field"><label>Username</label><input id="loginUser" placeholder="Enter username" /></div>
            <div class="field"><label>Password</label><input id="loginPass" type="password" placeholder="Enter password" /></div>
            <button class="btn-gold" id="loginBtn">🔓 Access System</button>
            <div id="loginError" class="error-msg"></div>
            <div class="muted" style="text-align:center; margin-top:20px; font-size:0.7rem;">
                <strong>🔐 Login Credentials:</strong><br>
                Admin / Muhiim1998 (Full Access)<br>
                Samatar / samatar123 (Manager)<br>
                Yuusuf / yuusuf123 | Abdirisak / abdirisak123 | Ahmed / ahmed123
            </div>
        </div></div>`;
        
        document.getElementById('loginBtn')?.addEventListener('click', () => {
            const user = document.getElementById('loginUser').value.trim();
            const pwd = document.getElementById('loginPass').value;
            if (user === "Admin" && pwd === "Muhiim1998") { currentUser = { name: "Admin", role: "admin" }; loadAllData(); return; }
            if (user === "Samatar" && pwd === "samatar123") { currentUser = { name: "Samatar", role: "manager" }; loadAllData(); return; }
            const sh = appData.shareholders.find(s => s.name === user && s.password === pwd);
            if (sh) { currentUser = { name: sh.name, role: "shareholder", shareholderId: sh.id }; loadAllData(); return; }
            document.getElementById('loginError').innerText = "❌ Invalid username or password";
        });
        document.getElementById('loginPass')?.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });
    }
    
    function renderApp() {
        const root = document.getElementById('root');
        const isPriv = currentUser?.role === 'admin' || currentUser?.role === 'manager';
        const navItems = ["dashboard","purchase","sales","exchange","survey","expenses","deposits","reports","withdrawals"];
        const nav = navItems.map(t => `<button class="nav-btn ${activeTab===t?'active':''}" data-tab="${t}">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('');
        const today = new Date().toISOString().slice(0,10);
        let content = '';
        
        if (activeTab === 'dashboard') {
            const stock = appData.goldPurchases.reduce((a,b)=>a+b.grams,0) - appData.goldSales.reduce((a,b)=>a+b.gramsSold,0);
            content = `<div class="stats-row">
                <div class="stat-card" id="clickZMW"><div class="stat-label">💰 ZMW Cash</div><div class="stat-value">${formatZMW(appData.companyCashZMW)}</div></div>
                <div class="stat-card" id="clickUSD"><div class="stat-label">💵 USD Cash</div><div class="stat-value">${formatUSD(appData.companyCashUSD)}</div></div>
                <div class="stat-card"><div class="stat-label">📦 Gold Stock</div><div class="stat-value">${stock.toFixed(2)} g</div></div>
                <div class="stat-card"><div class="stat-label">💱 Rate</div><div class="stat-value">1 USD = ${appData.exchangeRate.toFixed(2)}</div></div>
            </div>
            <div class="two-col"><div class="card"><div class="card-title">👤 Shareholders</div>${appData.shareholders.map(s=>`<div style="display:flex;justify-content:space-between;padding:8px 0"><span>${s.name}</span><span class="green">${formatZMW(s.balanceZMW)}</span></div>`).join('')}</div>
            <div class="card"><div class="card-title">📊 Recent Transactions</div>${appData.cashTransactions.slice(0,8).map(t=>`<div style="padding:8px 0;border-bottom:1px solid #2a261d;font-size:0.8rem">${new Date(t.date).toLocaleString()} | ${t.type.replace(/_/g,' ')} | ${formatZMW(t.amountZMW)}</div>`).join('') || '<div class="muted">No transactions yet. Add a deposit to start!</div>'}</div></div>`;
        }
        else if (activeTab === 'purchase' && isPriv) {
            content = `<div class="card"><div class="card-title">🛒 Buy Gold (ZMW)</div>
                <div class="form-group"><label>Date</label><input type="date" id="pDate" value="${today}" /></div>
                <div class="form-group"><label>Grams</label><input id="grams" type="number" placeholder="0.00" /></div>
                <div class="form-group"><label>Rate (ZMW/gram)</label><input id="rate" type="number" placeholder="0.00" /></div>
                <div class="form-group"><label>Mashiin Fee (ZMW)</label><input id="mashiin" value="750" /></div>
                <div class="form-group"><label>Transport Fee (ZMW)</label><input id="transport" value="150" /></div>
                <div class="form-group"><label>Sales Rep</label><select id="rep">${["Samatar","Yuusuf","Abdirisak","Jamal"].map(r=>`<option>${r}</option>`).join('')}</select></div>
                <button class="btn-action" id="doPurchase">✅ Record Purchase</button>
                <div class="muted" style="margin-top:12px;">💰 Net Payment = (Grams × Rate) - Mashiin - Transport</div></div>`;
        }
        else if (activeTab === 'sales' && isPriv) {
            content = `<div class="card"><div class="card-title">💰 Sell Gold (USD)</div>
                <div class="form-group"><label>Date</label><input type="date" id="saleDate" value="${today}" /></div>
                <div class="form-group"><label>Grams</label><input id="sellGrams" type="number" placeholder="0.00" /></div>
                <div class="form-group"><label>Sell Rate (USD/gram)</label><input id="sellRate" type="number" placeholder="0.00" /></div>
                <div class="form-group"><label>USD Conversion</label><select id="conv">
                    <option value="convert_all">🔄 Convert All to ZMW</option>
                    <option value="keep_all">💵 Keep All as USD</option>
                    <option value="partial">⚡ Partial: Convert Some to ZMW</option>
                </select></div>
                <div id="partialBox" style="display:none"><div class="form-group"><label>USD to Convert to ZMW</label><input id="partialUsd" type="number" placeholder="0.00" /></div></div>
                <button class="btn-action" id="doSale">💲 Sell & Distribute Profit</button>
                <div class="muted" style="margin-top:12px;">💰 Profit calculated in USD, converted to ZMW at ${appData.exchangeRate} rate, distributed equally to shareholders.</div></div>`;
        }
        else if (activeTab === 'exchange' && isPriv) {
            content = `<div class="card"><div class="card-title">🔄 Currency Exchange</div>
                <div class="form-group"><label>Date</label><input type="date" id="exDate" value="${today}" /></div>
                <div class="form-group"><label>Direction</label><select id="exDir"><option value="ZMW">ZMW → USD (Sell ZMW, Buy USD)</option><option value="USD">USD → ZMW (Sell USD, Buy ZMW)</option></select></div>
                <div class="form-group"><label>Amount (source currency)</label><input id="exAmount" type="number" placeholder="0.00" /></div>
                <div class="form-group"><label>Exchange Rate (1 USD = X ZMW)</label><input id="exRate" value="${appData.exchangeRate}" step="0.01" /></div>
                <button class="btn-action" id="doExchange">💱 Execute Exchange</button>
                <div class="muted" style="margin-top:12px;">💰 Current: ZMW ${formatZMW(appData.companyCashZMW)} | USD ${formatUSD(appData.companyCashUSD)}</div></div>`;
        }
        else if (activeTab === 'survey' && isPriv) {
            content = `<div class="card"><div class="card-title">📋 Survey Revenue (ZMW)</div>
                <div class="form-group"><label>Date</label><input type="date" id="survDate" value="${today}" /></div>
                <div class="form-group"><label>Customer Name</label><input id="custName" placeholder="Customer name" /></div>
                <div class="form-group"><label>Amount (ZMW)</label><input id="survAmt" type="number" placeholder="0.00" /></div>
                <button class="btn-action" id="doSurvey">💰 Add & Distribute to Shareholders</button>
                <div class="muted" style="margin-top:12px;">💰 Revenue distributed equally to all shareholders.</div></div>`;
        }
        else if (activeTab === 'expenses' && isPriv) {
            content = `<div class="card"><div class="card-title">📉 Expenses (ZMW)</div>
                <div class="form-group"><label>Date</label><input type="date" id="expDate" value="${today}" /></div>
                <div class="form-group"><label>Description</label><input id="expDesc" placeholder="e.g., Rent, Utilities, Salaries" /></div>
                <div class="form-group"><label>Amount (ZMW)</label><input id="expAmt" type="number" placeholder="0.00" /></div>
                <button class="btn-action" id="doExpense">📝 Record Expense</button>
                <div class="muted" style="margin-top:12px;">⚠️ Expense reduces company cash AND each shareholder's balance equally.</div></div>`;
        }
        else if (activeTab === 'deposits' && isPriv) {
            content = `<div class="card"><div class="card-title">💵 Cash Deposits</div>
                <div class="form-group"><label>Date</label><input type="date" id="depDate" value="${today}" /></div>
                <div class="form-group"><label>Type</label><select id="depType"><option value="shareholder">💰 Shareholder Deposit (increases their balance)</option><option value="external">💵 External Deposit (company cash only)</option></select></div>
                <div class="form-group"><label id="sourceLabel">Select Shareholder</label><select id="depSource">${appData.shareholders.map(s=>`<option>${s.name}</option>`).join('')}</select></div>
                <div class="form-group"><label>Amount (ZMW)</label><input id="depAmt" type="number" placeholder="0.00" /></div>
                <div class="form-group"><label>Description (optional)</label><input id="depDesc" placeholder="Notes" /></div>
                <button class="btn-action" id="doDeposit">💳 Record Deposit</button>
                <div class="muted" style="margin-top:12px;">💡 Tip: Add a deposit to fund company cash first!</div></div>`;
        }
        else if (activeTab === 'reports' && isPriv) {
            const totalMashiin = appData.goldPurchases.reduce((s,p)=>s+(p.mashiinFee||0),0);
            const totalTransport = appData.goldPurchases.reduce((s,p)=>s+(p.transportFee||0),0);
            content = `<div class="card"><div class="card-title">📅 Reports & Analytics</div>
                <div class="report-filters">
                    <button class="filter-btn" data-filter="today">📅 Today</button>
                    <button class="filter-btn" data-filter="yesterday">📆 Yesterday</button>
                    <button class="filter-btn" data-filter="thisMonth">📆 This Month</button>
                    <button class="filter-btn" data-filter="lastMonth">📆 Last Month</button>
                    <button class="filter-btn" data-filter="thisYear">📅 This Year</button>
                </div>
                <div style="background:#1a1a17; padding:12px; border-radius:16px; margin-bottom:15px; display:flex; gap:20px; flex-wrap:wrap;">
                    <div>⚙️ Total Mashiin: <strong style="color:#e9cf8b">${formatZMW(totalMashiin)}</strong></div>
                    <div>🚚 Total Transport: <strong style="color:#e9cf8b">${formatZMW(totalTransport)}</strong></div>
                    <div>💱 Current Rate: <strong style="color:#e9cf8b">1 USD = ${appData.exchangeRate.toFixed(2)} ZMW</strong></div>
                </div>
                <div style="margin-bottom:15px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
                    <label style="font-size:0.75rem;">📌 Filter by Type:</label>
                    <select id="reportTypeFilter" style="width:auto;">
                        <option value="all">📊 All Transactions</option>
                        <option value="GOLD_PURCHASE">💎 Gold Purchases</option>
                        <option value="GOLD_SALE">💰 Gold Sales</option>
                        <option value="SURVEY_REVENUE">📋 Survey Revenue</option>
                        <option value="EXPENSE">📉 Expenses</option>
                        <option value="DEPOSIT_SHAREHOLDER">💵 Deposits</option>
                        <option value="WITHDRAWAL">🏧 Withdrawals</option>
                        <option value="EXCHANGE">🔄 Exchange</option>
                    </select>
                    <button class="btn-sm" id="applyTypeFilter">Apply Filter</button>
                    <button class="btn-sm" id="printReport">🖨️ Print Report</button>
                </div>
                <div id="reportOutput" style="max-height:500px; overflow-y:auto;"></div>
            </div>`;
        }
        else if (activeTab === 'withdrawals') {
            const reqs = appData.withdrawalRequests.filter(r => isPriv || r.shareholderId === currentUser?.shareholderId);
            content = `<div class="card"><div class="card-title">🏧 Withdrawals (ZMW)</div>
                ${!isPriv ? `<button class="btn-sm" id="reqBtn" style="margin-bottom:15px;">➕ Request Withdrawal</button>` : ''}
                <table style="width:100%"><thead><tr><th>User</th><th>Amount</th><th>Status</th>${isPriv?'<th>Action</th>':''}</tr></thead>
                <tbody>${reqs.map(r=>`<tr><td>${r.shareholderName}</td><td>${formatZMW(r.amountZMW)}</td><td>${r.status}</td>${isPriv && r.status==='pending' ? `<td><button class="btn-sm" data-apr="${r.id}">Approve</button></td>` : '<td>—</td>'}</tr>`).join('')}</tbody></tr></div>`;
        }
        
        root.innerHTML = `<div class="mobile-header"><button id="menuToggle" style="background:none;border:none;font-size:1.6rem;">☰</button><span>⚜️ GOLD PRO</span><div></div></div>
        <div class="sidebar" id="sidebar"><div class="logo-area"><h2>⚜️ GOLD PRO</h2></div><div class="nav-menu">${nav}</div>
        <div class="user-section"><div class="user-badge"><div>👤 ${currentUser?.name || 'User'}</div><div style="font-size:0.65rem;">${currentUser?.role || ''}</div></div>
        <button class="btn-outline" id="logoutBtn">🚪 Sign Out</button></div></div>
        <div class="content-main">${content}</div>`;
        
        document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { activeTab = b.dataset.tab; renderApp(); }));
        document.getElementById('logoutBtn')?.addEventListener('click', () => { currentUser = null; showLogin(); });
        document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar')?.classList.toggle('open'));
        
        // Purchase
        if (activeTab === 'purchase' && isPriv) {
            document.getElementById('doPurchase')?.addEventListener('click', async () => {
                try { await recordPurchase(parseFloat(document.getElementById('grams').value), parseFloat(document.getElementById('rate').value), parseFloat(document.getElementById('mashiin').value)||0, parseFloat(document.getElementById('transport').value)||0, document.getElementById('rep').value, document.getElementById('pDate').value); } catch(e) { alert(e.message); }
            });
        }
        // Sales
        if (activeTab === 'sales' && isPriv) {
            document.getElementById('conv')?.addEventListener('change', e => document.getElementById('partialBox').style.display = e.target.value === 'partial' ? 'block' : 'none');
            document.getElementById('doSale')?.addEventListener('click', async () => {
                try { await recordSale(parseFloat(document.getElementById('sellGrams').value), parseFloat(document.getElementById('sellRate').value), document.getElementById('conv').value, parseFloat(document.getElementById('partialUsd').value)||0, document.getElementById('saleDate').value); } catch(e) { alert(e.message); }
            });
        }
        // Exchange
        if (activeTab === 'exchange' && isPriv) {
            document.getElementById('doExchange')?.addEventListener('click', async () => {
                try { await exchangeCurrency(document.getElementById('exDir').value, parseFloat(document.getElementById('exAmount').value), parseFloat(document.getElementById('exRate').value), document.getElementById('exDate').value); } catch(e) { alert(e.message); }
            });
        }
        // Survey
        if (activeTab === 'survey' && isPriv) {
            document.getElementById('doSurvey')?.addEventListener('click', async () => {
                try { await addSurveyRevenue(parseFloat(document.getElementById('survAmt').value), document.getElementById('custName').value, document.getElementById('survDate').value); } catch(e) { alert(e.message); }
            });
        }
        // Expenses
        if (activeTab === 'expenses' && isPriv) {
            document.getElementById('doExpense')?.addEventListener('click', async () => {
                try { await addExpense(document.getElementById('expDesc').value, parseFloat(document.getElementById('expAmt').value), document.getElementById('expDate').value); } catch(e) { alert(e.message); }
            });
        }
        // Deposits
        if (activeTab === 'deposits' && isPriv) {
            document.getElementById('doDeposit')?.addEventListener('click', async () => {
                try { await addDeposit(document.getElementById('depType').value, document.getElementById('depSource').value, parseFloat(document.getElementById('depAmt').value), document.getElementById('depDesc').value, document.getElementById('depDate').value); } catch(e) { alert(e.message); }
            });
        }
        // Withdrawals
        if (activeTab === 'withdrawals' && !isPriv) {
            document.getElementById('reqBtn')?.addEventListener('click', async () => {
                const amt = parseFloat(prompt("Enter amount to withdraw (ZMW):")); if(amt) try { await requestWithdrawal(currentUser.shareholderId, amt); } catch(e) { alert(e.message); }
            });
        }
        if (activeTab === 'withdrawals' && isPriv) {
            document.querySelectorAll('[data-apr]').forEach(b => b.addEventListener('click', async () => { await approveWithdrawal(b.dataset.apr); }));
        }
        // Reports
        if (activeTab === 'reports' && isPriv) {
            let currentFilter = 'thisMonth';
            function generateReport() {
                const typeFilter = document.getElementById('reportTypeFilter')?.value || 'all';
                let filtered = [...appData.cashTransactions];
                if (typeFilter !== 'all') filtered = filtered.filter(t => t.type === typeFilter);
                const totalIn = filtered.reduce((s,t)=> s + (t.amountZMW > 0 ? t.amountZMW : 0), 0);
                const totalOut = filtered.reduce((s,t)=> s + (t.amountZMW < 0 ? -t.amountZMW : 0), 0);
                document.getElementById('reportOutput').innerHTML = `
                    <div style="background:#f5efe3; padding:15px; border-radius:16px; color:#1e1b15;">
                        <h4 style="margin-bottom:10px;">📊 Report Summary</h4>
                        <div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:20px;">
                            <div><strong>💰 Total Inflows:</strong> <span style="color:#2e7d32;">${formatZMW(totalIn)}</span></div>
                            <div><strong>📉 Total Outflows:</strong> <span style="color:#c62828;">${formatZMW(totalOut)}</span></div>
                            <div><strong>📈 Net:</strong> <span style="color:${(totalIn-totalOut)>=0?'#2e7d32':'#c62828'}">${formatZMW(totalIn-totalOut)}</span></div>
                        </div>
                        <div style="max-height:400px; overflow-y:auto;">
                            ${filtered.map(t => `<div style="border-bottom:1px solid #ddd; padding:10px;">
                                <div>${new Date(t.date).toLocaleString()}</div>
                                <div><strong>${t.type.replace(/_/g,' ')}</strong> - ${t.description}</div>
                                <div class="${t.amountZMW>=0?'transaction-positive':'transaction-negative'}">${t.amountZMW>=0?'+':''}${formatZMW(t.amountZMW)}</div>
                            </div>`).join('')}
                            ${filtered.length === 0 ? '<div style="text-align:center; padding:40px;">No transactions found</div>' : ''}
                        </div>
                    </div>`;
            }
            document.getElementById('applyTypeFilter')?.addEventListener('click', () => generateReport());
            document.getElementById('printReport')?.addEventListener('click', () => window.print());
            generateReport();
        }
        
        document.getElementById('clickZMW')?.addEventListener('click', () => {
            const div = document.createElement('div'); div.className = 'modal'; div.innerHTML = `<div class="modal-content"><h3>💰 ZMW Cash History</h3>${appData.cashTransactions.map(t=>`<div style="padding:8px 0;border-bottom:1px solid #333;">${new Date(t.date).toLocaleString()} | ${t.type} | ${formatZMW(t.amountZMW)} | Balance: ${formatZMW(t.runningBalanceZMW)}</div>`).join('')}<button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`;
            document.body.appendChild(div);
        });
        document.getElementById('clickUSD')?.addEventListener('click', () => {
            const div = document.createElement('div'); div.className = 'modal'; div.innerHTML = `<div class="modal-content"><h3>💵 USD Cash History</h3>${appData.cashTransactions.map(t=>`<div style="padding:8px 0;border-bottom:1px solid #333;">${new Date(t.date).toLocaleString()} | ${t.type} | ${formatUSD(t.amountUSD)} | Balance: ${formatUSD(t.runningBalanceUSD)}</div>`).join('')}<button class="btn-sm" onclick="this.closest('.modal').remove()">Close</button></div>`;
            document.body.appendChild(div);
        });
    }
    
    loadAllData();
</script>
</body>
</html>
