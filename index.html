};

// ═══════════════════════════════════════════════
// FORMATTERS
// ═══════════════════════════════════════════════
const fZ = v => 'K' + (+v||0).toFixed(2);
const fU = v => '$' + (+v||0).toFixed(2);
const fG = v => (+v||0).toFixed(4) + 'g';
const fD = s => s ? new Date(s).toLocaleDateString() : '-';
const fDT = s => s ? new Date(s).toLocaleString() : '-';
const today = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// ═══════════════════════════════════════════════
// LOAD
// ═══════════════════════════════════════════════
async function loadAll() {
  try {
    const sd = await C.settings.doc('main').get();
    if (sd.exists) { const d=sd.data(); D.cashZMW=d.cashZMW||0; D.cashUSD=d.cashUSD||0; D.rate=d.rate||26.5; }
    else await C.settings.doc('main').set({cashZMW:0,cashUSD:0,rate:26.5});

    const shSnap = await C.shareholders.get();
    D.shareholders = [];
    if (shSnap.empty) {
      const defs = [{id:1,name:"Yuusuf",password:"yuusuf123",balZMW:0},{id:2,name:"Abdirisak",password:"abdirisak123",balZMW:0},{id:3,name:"Ahmed",password:"ahmed123",balZMW:0}];
      for (const s of defs) { await C.shareholders.doc(s.id.toString()).set(s); D.shareholders.push(s); }
    } else { shSnap.forEach(d=>D.shareholders.push({id:parseInt(d.id),...d.data()})); }

    const [pS,sS,eS,svS,dpS,wS,txS,lS,aS,prS] = await Promise.all([
      C.purchases.orderBy('date','asc').get(),
      C.sales.orderBy('date','desc').get(),
      C.expenses.orderBy('date','desc').get(),
      C.surveys.orderBy('date','desc').get(),
      C.deposits.orderBy('date','desc').get(),
      C.withdrawals.orderBy('date','desc').get(),
      C.cashTx.orderBy('date','desc').limit(500).get(),
      C.ledger.orderBy('date','desc').limit(500).get(),
      C.audit.orderBy('date','desc').limit(200).get(),
      C.periods.orderBy('year','desc').get()
    ]);
    D.purchases  = pS.docs.map(d=>({id:d.id,...d.data()}));
    D.sales      = sS.docs.map(d=>({id:d.id,...d.data()}));
    D.expenses   = eS.docs.map(d=>({id:d.id,...d.data()}));
    D.surveys    = svS.docs.map(d=>({id:d.id,...d.data()}));
    D.deposits   = dpS.docs.map(d=>({id:d.id,...d.data()}));
    D.withdrawals= wS.docs.map(d=>({id:d.id,...d.data()}));
    D.cashTx     = txS.docs.map(d=>({id:d.id,...d.data()}));
    D.ledger     = lS.docs.map(d=>({id:d.id,...d.data()}));
    D.audit      = aS.docs.map(d=>({id:d.id,...d.data()}));
    D.periods    = prS.docs.map(d=>({id:d.id,...d.data()}));

    setSynced('✅ Cloud Connected');
    if (CU) renderApp(); else showLogin();
  } catch(e) {
    console.error(e);
    setSynced('⚠️ Offline');
    if (CU) renderApp(); else showLogin();
  }
}

function setSynced(msg) {
  const el=document.getElementById('sync');
  if(el){el.innerHTML=msg;setTimeout(()=>el.style.opacity='0.4',3000);}
}
async function saveSettings() {
  await C.settings.doc('main').set({cashZMW:D.cashZMW,cashUSD:D.cashUSD,rate:D.rate});
}

// ═══════════════════════════════════════════════
// PERIOD LOCK CHECK
// ═══════════════════════════════════════════════
function isPeriodLocked(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  return D.periods.some(p => p.locked && p.year===d.getFullYear() && p.month===(d.getMonth()+1));
}
function checkLocked(dateStr) {
  if (isPeriodLocked(dateStr)) throw new Error(`⛔ Period ${new Date(dateStr).toLocaleDateString('en',{month:'long',year:'numeric'})} is locked. Cannot modify.`);
}

// ═══════════════════════════════════════════════
// AUDIT LOG
// ═══════════════════════════════════════════════
async function logAudit(action, detail, refId='') {
  const entry = {id:uid(), date:new Date().toISOString(), user:CU?.name||'?', role:CU?.role||'?', action, detail, refId};
  D.audit.unshift(entry);
  await C.audit.doc(entry.id).set(entry);
  if (D.audit.length>200) { const old=D.audit.pop(); C.audit.doc(old.id).delete(); }
}

// ═══════════════════════════════════════════════
// DOUBLE-ENTRY LEDGER
// ═══════════════════════════════════════════════
async function postLedger(refId, date, type, entries) {
  // entries = [{account, side:'dr'|'cr', amtZMW, amtUSD, note}]
  const totalDr = entries.filter(e=>e.side==='dr').reduce((s,e)=>s+(e.amtZMW||0),0);
  const totalCr = entries.filter(e=>e.side==='cr').reduce((s,e)=>s+(e.amtZMW||0),0);
  if (Math.abs(totalDr-totalCr)>0.01) console.warn('⚠️ Ledger imbalance!', totalDr, totalCr);
  for (const e of entries) {
    const row = {id:uid(), refId, date, type, account:e.account, side:e.side, amtZMW:e.amtZMW||0, amtUSD:e.amtUSD||0, note:e.note||''};
    D.ledger.unshift(row);
    await C.ledger.doc(row.id).set(row);
  }
}

// ═══════════════════════════════════════════════
// CASH TX LOG (with correct running balance)
// ═══════════════════════════════════════════════
async function logCashTx(type, amtZMW, amtUSD, desc, date) {
  const tx = {
    id:uid(), date:date||new Date().toISOString(), type,
    amountZMW:amtZMW||0, amountUSD:amtUSD||0, description:desc,
    runningZMW:D.cashZMW, runningUSD:D.cashUSD,  // saved AFTER balance updated
    postedBy:CU?.name||'?'
  };
  D.cashTx.unshift(tx);
  await C.cashTx.doc(tx.id).set(tx);
  if(D.cashTx.length>500){const old=D.cashTx.pop();C.cashTx.doc(old.id).delete();}
}

// ═══════════════════════════════════════════════
// INVENTORY
// ═══════════════════════════════════════════════
const getStock = () => D.purchases.reduce((s,p)=>s+(p.remainingGrams??p.grams??0),0);
const getBatches = () => D.purchases.filter(p=>(p.remainingGrams??0)>0.00001);

// ═══════════════════════════════════════════════
// PURCHASE
// ═══════════════════════════════════════════════
async function doPurchase(grams, rate, mashiin, transport, rep, date) {
  if (!grams||grams<=0) throw new Error('Grams must be positive');
  if (!rate||rate<=0)   throw new Error('Rate must be positive');
  checkLocked(date);
  const gross = grams*rate;
  const net   = gross - mashiin - transport;
  if (net<0) throw new Error('Deductions exceed gold value');
  if (D.cashZMW < net) throw new Error(`Insufficient ZMW. Need ${fZ(net)}, have ${fZ(D.cashZMW)}`);

  const p = {id:uid(), date, grams, ratePerGram:rate, grossAmount:gross, mashiinFee:mashiin, transportFee:transport, netPaid:net, salesRep:rep, remainingGrams:grams, rateAtPurchase:D.rate};
  await C.purchases.doc(p.id).set(p);
  D.purchases.push(p); D.purchases.sort((a,b)=>new Date(a.date)-new Date(b.date));

  D.cashZMW -= net;
  await saveSettings();
  await logCashTx('PURCHASE',-net,0,`Buy ${fG(grams)} @${fZ(rate)}/g | Mashiin:${fZ(mashiin)} Transport:${fZ(transport)} | Rep:${rep}`,date);
  await postLedger(p.id,date,'PURCHASE',[
    {account:'Gold Inventory',  side:'dr',amtZMW:gross, note:`${fG(grams)} @${fZ(rate)}`},
    {account:'Cash ZMW',        side:'cr',amtZMW:net,   note:'Net paid'},
    {account:'Mashiin Expense', side:'dr',amtZMW:mashiin,note:'Mashiin fee'},
    {account:'Transport Expense',side:'dr',amtZMW:transport,note:'Transport fee'},
    // balance the expenses against cash
    {account:'Cash ZMW',        side:'cr',amtZMW:mashiin+transport,note:'Fee payments'},
  ]);
  await logAudit('PURCHASE',`${fG(grams)} @ ${fZ(rate)}/g, net ${fZ(net)}, rep ${rep}`,p.id);
  renderApp();
}

// ═══════════════════════════════════════════════
// SALE (FIFO + full profit calc)
// ═══════════════════════════════════════════════
async function doSale(grams, sellRateUSD, convChoice, partialUSD, date) {
  if (!grams||grams<=0) throw new Error('Grams must be positive');
  if (!sellRateUSD||sellRateUSD<=0) throw new Error('Sell rate must be positive');
  checkLocked(date);
  const stock = getStock();
  if (stock < grams-0.00001) throw new Error(`Insufficient gold. Have ${fG(stock)}, need ${fG(grams)}`);

  // FIFO cost basis
  let remaining = grams, costZMW = 0;
  const updates = [];
  for (const batch of getBatches()) {
    if (remaining<=0.00001) break;
    const take = Math.min(batch.remainingGrams, remaining);
    costZMW += (take/batch.grams)*batch.netPaid;
    updates.push({id:batch.id, newRem: batch.remainingGrams-take});
    remaining -= take;
  }
  if (remaining>0.00001) throw new Error('Gold allocation error — check inventory');

  // Apply FIFO updates
  for (const u of updates) {
    const b = D.purchases.find(p=>p.id===u.id);
    if (b) b.remainingGrams = u.newRem;
    await C.purchases.doc(u.id).update({remainingGrams:u.newRem});
  }

  const revenueUSD  = grams * sellRateUSD;
  const costUSD     = costZMW / D.rate;
  const profitUSD   = revenueUSD - costUSD;
  const profitZMW   = profitUSD * D.rate;
  const nSH         = D.shareholders.length;
  const perShare    = nSH>0 ? profitZMW/nSH : 0;

  for (const sh of D.shareholders) {
    sh.balZMW = (sh.balZMW||0) + perShare;
    await C.shareholders.doc(sh.id.toString()).update({balZMW:sh.balZMW});
  }

  let zmwAdded=0, usdKept=0;
  if (convChoice==='convert_all')      { zmwAdded=revenueUSD*D.rate; D.cashZMW+=zmwAdded; }
  else if (convChoice==='keep_all')    { usdKept=revenueUSD; D.cashUSD+=usdKept; }
  else if (convChoice==='partial') {
    const conv=Math.min(Math.max(partialUSD||0,0),revenueUSD);
    zmwAdded=conv*D.rate; usdKept=revenueUSD-conv;
    D.cashZMW+=zmwAdded; D.cashUSD+=usdKept;
  }
  await saveSettings();

  const sr = {id:uid(),date,gramsSold:grams,sellRateUSD,revenueUSD,costZMW,costUSD,profitUSD,profitZMW,perShare,rateUsed:D.rate};
  await C.sales.doc(sr.id).set(sr); D.sales.unshift(sr);

  await logCashTx('SALE',zmwAdded,usdKept,`Sold ${fG(grams)} @${fU(sellRateUSD)}/g | Profit:${fU(profitUSD)} | Each SH:${fZ(perShare)}`,date);
  await postLedger(sr.id,date,'SALE',[
    {account:'Cash USD',          side:'dr',amtZMW:zmwAdded, amtUSD:usdKept, note:'Revenue received'},
    {account:'Gold Inventory',    side:'cr',amtZMW:costZMW,  note:'Cost of goods sold'},
    {account:'Profit & Loss',     side:'cr',amtZMW:profitZMW,note:'Gross profit'},
    {account:'Shareholder Equity',side:'dr',amtZMW:profitZMW,note:'Profit distributed'},
  ]);
  await logAudit('SALE',`${fG(grams)} @${fU(sellRateUSD)}, profit ${fU(profitUSD)}, per SH ${fZ(perShare)}`,sr.id);
  renderApp();
}

// EXCHANGE
// ═══════════════════════════════════════════════
async function doExchange(fromCurr, amt, rate, date) {
  if (amt<=0||rate<=0) throw new Error('Invalid amount or rate');
  checkLocked(date);
  let dZ=0,dU=0;
  if (fromCurr==='ZMW') {
    if (D.cashZMW<amt) throw new Error(`Insufficient ZMW. Have ${fZ(D.cashZMW)}`);
    dU=amt/rate; dZ=-amt; D.cashZMW-=amt; D.cashUSD+=dU;
    await postLedger(uid(),date,'EXCHANGE',[
      {account:'Cash USD',side:'dr',amtZMW:0,amtUSD:dU,note:`Received @${rate}`},
      {account:'Cash ZMW',side:'cr',amtZMW:amt,note:`Given @${rate}`},
    ]);
  } else {
    if (D.cashUSD<amt) throw new Error(`Insufficient USD. Have ${fU(D.cashUSD)}`);
    dZ=amt*rate; dU=-amt; D.cashUSD-=amt; D.cashZMW+=dZ;
    await postLedger(uid(),date,'EXCHANGE',[
      {account:'Cash ZMW',side:'dr',amtZMW:dZ,note:`Received @${rate}`},
      {account:'Cash USD',side:'cr',amtZMW:0,amtUSD:amt,note:`Given @${rate}`},
    ]);
  }
  D.rate=rate; await saveSettings();
  await logCashTx('EXCHANGE',dZ,dU,fromCurr==='ZMW'?`ZMW→USD: ${fZ(amt)} @ ${rate} = ${fU(dU)}`:`USD→ZMW: ${fU(amt)} @ ${rate} = ${fZ(dZ)}`,date);
  await logAudit('EXCHANGE',`${fromCurr==='ZMW'?`${fZ(amt)}→${fU(dU)}`:`${fU(amt)}→${fZ(dZ)}`} @rate ${rate}`);
  renderApp();
}

  renderApp();
}

// ═══════════════════════════════════════════════
// DELETE TRANSACTION — FULL REVERSAL
// ═══════════════════════════════════════════════
async function deleteTx(txId) {
  if (!confirm('⚠️ Delete this transaction?\n\nThis will:\n• Reverse cash balances\n• Reverse shareholder balances\n• Restore gold inventory (if a sale)\n• Log deletion in audit trail\n\nThis cannot be undone.')) return;
  const tx = D.cashTx.find(t=>t.id===txId);
  if (!tx) return alert('Transaction not found');
  if (isPeriodLocked(tx.date)) return alert('⛔ Period is locked. Cannot delete.');

  try {
    // 1. Reverse cash
    D.cashZMW -= (tx.amountZMW||0);
    D.cashUSD  -= (tx.amountUSD||0);

    // 2. Type-specific reversals
    const nSH = D.shareholders.length;

    if (tx.type==='SALE') {
      // Find the sale record by matching description/date proximity
      const sale = D.sales.find(s=>Math.abs(new Date(s.date)-new Date(tx.date))<5000);
      if (sale) {
        // Reverse shareholder profit
        const perShare = sale.perShare||0;
        for (const sh of D.shareholders) { sh.balZMW=(sh.balZMW||0)-perShare; await C.shareholders.doc(sh.id.toString()).update({balZMW:sh.balZMW}); }
        // Restore gold batches (FIFO reverse — restore to batches that were depleted most recently)
        // We re-add grams to the last consumed batches
        let toRestore = sale.gramsSold||0;
        for (let i=D.purchases.length-1;i>=0&&toRestore>0.00001;i--) {
          const b=D.purchases[i];
          const maxRestore = b.grams-(b.remainingGrams??0);
          if (maxRestore<0.00001) continue;
          const restore = Math.min(maxRestore, toRestore);
          b.remainingGrams=(b.remainingGrams??0)+restore;
          await C.purchases.doc(b.id).update({remainingGrams:b.remainingGrams});
          toRestore-=restore;
        }
        // Remove sale record
        D.sales = D.sales.filter(s=>s.id!==sale.id);
        await C.sales.doc(sale.id).delete();
      }
    }
    else if (tx.type==='EXPENSE') {
      const ex = D.expenses.find(e=>Math.abs(new Date(e.date)-new Date(tx.date))<5000 && Math.abs(e.amountZMW-(-(tx.amountZMW||0)))<0.01);
      const amt = ex ? ex.amountZMW : Math.abs(tx.amountZMW||0);
      const perShare = nSH>0 ? amt/nSH : 0;
      for (const sh of D.shareholders) { sh.balZMW=(sh.balZMW||0)+perShare; await C.shareholders.doc(sh.id.toString()).update({balZMW:sh.balZMW}); }
      if (ex) { D.expenses=D.expenses.filter(e=>e.id!==ex.id); await C.expenses.doc(ex.id).delete(); }
    }
    else if (tx.type==='SURVEY') {
      const sv = D.surveys.find(s=>Math.abs(new Date(s.date)-new Date(tx.date))<5000);
      const amt = sv ? sv.amountZMW : (tx.amountZMW||0);
      const perShare = nSH>0 ? amt/nSH : 0;
      for (const sh of D.shareholders) { sh.balZMW=(sh.balZMW||0)-perShare; await C.shareholders.doc(sh.id.toString()).update({balZMW:sh.balZMW}); }
      if (sv) { D.surveys=D.surveys.filter(s=>s.id!==sv.id); await C.surveys.doc(sv.id).delete(); }
    }
    else if (tx.type==='DEPOSIT') {
      // Try to reverse shareholder deposit
      const shName = (tx.description||'').replace('Deposit: ','').replace('Deposit by ','');
      const sh = D.shareholders.find(s=>s.name===shName);
      if (sh) { sh.balZMW=(sh.balZMW||0)-(tx.amountZMW||0); await C.shareholders.doc(sh.id.toString()).update({balZMW:sh.balZMW}); }
    }
    else if (tx.type==='PURCHASE') {
      const p = D.purchases.find(pu=>Math.abs(new Date(pu.date)-new Date(tx.date))<5000);
      if (p) {
        D.purchases=D.purchases.filter(pu=>pu.id!==p.id);
        await C.purchases.doc(p.id).delete();
      }
    }
    else if (tx.type==='WITHDRAWAL') {
      const shName=(tx.description||'').replace('Withdrawal: ','');
      const sh=D.shareholders.find(s=>s.name===shName);
      if (sh) { sh.balZMW=(sh.balZMW||0)+Math.abs(tx.amountZMW||0); await C.shareholders.doc(sh.id.toString()).update({balZMW:sh.balZMW}); }
    }

    // 3. Save cash
    await saveSettings();

    // 4. Remove tx
    D.cashTx=D.cashTx.filter(t=>t.id!==txId);
    await C.cashTx.doc(txId).delete();

    // 5. Audit
    await logAudit('DELETE_TX',`Deleted ${tx.type}: ${tx.description} | ${fZ(tx.amountZMW)} | ${fDT(tx.date)}`,txId);

    renderApp();
    alert('✅ Transaction deleted and fully reversed.');
  } catch(e) {
    alert('❌ Error during delete: '+e.message);
  }
}

async function togglePeriodLock(year, month, lock) {
  const existing=D.periods.find(p=>p.year===year&&p.month===month);
  if (existing) {
    existing.locked=lock; await C.periods.doc(existing.id).update({locked:lock});
  } else {
    const p={id:uid(),year,month,locked:lock,lockedBy:CU?.name,lockedAt:new Date().toISOString()};
    D.periods.push(p); await C.periods.doc(p.id).set(p);
  }
  await logAudit(lock?'PERIOD_LOCK':'PERIOD_UNLOCK',`${lock?'Locked':'Unlocked'} ${month}/${year}`);
  renderApp();
}

// ═══════════════════════════════════════════════
// RECONCILIATION — replay all txs from zero
// ═══════════════════════════════════════════════
function reconcile() {
  const sorted=[...D.cashTx].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let zmw=0, usd=0;
  for (const tx of sorted) { zmw+=(tx.amountZMW||0); usd+=(tx.amountUSD||0); }
  return { replayedZMW:zmw, replayedUSD:usd, actualZMW:D.cashZMW, actualUSD:D.cashUSD,
    zmwOK:Math.abs(zmw-D.cashZMW)<0.01, usdOK:Math.abs(usd-D.cashUSD)<0.01 };
}

function getTrialBalance() {
  const accounts={};

    if (!accounts[e.account]) accounts[e.account]={dr:0,cr:0};
    if (e.side==='dr') accounts[e.account].dr+=(e.amtZMW||0);
    else accounts[e.account].cr+=(e.amtZMW||0);
  }
  return accounts;
}

function getDateRange(f) {
  const n=new Date(); let s,e;
  if (f==='today')     { s=new Date(); s.setHours(0,0,0,0); e=new Date(); e.setHours(23,59,59,999); }
  else if (f==='yesterday'){ s=new Date(); s.setDate(n.getDate()-1); s.setHours(0,0,0,0); e=new Date(s); e.setHours(23,59,59,999); }
  else if (f==='thisMonth'){ s=new Date(n.getFullYear(),n.getMonth(),1); e=new Date(n.getFullYear(),n.getMonth()+1,0,23,59,59); }
  else if (f==='lastMonth'){ s=new Date(n.getFullYear(),n.getMonth()-1,1); e=new Date(n.getFullYear(),n.getMonth(),0,23,59,59); }
  else if (f==='thisYear') { s=new Date(n.getFullYear(),0,1); e=new Date(n.getFullYear(),11,31,23,59,59); }
  else { s=new Date(0); e=new Date(9999,0,1); }
  return {s,e};
}

function showLogin() {
  document.getElementById('root').innerHTML=`
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 40%,#131210,#020202);padding:1.5rem">
    <div style="background:#131210;border:1px solid rgba(218,185,105,0.35);border-radius:2rem;padding:2rem;width:100%;max-width:400px">
      <h1 style="font-size:1.7rem;color:var(--gold);text-align:center;margin-bottom:1.5rem">⚜️ GoldTrack Pro</h1>
      <div class="fg" style="margin-bottom:14px"><label>Username</label><input id="lu" placeholder="Enter username" /></div>
      <div class="fg" style="margin-bottom:14px"><label>Password</label><input id="lp" type="password" placeholder="Enter password" /></div>
      <button class="btn btn-gold" id="lbtn">🔓 Sign In</button>
      <div id="lerr" style="color:var(--red);font-size:0.78rem;margin-top:12px;text-align:center"></div>
    </div>
  </div>`;
  const doLogin=()=>{
    const u=document.getElementById('lu').value.trim(), p=document.getElementById('lp').value;
    if (u==='Admin'&&p==='Muhiim1998')  { CU={name:'Admin',  role:'admin'};   loadAll(); return; }
    if (u==='Samatar'&&p==='samatar123'){ CU={name:'Samatar',role:'manager'}; loadAll(); return; }
    const sh=D.shareholders.find(s=>s.name===u&&s.password===p);
    if (sh) { CU={name:sh.name,role:'shareholder',shId:sh.id}; loadAll(); return; }
    document.getElementById('lerr').innerText='❌ Invalid username or password';
  };
  document.getElementById('lbtn')?.addEventListener('click',doLogin);
  document.getElementById('lp')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

      <div class="card"><div class="card-title">📋 Expense History</div>
        <table class="tbl"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead>
        <tbody>${D.expenses.slice(0,15).map(e=>`
        <tr><td>${fD(e.date)}</td><td><span class="badge badge-red">${e.category||'Other'}</span></td>
        <td>${e.description}</td><td class="red">${fZ(e.amountZMW)}</td></tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
  }

  // ── DEPOSITS ──
  else if (TAB==='deposits'&&isPriv) {
    content=`<div class="card"><div class="card-title">💵 Record Deposit</div>
      <div class="form-grid">
        <div class="fg"><label>Date</label><input type="date" id="dpDate" value="${today()}"/></div>
        <div class="fg"><label>Type</label><select id="dpType"><option value="shareholder">Shareholder</option><option value="external">External</option></select></div>
        <div class="fg"><label>Source</label><select id="dpSrc">${D.shareholders.map(s=>`<option>${s.name}</option>`).join('')}</select></div>
        <div class="fg"><label>Amount (ZMW)</label><input type="number" id="dpAmt" step="0.01"/></div>
        <div class="fg"><label>Note</label><input id="dpNote" placeholder="Optional note"/></div>
      </div>
      <button class="btn btn-gold" id="doDepo">✅ Record Deposit</button>
    </div>`;
  }

  // ── USERS ──
  else if (TAB==='users'&&isPriv) {
    const users=getAllUsers();
    content=`<div class="card"><div class="card-title">👥 User Management</div>
      <div style="margin-bottom:14px"><button class="btn-sm" id="togglePwd">${SHOW_PWD?'🙈 Hide':'👁️ Show'} Passwords</button></div>
      <table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Balance</th><th>Password</th><th>Actions</th></tr></thead>
      <tbody>${users.map(u=>`
      <tr><td style="font-weight:600">${u.name}</td>
      <td><span class="badge ${u.role==='admin'?'badge-purple':u.role==='manager'?'badge-blue':'badge-gold'}">${u.role}</span></td>
      <td class="${(u.balZMW||0)>=0?'green':'red'}">${u.balZMW!==undefined?fZ(u.balZMW):'-'}</td>
      <td style="font-family:monospace">${SHOW_PWD?u.password:'••••••'}</td>
      <td style="display:flex;gap:6px">
        <button class="btn-sm" data-cpwd="${u.name}">🔑 Change</button>
        ${u.role==='shareholder'&&isAdmin?`<button class="btn-danger" data-delu="${u.id}">🗑️</button>`:''}
      </td></tr>`).join('')}
      </tbody></table>
      ${isAdmin?`
      <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:20px">
        <div class="card-title">➕ Add Shareholder</div>
        <div class="form-grid">
          <div class="fg"><label>Name</label><input id="nuName" placeholder="Full name"/></div>
          <div class="fg"><label>Password</label><input id="nuPwd" placeholder="Password"/></div>
        </div>
        <button class="btn btn-gold" id="addUsr">Add Shareholder</button>
      </div>`:''}
    </div>`;
  }

  // ── REPORTS ──
  else if (TAB==='reports'&&isPriv) {
    content=`<div class="card"><div class="card-title">📊 Reports & Analytics</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        ${['today','yesterday','thisMonth','lastMonth','thisYear','all'].map(f=>`
        <button class="filter-btn btn-sm ${RPT.dateFilter===f?'active':''}" data-filter="${f}" style="${RPT.dateFilter===f?'background:var(--gold2);color:#000;border-color:var(--gold2)':''}">${
          {today:'Today',yesterday:'Yesterday',thisMonth:'This Month',lastMonth:'Last Month',thisYear:'This Year',all:'All Time'}[f]
        }</button>`).join('')}
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">
        <select id="rptType" style="max-width:180px">
          <option value="all">All Types</option>
          <option value="PURCHASE">Purchases</option><option value="SALE">Sales</option>
          <option value="SURVEY">Survey</option><option value="EXPENSE">Expenses</option>
          <option value="DEPOSIT">Deposits</option><option value="WITHDRAWAL">Withdrawals</option>
          <option value="EXCHANGE">Exchange</option>
        </select>
        <button class="btn-sm" id="applyRptType">Apply</button>
        <button class="btn-sm" id="printRpt">🖨️ Print</button>
      </div>
      <div id="reportOutput"></div>
    </div>`;
  }

  // ── LEDGER (Double Entry) ──
  else if (TAB==='ledger'&&isPriv) {
    const tb=getTrialBalance();
    const totalDr=Object.values(tb).reduce((a,v)=>a+v.dr,0);
    const totalCr=Object.values(tb).reduce((a,v)=>a+v.cr,0);
    content=`
    <div class="card"><div class="card-title">📒 Trial Balance</div>
      <div class="alert ${Math.abs(totalDr-totalCr)<0.01?'alert-info':'alert-err'}">
        ${Math.abs(totalDr-totalCr)<0.01?'✅ Books are balanced — Total Debits = Total Credits':'⚠️ Imbalance detected!'}
        Total Debits: ${fZ(totalDr)} | Total Credits: ${fZ(totalCr)}
      </div>
      <table class="tbl"><thead><tr><th>Account</th><th>Debit (ZMW)</th><th>Credit (ZMW)</th><th>Balance</th></tr></thead>
      <tbody>${Object.entries(tb).map(([acct,v])=>`
      <tr><td style="font-weight:500">${acct}</td>
      <td class="green">${fZ(v.dr)}</td>
      <td class="red">${fZ(v.cr)}</td>
      <td class="${(v.dr-v.cr)>=0?'green':'red'}">${fZ(v.dr-v.cr)}</td></tr>`).join('')}
      <tr style="font-weight:700;background:var(--bg4)">
        <td>TOTALS</td><td class="green">${fZ(totalDr)}</td><td class="red">${fZ(totalCr)}</td>
        <td class="${Math.abs(totalDr-totalCr)<0.01?'green':'red'}">${fZ(totalDr-totalCr)}</td>
      </tr>
      </tbody></table>
    </div>
    <div class="card"><div class="card-title">📒 Journal Entries (Recent)</div>
      <table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Account</th><th>Dr/Cr</th><th>ZMW</th><th>Note</th></tr></thead>
      <tbody>${D.ledger.slice(0,30).map(e=>`
      <tr><td>${fD(e.date)}</td>
      <td><span class="rpt-badge rb-${e.type}">${e.type}</span></td>
      <td style="font-weight:500">${e.account}</td>
      <td><span class="badge ${e.side==='dr'?'badge-green':'badge-red'}">${e.side.toUpperCase()}</span></td>
      <td class="${e.side==='dr'?'green':'red'}">${fZ(e.amtZMW)}</td>
      <td class="muted">${e.note}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  }

  // ── PERIODS (Admin only) ──
  else if (TAB==='periods'&&isAdmin) {
    const now=new Date();
    const months=[];
    for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth()+1,label:d.toLocaleDateString('en',{month:'long',year:'numeric'})});}
    content=`<div class="card"><div class="card-title">🔒 Period Management</div>
      <div class="alert alert-warn">⚠️ Locking a period prevents any transactions from being added, edited, or deleted in that month. Only Admin can lock/unlock.</div>
      <table class="tbl"><thead><tr><th>Period</th><th>Status</th><th>Locked By</th><th>Action</th></tr></thead>
      <tbody>${months.map(mo=>{
        const p=D.periods.find(x=>x.year===mo.y&&x.month===mo.m);
        const locked=p?.locked||false;
        return `<tr>
          <td style="font-weight:500">${mo.label}</td>
          <td><span class="badge ${locked?'badge-red':'badge-green'}">${locked?'🔒 Locked':'🔓 Open'}</span></td>
          <td class="muted">${locked?(p?.lockedBy||'-'):'-'}</td>
          <td><button class="btn-sm ${locked?'btn-danger':''}" data-lock="${mo.y}-${mo.m}-${locked?'0':'1'}">${locked?'Unlock':'Lock'}</button></td>
        </tr>`;}).join('')}
      </tbody></table>
    </div>`;
  }

  // ── AUDIT LOG ──
  else if (TAB==='audit'&&isPriv) {
    content=`<div class="card"><div class="card-title">🕵️ Audit Log</div>
      <div class="alert alert-info">Every action is recorded here — who did it, when, and what changed.</div>
      ${D.audit.map(a=>`
      <div class="audit-row">
        <span class="muted" style="min-width:120px;font-size:0.68rem">${fDT(a.date)}</span>
        <span class="audit-who">${a.user}</span>
        <span class="badge ${a.role==='admin'?'badge-purple':a.role==='manager'?'badge-blue':'badge-gold'}">${a.role}</span>
        <span class="badge badge-gray">${a.action}</span>
        <span class="tx-desc">${a.detail}</span>
      </div>`).join('')||'<div class="muted">No audit entries yet</div>'}
    </div>`;
  }

  // ── WITHDRAWALS ──
  else if (TAB==='withdrawals') {
    const reqs=D.withdrawals.filter(r=>isPriv||r.shareholderId===CU?.shId);
    const myBal=!isPriv?D.shareholders.find(s=>s.id===CU?.shId)?.balZMW||0:null;
    content=`<div class="card"><div class="card-title">🏧 Withdrawals</div>
      ${!isPriv?`
      <div class="alert alert-info">Your balance: <strong>${fZ(myBal)}</strong></div>
      <div class="form-grid">
        <div class="fg"><label>Amount (ZMW)</label><input type="number" id="wdAmt" step="0.01" max="${myBal}" placeholder="Amount to withdraw"/></div>
      </div>
      <button class="btn btn-gold" id="reqWd">Request Withdrawal</button>`:''}
      <table class="tbl" style="margin-top:${!isPriv?'20px':'0'}">
        <thead><tr><th>User</th><th>Amount</th><th>Status</th><th>Date</th>${isPriv?'<th>Action</th>':''}</tr></thead>
        <tbody>${reqs.map(r=>`
        <tr><td style="font-weight:500">${r.shareholderName}</td>
        <td class="gold">${fZ(r.amountZMW)}</td>
        <td><span class="badge ${r.status==='approved'?'badge-green':'badge-gold'}">${r.status}</span></td>
        <td class="muted">${fD(r.date)}</td>
        ${isPriv?`<td>${r.status==='pending'?`<button class="btn-green" data-approve="${r.id}">✅ Approve</button>`:'—'}</td>`:''}</tr>`).join('')}
        ${reqs.length===0?`<tr><td colspan="${isPriv?5:4}" style="text-align:center;padding:30px;color:var(--text4)">No withdrawal requests</td></tr>`:''}
        </tbody>
      </table>
    </div>`;
  }

  // ── BUILD PAGE ──
  root.innerHTML=`
  <div class="mob-header">
    <button id="menuToggle" style="background:none;border:none;color:var(--gold);font-size:1.3rem">☰</button>
    <span style="color:var(--gold);font-weight:700">⚜️ GoldTrack</span>
    <span style="font-size:0.68rem;color:var(--text3)">${CU?.name}</span>
  </div>
  <div class="app">
    <div class="sidebar" id="sidebar">
      <div class="logo"><h2>⚜️ GoldTrack Pro</h2><small>v3.0 — Professional Edition</small></div>
      <div class="nav">${nav}</div>
      <div class="user-area">
        <div class="user-card"><div class="uname">${CU?.name}</div><div class="urole">${CU?.role}</div></div>
        <button class="btn-logout" id="logoutBtn">Sign Out</button>
      </div>
    </div>
    <div class="main">
      <div class="page-title">${allTabs.find(t=>t.id===TAB)?.icon||''} ${(allTabs.find(t=>t.id===TAB)?.label||TAB).toUpperCase()}</div>
      ${content}
    </div>
  </div>`;

  // GLOBAL EVENTS
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{TAB=b.dataset.tab;renderApp();}));
  document.getElementById('logoutBtn')?.addEventListener('click',()=>{CU=null;showLogin();});
  document.getElementById('menuToggle')?.addEventListener('click',()=>document.getElementById('sidebar')?.classList.toggle('open'));
  document.getElementById('clickZMW')?.addEventListener('click',()=>showCashModal('ZMW'));
  document.getElementById('clickUSD')?.addEventListener('click',()=>showCashModal('USD'));

  // PURCHASE
  if (TAB==='purchase'&&isPriv) {
    const upd=()=>{
      const g=+document.getElementById('pGrams')?.value||0, r=+document.getElementById('pRate')?.value||0;
      const m=+document.getElementById('pMash')?.value||0, t=+document.getElementById('pTrans')?.value||0;
      const net=g*r-m-t;
      document.getElementById('pPrev').innerHTML=`Gross: <strong>${fZ(g*r)}</strong> | Deductions: <strong>${fZ(m+t)}</strong> | Net to Pay: <strong>${fZ(net)}</strong> | Cash after: <strong>${fZ(D.cashZMW-net)}</strong>`;
    };
    ['pGrams','pRate','pMash','pTrans'].forEach(id=>document.getElementById(id)?.addEventListener('input',upd));
    document.getElementById('doPurch')?.addEventListener('click',async()=>{
      try { await doPurchase(+document.getElementById('pGrams').value,+document.getElementById('pRate').value,+document.getElementById('pMash').value||0,+document.getElementById('pTrans').value||0,document.getElementById('pRep').value,document.getElementById('pDate').value); }
      catch(e){alert('❌ '+e.message);}
    });
  }

  // SALES
  if (TAB==='sales'&&isPriv) {
    const upd=()=>{
      const g=+document.getElementById('sGrams')?.value||0, r=+document.getElementById('sRate')?.value||0;
      const revU=g*r, revZ=revU*D.rate;
      document.getElementById('sPrev').innerHTML=`Revenue: <strong>${fU(revU)}</strong> ≈ <strong>${fZ(revZ)}</strong> | Stock after: <strong>${fG(stock-g)}</strong>`;
    };
    ['sGrams','sRate'].forEach(id=>document.getElementById(id)?.addEventListener('input',upd));
    document.getElementById('sConv')?.addEventListener('change',e=>{document.getElementById('sPartBox').style.display=e.target.value==='partial'?'block':'none';});
    document.getElementById('doSale')?.addEventListener('click',async()=>{
      try { await doSale(+document.getElementById('sGrams').value,+document.getElementById('sRate').value,document.getElementById('sConv').value,+document.getElementById('sPartUSD')?.value||0,document.getElementById('sDate').value); }
      catch(e){alert('❌ '+e.message);}
    });
  }

  // EXCHANGE
  if (TAB==='exchange'&&isPriv) {
    const upd=()=>{
      const dir=document.getElementById('exDir')?.value, amt=+document.getElementById('exAmt')?.value||0, rate=+document.getElementById('exRate')?.value||0;
      if (!amt||!rate) return;
      document.getElementById('exPrev').innerHTML=dir==='ZMW'?`Give <strong>${fZ(amt)}</strong> → Receive <strong>${fU(amt/rate)}</strong>`:`Give <strong>${fU(amt)}</strong> → Receive <strong>${fZ(amt*rate)}</strong>`;
    };
    ['exDir','exAmt','exRate'].forEach(id=>{document.getElementById(id)?.addEventListener('input',upd);document.getElementById(id)?.addEventListener('change',upd);});
    document.getElementById('doExch')?.addEventListener('click',async()=>{
      try { await doExchange(document.getElementById('exDir').value,+document.getElementById('exAmt').value,+document.getElementById('exRate').value,document.getElementById('exDate').value); }
      catch(e){alert('❌ '+e.message);}
    });
  }

  // SURVEY
  if (TAB==='survey'&&isPriv) {
    document.getElementById('doSurv')?.addEventListener('click',async()=>{
      try { await doSurvey(+document.getElementById('svAmt').value,document.getElementById('svCust').value,document.getElementById('svDate').value); }
      catch(e){alert('❌ '+e.message);}
    });
  }

  // EXPENSES
  if (TAB==='expenses'&&isPriv) {
    document.getElementById('doExp')?.addEventListener('click',async()=>{
      try { await doExpense(document.getElementById('epDesc').value,document.getElementById('epCat').value,+document.getElementById('epAmt').value,document.getElementById('epDate').value); }
      catch(e){alert('❌ '+e.message);}
    });
  }

  // DEPOSITS
  if (TAB==='deposits'&&isPriv) {
    document.getElementById('doDepo')?.addEventListener('click',async()=>{
      try { await doDeposit(document.getElementById('dpType').value,document.getElementById('dpSrc').value,+document.getElementById('dpAmt').value,document.getElementById('dpNote')?.value||'',document.getElementById('dpDate').value); }
      catch(e){alert('❌ '+e.message);}
    });
  }

  // USERS
  if (TAB==='users'&&isPriv) {
    document.getElementById('togglePwd')?.addEventListener('click',()=>{SHOW_PWD=!SHOW_PWD;renderApp();});
    document.querySelectorAll('[data-cpwd]').forEach(b=>b.addEventListener('click',async()=>{
      const pwd=prompt(`New password for ${b.dataset.cpwd}:`);
      if(pwd)try{await changePwd(b.dataset.cpwd,pwd);alert('✅ Changed');renderApp();}catch(e){alert(e.message);}
    }));
    if(isAdmin){
      document.querySelectorAll('[data-delu]').forEach(b=>b.addEventListener('click',async()=>{
        if(confirm('Delete shareholder?'))try{await delShareholder(parseInt(b.dataset.delu));renderApp();}catch(e){alert(e.message);}
      }));
      document.getElementById('addUsr')?.addEventListener('click',async()=>{
        try{await addShareholder(document.getElementById('nuName').value.trim(),document.getElementById('nuPwd').value.trim());alert('✅ Added');renderApp();}catch(e){alert(e.message);}
      });
    }
  }

  // REPORTS
  if (TAB==='reports'&&isPriv) {
    document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
      RPT.dateFilter=b.dataset.filter;
      const {s,e}=getDateRange(b.dataset.filter);RPT.start=s;RPT.end=e;
      generateReport();
    }));
    document.getElementById('applyRptType')?.addEventListener('click',()=>{RPT.typeFilter=document.getElementById('rptType').value;generateReport();});
    document.getElementById('printRpt')?.addEventListener('click',()=>window.print());
    generateReport();
  }

  // PERIODS
  if (TAB==='periods'&&isAdmin) {
    document.querySelectorAll('[data-lock]').forEach(b=>b.addEventListener('click',async()=>{
      const [y,m,l]=b.dataset.lock.split('-');
      await togglePeriodLock(parseInt(y),parseInt(m),l==='1');
    }));
  }

  // WITHDRAWALS
  if (TAB==='withdrawals') {
    document.getElementById('reqWd')?.addEventListener('click',async()=>{
      const amt=+document.getElementById('wdAmt').value;
      if(!amt||amt<=0)return alert('Enter a valid amount');
      try{await reqWithdrawal(CU.shId,amt);}catch(e){alert('❌ '+e.message);}
    });
    document.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',async()=>{await approveWithdrawal(b.dataset.approve);}));
  }
}

// ═══════════════════════════════════════════════
// CASH HISTORY MODAL
// ═══════════════════════════════════════════════
function showCashModal(curr) {
  const div=document.createElement('div');div.className='modal';
  div.innerHTML=`<div class="modal-box">
    <h3>${curr==='ZMW'?'💰 ZMW Cash History':'💵 USD Cash History'}</h3>
    <div style="color:var(--text3);font-size:0.78rem;margin-bottom:14px">Current: ${curr==='ZMW'?fZ(D.cashZMW):fU(D.cashUSD)}</div>
    ${D.cashTx.map(t=>`
    <div class="tx-row">
      <span class="muted" style="min-width:110px;font-size:0.68rem">${fDT(t.date)}</span>
      <span class="badge badge-gold" style="font-size:0.6rem">${t.type}</span>
      <span class="tx-desc">${t.description}</span>
      ${curr==='ZMW'
        ?`<span class="${t.amountZMW>=0?'green':'red'}">${t.amountZMW>=0?'+':''}${fZ(t.amountZMW)}</span>
           <span class="muted">→ ${fZ(t.runningZMW||0)}</span>`
        :`<span class="${t.amountUSD>=0?'green':'red'}">${t.amountUSD>=0?'+':''}${fU(t.amountUSD)}</span>
           <span class="muted">→ ${fU(t.runningUSD||0)}</span>`}
    </div>`).join('')}
    <button class="btn-sm" style="margin-top:16px;width:100%" onclick="this.closest('.modal').remove()">Close</button>
  </div>`;
  document.body.appendChild(div);
  div.addEventListener('click',e=>{if(e.target===div)div.remove();});
}

window.deleteTx=deleteTx;
loadAll();
</script>
</body>
</html>
