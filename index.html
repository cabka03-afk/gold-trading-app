<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gold Trading Pro | Accounting + Loans + Reports</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a07;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            color: #ece3cf;
        }

        /* login */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 30% 40%, #131210, #020202);
            padding: 1.5rem;
        }

        .login-card {
            background: #131210e6;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(218, 185, 105, 0.4);
            border-radius: 2rem;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }

        .login-card h1 {
            font-size: 1.9rem;
            color: #e2bc6e;
            text-align: center;
        }

        .field {
            margin-bottom: 1rem;
        }

        .field label {
            font-size: 0.7rem;
            color: #cdbc8f;
            display: block;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            background: #1f1e1a;
            border: 1px solid #3a3528;
            padding: 12px 18px;
            border-radius: 40px;
            color: #f7efdb;
        }

        .btn-gold {
            width: 100%;
            background: linear-gradient(135deg, #a8822c, #e0b867);
            border: none;
            padding: 13px;
            border-radius: 40px;
            font-weight: bold;
            color: #0c0b07;
            cursor: pointer;
        }

        .error-msg {
            color: #f5a67b;
            font-size: 0.75rem;
            margin-top: 12px;
            text-align: center;
        }

        /* app layout */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: #0e0e0b;
            border-right: 1px solid #2a261d;
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .logo-area {
            padding: 24px 20px;
            border-bottom: 1px solid #2f2b20;
        }

        .logo-area h2 {
            color: #e8c87a;
            font-size: 1.3rem;
        }

        .nav-menu {
            flex: 1;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 10px 16px;
            text-align: left;
            font-size: 0.85rem;
            color: #cbbf97;
            border-radius: 34px;
            cursor: pointer;
        }

        .nav-btn.active, .nav-btn:hover {
            background: #25231c;
            color: #f5de9c;
        }

        .user-section {
            padding: 20px;
            border-top: 1px solid #2b271f;
        }

        .user-badge {
            background: #191814;
            border-radius: 28px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .btn-outline {
            width: 100%;
            background: none;
            border: 1px solid #5f553b;
            padding: 8px;
            border-radius: 40px;
            color: #dcceaa;
            cursor: pointer;
        }

        .content-main {
            margin-left: 280px;
            padding: 28px 32px;
            flex: 1;
        }

        /* cards & stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #12120f;
            border: 1px solid #2b271f;
            border-radius: 28px;
            padding: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .stat-card:hover {
            border-color: #e0b867;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #a3946b;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #e9cf8b;
        }

        .card {
            background: #11110e;
            border: 1px solid #2b281f;
            border-radius: 26px;
            padding: 1.5rem;
            margin-bottom: 1.8rem;
        }

        .card-title {
            font-size: 1.1rem;
            border-left: 3px solid #e0b867;
            padding-left: 12px;
            margin-bottom: 20px;
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.7rem;
            color: #c7b584;
            display: block;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            background: #1e1d18;
            border: 1px solid #3f392b;
            padding: 10px 14px;
            border-radius: 36px;
            color: #f2e7cf;
        }

        .btn-action {
            background: linear-gradient(100deg, #9e7d30, #d6ae5a);
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: bold;
            color: #0c0a04;
            cursor: pointer;
            width: 100%;
        }

        .btn-sm {
            background: #2a271f;
            border: 1px solid #7a6b47;
            padding: 6px 14px;
            border-radius: 30px;
            color: #f0daa0;
            cursor: pointer;
            font-size: 0.7rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 10px 6px 10px 0;
            color: #b8a76c;
            font-size: 0.7rem;
        }

        td {
            padding: 10px 6px 10px 0;
            border-bottom: 1px solid #2f2b1f;
            font-size: 0.8rem;
        }

        .badge-pending {
            background: #4a3e24;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
        }

        .badge-approved {
            background: #1e3a2a;
            color: #9bdba0;
            padding: 2px 10px;
            border-radius: 30px;
        }

        .green {
            color: #8bcb8b;
        }

        .red {
            color: #e69474;
        }

        .muted {
            color: #8e8160;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #181714;
            border-radius: 28px;
            padding: 28px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .mobile-header {
            display: none;
        }

        @media (max-width: 760px) {
            .sidebar {
                transform: translateX(-100%);
                transition: 0.2s;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .content-main {
                margin-left: 0;
                padding: 18px;
            }
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }
            .two-col {
                grid-template-columns: 1fr;
            }
            .mobile-header {
                display: flex;
                justify-content: space-between;
                padding: 14px 18px;
                background: #0e0e0b;
                position: sticky;
                top: 0;
            }
        }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    // ------------------- ACCOUNTING DATA MODEL -------------------
    const defaultState = {
        // Cash balances
        companyCashZMW: 50000.0,
        companyCashUSD: 0.0,
        exchangeRate: 26.5,
        
        // Chart of Accounts - transactions log
        cashTransactions: [],  // { id, date, type, amountZMW, amountUSD, description, runningBalanceZMW, runningBalanceUSD }
        
        // Gold inventory & sales
        goldPurchases: [],
        goldSales: [],
        
        // Expenses & Survey
        expenses: [],
        surveyRevenues: [],
        
        // Liabilities (Loans taken)
        liabilities: [],   // { id, lender, amountZMW, remainingBalance, interestRate, dueDate, dateTaken, notes }
        
        // Debtors (people who owe company)
        debtors: [],       // { id, customerName, amountZMW, remainingBalance, dueDate, notes }
        
        // Equity tracking
        startingEquity: 50000.0,
        retainedEarnings: 0.0,
        
        // Withdrawals
        withdrawalRequests: [],
        
        // Shareholders (ZMW balances only)
        shareholders: [
            { id: 1, name: "Yuusuf", password: "yuusuf123", balanceZMW: 0.0, role: "shareholder" },
            { id: 2, name: "Abdirisak", password: "abdirisak123", balanceZMW: 0.0, role: "shareholder" },
            { id: 3, name: "Ahmed", password: "ahmed123", balanceZMW: 0.0, role: "shareholder" }
        ],
        
        // Admin & Manager
        adminUser: { name: "Admin", password: "Muhiim1998", role: "admin" },
        managerUser: { name: "Samatar", password: "samatar123", role: "manager" },
        
        salesReps: ["Samatar", "Yuusuf", "Abdirisak", "Jamal"],
        defaultMashiin: 750,
        defaultTransport: 150,
        
        exchangeLogs: []
    };

    let state = JSON.parse(localStorage.getItem('gold_pro_acct')) || JSON.parse(JSON.stringify(defaultState));
    let currentUser = null;
    let activeTab = "dashboard";
    let modalData = null;

    function persist() { localStorage.setItem('gold_pro_acct', JSON.stringify(state)); }

    const formatZMW = (v) => 'K' + (parseFloat(v)||0).toFixed(2);
    const formatUSD = (v) => '$' + (parseFloat(v)||0).toFixed(2);
    const formatGrams = (g) => (parseFloat(g)||0).toFixed(2) + ' g';

    // log cash transaction
    function logCashTransaction(type, amountZMW, amountUSD, desc) {
        const runningZMW = state.companyCashZMW;
        const runningUSD = state.companyCashUSD;
        state.cashTransactions.unshift({
            id: Date.now(),
            date: new Date().toISOString(),
            type, amountZMW, amountUSD, description: desc,
            runningBalanceZMW: runningZMW,
            runningBalanceUSD: runningUSD
        });
        persist();
    }

    // Purchase with Mashiin/Transport
    function recordPurchase(grams, ratePerGram, mashiinAmt, transportAmt, salesRep) {
        const gross = grams * ratePerGram;
        const netPaid = gross - (mashiinAmt + transportAmt);
        if (netPaid < 0) throw new Error("Deductions exceed value");
        state.goldPurchases.push({
            id: Date.now(), date: new Date().toISOString(), grams, ratePerGram, grossAmount: gross,
            mashiinFee: mashiinAmt, transportFee: transportAmt, netPaid, salesRep, remainingGrams: grams
        });
        state.companyCashZMW -= netPaid;
        logCashTransaction("GOLD_PURCHASE", -netPaid, 0, `Buy ${grams}g @ ${ratePerGram} ZMW/g, Mashiin:${mashiinAmt}, Transport:${transportAmt}, Rep:${salesRep}`);
        persist();
    }

    // Sale with profit distribution in ZMW
    function recordSale(gramsSold, sellRateUSD, conversionChoice, customConvertUSD = 0) {
        let remaining = gramsSold;
        let totalCostBasisZMW = 0;
        for (let p of state.goldPurchases) {
            if (remaining <= 0) break;
            if (p.remainingGrams <= 0) continue;
            const taken = Math.min(p.remainingGrams, remaining);
            const proportionCost = (taken / p.grams) * p.netPaid;
            totalCostBasisZMW += proportionCost;
            p.remainingGrams -= taken;
            remaining -= taken;
        }
        if (remaining > 0) throw new Error("Insufficient inventory");
        const revenueUSD = gramsSold * sellRateUSD;
        const costBasisUSD = totalCostBasisZMW / state.exchangeRate;
        const profitUSD = revenueUSD - costBasisUSD;
        const profitZMW = profitUSD * state.exchangeRate;
        const perShare = profitZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW += perShare);
        
        let usdKept = 0, zmwConverted = 0;
        if (conversionChoice === "keep_all") { usdKept = revenueUSD; state.companyCashUSD += revenueUSD; }
        else if (conversionChoice === "convert_all") { zmwConverted = revenueUSD * state.exchangeRate; state.companyCashZMW += zmwConverted; }
        else if (conversionChoice === "partial" && customConvertUSD > 0) {
            const convertUSD = Math.min(customConvertUSD, revenueUSD);
            zmwConverted = convertUSD * state.exchangeRate;
            usdKept = revenueUSD - convertUSD;
            state.companyCashZMW += zmwConverted;
            state.companyCashUSD += usdKept;
        }
        state.goldSales.push({ id: Date.now(), date: new Date().toISOString(), gramsSold, sellRateUSD, revenueUSD, profitUSD, conversionChoice, usdKept, zmwConverted });
        logCashTransaction("GOLD_SALE", zmwConverted, usdKept, `Sold ${gramsSold}g @ ${sellRateUSD} USD/g, profit ${profitUSD} USD`);
        persist();
    }

    function addExpense(desc, amountZMW) {
        const perShare = amountZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW -= perShare);
        state.expenses.push({ id: Date.now(), date: new Date().toISOString(), description: desc, amountZMW });
        state.companyCashZMW -= amountZMW;
        logCashTransaction("EXPENSE", -amountZMW, 0, desc);
        persist();
    }

    function addSurveyRevenue(amountZMW, customerName) {
        const perShare = amountZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW += perShare);
        state.surveyRevenues.push({ id: Date.now(), date: new Date().toISOString(), amountZMW, customerName });
        state.companyCashZMW += amountZMW;
        logCashTransaction("SURVEY_REVENUE", amountZMW, 0, `Survey from ${customerName}`);
        persist();
    }

    // Loan / Liability
    function addLiability(lender, amountZMW, interestRate, dueDate, notes) {
        state.liabilities.push({
            id: Date.now(), date: new Date().toISOString(), lender, amountZMW, remainingBalance: amountZMW,
            interestRate: interestRate || 0, dueDate, notes
        });
        state.companyCashZMW += amountZMW;
        logCashTransaction("LOAN_RECEIVED", amountZMW, 0, `Loan from ${lender} (${formatZMW(amountZMW)})`);
        persist();
    }

    function repayLiability(liabilityId, repayAmount) {
        const loan = state.liabilities.find(l => l.id === liabilityId);
        if (!loan || repayAmount > loan.remainingBalance) throw new Error("Invalid repayment");
        loan.remainingBalance -= repayAmount;
        state.companyCashZMW -= repayAmount;
        logCashTransaction("LOAN_REPAYMENT", -repayAmount, 0, `Repaid ${formatZMW(repayAmount)} to ${loan.lender}`);
        persist();
    }

    // Debtor (customer owes)
    function addDebtor(customerName, amountZMW, dueDate, notes) {
        state.debtors.push({
            id: Date.now(), date: new Date().toISOString(), customerName, amountZMW, remainingBalance: amountZMW, dueDate, notes
        });
        logCashTransaction("DEBTOR_CREATED", 0, 0, `Debt recorded: ${customerName} owes ${formatZMW(amountZMW)}`);
        persist();
    }

    function receiveDebtPayment(debtorId, payAmount) {
        const debtor = state.debtors.find(d => d.id === debtorId);
        if (!debtor || payAmount > debtor.remainingBalance) throw new Error("Invalid payment");
        debtor.remainingBalance -= payAmount;
        state.companyCashZMW += payAmount;
        logCashTransaction("DEBTOR_PAYMENT", payAmount, 0, `Received ${formatZMW(payAmount)} from ${debtor.customerName}`);
        persist();
    }

    function requestWithdrawalZMW(shareholderId, amountZMW) {
        const sh = state.shareholders.find(s => s.id === shareholderId);
        if (!sh || sh.balanceZMW < amountZMW) throw new Error("Insufficient balance");
        state.withdrawalRequests.push({ id: Date.now(), date: new Date().toISOString(), shareholderId, shareholderName: sh.name, amountZMW, status: "pending" });
        persist();
    }

    function approveWithdrawal(reqId) {
        const req = state.withdrawalRequests.find(r => r.id === reqId);
        if (!req || req.status !== "pending") return false;
        const shareholder = state.shareholders.find(s => s.id === req.shareholderId);
        if (!shareholder || shareholder.balanceZMW < req.amountZMW || state.companyCashZMW < req.amountZMW) return false;
        shareholder.balanceZMW -= req.amountZMW;
        state.companyCashZMW -= req.amountZMW;
        req.status = "approved";
        logCashTransaction("WITHDRAWAL", -req.amountZMW, 0, `Withdrawal by ${shareholder.name}`);
        persist();
        return true;
    }

    function exchangeCurrency(fromCurr, amount, rate) {
        if (fromCurr === "ZMW") {
            if (state.companyCashZMW < amount) throw new Error("Insufficient ZMW");
            const usdReceived = amount / rate;
            state.companyCashZMW -= amount;
            state.companyCashUSD += usdReceived;
            logCashTransaction("EXCHANGE", -amount, usdReceived, `ZMW → USD at rate ${rate}`);
        } else {
            if (state.companyCashUSD < amount) throw new Error("Insufficient USD");
            const zmwReceived = amount * rate;
            state.companyCashUSD -= amount;
            state.companyCashZMW += zmwReceived;
            logCashTransaction("EXCHANGE", zmwReceived, -amount, `USD → ZMW at rate ${rate}`);
        }
        state.exchangeRate = rate;
        persist();
    }

    function getCashTransactionHistory() { return state.cashTransactions; }

    // ---------- RENDER ----------
    function render() {
        const root = document.getElementById('root');
        if (!currentUser) {
            root.innerHTML = renderLogin();
            document.getElementById('loginBtn')?.addEventListener('click', doLogin);
        } else {
            root.innerHTML = renderApp();
            attachEvents();
        }
        if (modalData) renderModal();
    }

    function renderLogin() {
        return `<div class="login-screen"><div class="login-card">
            <h1>🏦 Gold Trade Pro</h1>
            <div class="field"><label>Username</label><input id="loginUser" placeholder="Admin / Samatar / Yuusuf" /></div>
            <div class="field"><label>Password</label><input id="loginPass" type="password" /></div>
            <button class="btn-gold" id="loginBtn">Access System</button>
            <div id="loginError" class="error-msg"></div>
        </div></div>`;
    }

    function doLogin() {
        const user = document.getElementById('loginUser').value.trim();
        const pwd = document.getElementById('loginPass').value;
        if (user === state.adminUser.name && pwd === state.adminUser.password) { currentUser = { name: "Admin", role: "admin" }; render(); return; }
        if (user === state.managerUser.name && pwd === state.managerUser.password) { currentUser = { name: "Samatar", role: "manager" }; render(); return; }
        const sh = state.shareholders.find(s => s.name.toLowerCase() === user.toLowerCase() && s.password === pwd);
        if (sh) { currentUser = { name: sh.name, role: "shareholder", shareholderId: sh.id }; render(); return; }
        document.getElementById('loginError').innerText = "Invalid credentials";
    }

    function renderApp() {
        const isPrivileged = (currentUser.role === 'admin' || currentUser.role === 'manager');
        const nav = [
            { id: "dashboard", label: "📊 Dashboard" }, { id: "purchase", label: "💎 Buy Gold" },
            { id: "sales", label: "💰 Sell Gold" }, { id: "survey", label: "📋 Survey Revenue" },
            { id: "loans", label: "🏦 Loans & Debts" }, { id: "reports", label: "📅 Monthly Reports" },
            { id: "withdrawals", label: "🏧 Withdrawals" }
        ];
        const navBtns = nav.map(t => `<button class="nav-btn ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');
        let content = "";
        if (activeTab === "dashboard") content = dashboardHTML(isPrivileged);
        else if (activeTab === "purchase") content = purchaseHTML(isPrivileged);
        else if (activeTab === "sales") content = salesHTML(isPrivileged);
        else if (activeTab === "survey") content = surveyHTML(isPrivileged);
        else if (activeTab === "loans") content = loansHTML(isPrivileged);
        else if (activeTab === "reports") content = reportsHTML(isPrivileged);
        else if (activeTab === "withdrawals") content = withdrawalsHTML(isPrivileged);
        return `<div class="mobile-header"><button id="menuToggle" style="background:none;border:none;font-size:1.6rem;">☰</button><span>Gold Ledger</span><div></div></div>
        <div class="sidebar" id="sidebar"><div class="logo-area"><h2>⚜️ GOLD PRO</h2></div><div class="nav-menu">${navBtns}</div>
        <div class="user-section"><div class="user-badge"><div>${currentUser.name}</div><div style="font-size:0.7rem">${currentUser.role}</div></div>
        <button class="btn-outline" id="logoutBtn">Sign Out</button></div></div>
        <div class="content-main">${content}</div>`;
    }

    function dashboardHTML(isPrivileged) {
        const totalLiab = state.liabilities.reduce((s,l)=> s + l.remainingBalance,0);
        const totalDebtors = state.debtors.reduce((s,d)=> s + d.remainingBalance,0);
        return `<div class="stats-row">
            <div class="stat-card" id="clickZMW"><div class="stat-label">💰 ZMW Cash</div><div class="stat-value">${formatZMW(state.companyCashZMW)}</div></div>
            <div class="stat-card" id="clickUSD"><div class="stat-label">💵 USD Cash</div><div class="stat-value">${formatUSD(state.companyCashUSD)}</div></div>
            <div class="stat-card"><div class="stat-label">📦 Gold Stock</div><div class="stat-value">${formatGrams(state.goldPurchases.reduce((a,b)=>a+b.grams,0) - state.goldSales.reduce((a,b)=>a+b.gramsSold,0))}</div></div>
            <div class="stat-card"><div class="stat-label">⚖️ Net Equity</div><div class="stat-value">${formatZMW(state.companyCashZMW + (state.companyCashUSD*state.exchangeRate) - totalLiab)}</div></div>
        </div>
        <div class="two-col">
            <div class="card"><div class="card-title">🏛️ Liabilities (Loans)</div><div class="stat-value" style="font-size:1.2rem">${formatZMW(totalLiab)}</div><div>${state.liabilities.length} active loans</div></div>
            <div class="card"><div class="card-title">👥 Debtors (Owe us)</div><div class="stat-value" style="font-size:1.2rem">${formatZMW(totalDebtors)}</div><div>${state.debtors.length} customers</div></div>
        </div>
        <div class="card"><div class="card-title">👤 Shareholders (ZMW)</div>${state.shareholders.map(s => `<div style="display:flex;justify-content:space-between"><span>${s.name}</span><span class="green">${formatZMW(s.balanceZMW)}</span></div>`).join('')}</div>`;
    }

    function purchaseHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Only Admin/Manager can record purchases</div></div>`;
        const repOpts = state.salesReps.map(r => `<option>${r}</option>`).join('');
        return `<div class="card"><div class="card-title">🛒 Buy Gold (ZMW) + Mashiin/Transport</div>
            <div class="form-group"><label>Grams</label><input id="grams" type="number" /></div>
            <div class="form-group"><label>Rate (ZMW/gram)</label><input id="rate" type="number" /></div>
            <div class="form-group"><label>Mashiin (ZMW)</label><input id="mashiin" value="${state.defaultMashiin}" /></div>
            <div class="form-group"><label>Transport (ZMW)</label><input id="transport" value="${state.defaultTransport}" /></div>
            <div class="form-group"><label>Sales Rep</label><select id="rep">${repOpts}</select></div>
            <button class="btn-action" id="doPurchase">Record Purchase</button></div>`;
    }

    function salesHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Manager/Admin only</div></div>`;
        return `<div class="card"><div class="card-title">📈 Sell Gold (USD)</div>
            <div class="form-group"><label>Grams</label><input id="sellGrams" type="number" /></div>
            <div class="form-group"><label>Sell Rate (USD/g)</label><input id="sellRate" type="number" /></div>
            <div class="form-group"><label>Conversion</label><select id="conv"><option value="convert_all">All to ZMW</option><option value="keep_all">Keep USD</option><option value="partial">Partial to ZMW</option></select></div>
            <div id="partialBox" style="display:none"><div class="form-group"><label>USD to convert</label><input id="partialUsd" type="number" /></div></div>
            <button class="btn-action" id="doSale">Sell & Distribute Profit (ZMW)</button></div>`;
    }

    function surveyHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Manager/Admin only</div></div>`;
        return `<div class="card"><div class="card-title">📋 Survey Revenue (ZMW)</div>
            <div class="form-group"><label>Customer Name</label><input id="custName" placeholder="Customer" /></div>
            <div class="form-group"><label>Amount (ZMW)</label><input id="survAmt" type="number" /></div>
            <button class="btn-action" id="doSurvey">Add & Distribute to Shareholders</button></div>
            <div class="card"><div class="card-title">📜 Past Survey Revenue</div>${state.surveyRevenues.map(s => `<div>${s.customerName} : ${formatZMW(s.amountZMW)} (${new Date(s.date).toLocaleDateString()})</div>`).join('') || '<div class="muted">None</div>'}</div>`;
    }

    function loansHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Admin/Manager only</div></div>`;
        return `<div class="two-col">
            <div class="card"><div class="card-title">➕ New Liability (Loan Received)</div>
                <div class="form-group"><label>Lender Name</label><input id="lender" /></div><div class="form-group"><label>Amount (ZMW)</label><input id="loanAmt" type="number" /></div>
                <div class="form-group"><label>Interest Rate (%)</label><input id="interest" value="0" /></div><div class="form-group"><label>Due Date</label><input id="dueDate" type="date" /></div>
                <button class="btn-action" id="addLiability">Add Loan</button></div>
            <div class="card"><div class="card-title">➕ New Debtor (Customer Owes)</div>
                <div class="form-group"><label>Customer</label><input id="debtCust" /></div><div class="form-group"><label>Amount (ZMW)</label><input id="debtAmt" type="number" /></div>
                <div class="form-group"><label>Due Date</label><input id="debtDue" type="date" /></div>
                <button class="btn-action" id="addDebtor">Add Debtor</button></div>
        </div>
        <div class="card"><div class="card-title">📋 Active Loans</div>${state.liabilities.map(l => `<div style="display:flex;justify-content:space-between">${l.lender}: ${formatZMW(l.remainingBalance)} / ${formatZMW(l.amountZMW)} <button class="btn-sm" data-repay="${l.id}">Repay</button></div>`).join('')}</div>
        <div class="card"><div class="card-title">📋 Debtors</div>${state.debtors.map(d => `<div style="display:flex;justify-content:space-between">${d.customerName}: ${formatZMW(d.remainingBalance)} <button class="btn-sm" data-paydebt="${d.id}">Receive Payment</button></div>`).join('')}</div>`;
    }

    function reportsHTML(isPrivileged) {
        const months = [...new Set(state.cashTransactions.map(t => new Date(t.date).toLocaleString('default', { year:'numeric', month:'long' })))];
        return `<div class="card"><div class="card-title">📆 Monthly Report</div>
            <select id="monthSelect">${months.map(m => `<option>${m}</option>`).join('')}</select>
            <button class="btn-sm" id="generateReport" style="margin-top:10px">Generate & Print PDF</button>
            <div id="reportPreview" style="margin-top:20px"></div></div>`;
    }

    function withdrawalsHTML(isPrivileged) {
        const reqs = state.withdrawalRequests.filter(r => isPrivileged || r.shareholderId === currentUser.shareholderId);
        return `<div class="card"><div class="card-title">🏧 Withdrawals (ZMW)</div>
            ${!isPrivileged ? `<button class="btn-sm" id="requestWBtn">Request Withdrawal</button>` : ''}
            <table><thead><tr><th>User</th><th>Amount</th><th>Status</th>${isPrivileged ? '<th>Action</th>' : ''}</tr></thead>
            <tbody>${reqs.map(r => `<tr><td>${r.shareholderName}</td><td>${formatZMW(r.amountZMW)}</td><td class="${r.status}">${r.status}</td>${isPrivileged && r.status === 'pending' ? `<td><button class="btn-sm" data-apr="${r.id}">Approve</button></td>` : ''}</tr>`).join('')}</tbody></table></div>`;
    }

    function attachEvents() {
        document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', (e) => { activeTab = btn.dataset.tab; render(); }));
        document.getElementById('logoutBtn')?.addEventListener('click', () => { currentUser = null; render(); });
        const isPriv = currentUser.role === 'admin' || currentUser.role === 'manager';
        if (isPriv) {
            document.getElementById('doPurchase')?.addEventListener('click', () => {
                const g=parseFloat(document.getElementById('grams').value), r=parseFloat(document.getElementById('rate').value);
                const m=parseFloat(document.getElementById('mashiin').value)||0, t=parseFloat(document.getElementById('transport').value)||0, rep=document.getElementById('rep').value;
                if(!g||!r) return alert("Invalid");
                recordPurchase(g,r,m,t,rep); render();
            });
            document.getElementById('doSale')?.addEventListener('click', () => {
                const g=parseFloat(document.getElementById('sellGrams').value), rate=parseFloat(document.getElementById('sellRate').value);
                const conv=document.getElementById('conv').value, partial=parseFloat(document.getElementById('partialUsd').value)||0;
                if(!g||!rate) return;
                recordSale(g,rate,conv,partial); render();
            });
            document.getElementById('conv')?.addEventListener('change', e => document.getElementById('partialBox').style.display = e.target.value === 'partial' ? 'block' : 'none');
            document.getElementById('doSurvey')?.addEventListener('click', () => { 
                const cust=document.getElementById('custName').value, amt=parseFloat(document.getElementById('survAmt').value);
                if(!cust||!amt) return; addSurveyRevenue(amt,cust); render();
            });
            document.getElementById('addLiability')?.addEventListener('click', () => {
                const lender=document.getElementById('lender').value, amt=parseFloat(document.getElementById('loanAmt').value);
                if(!lender||!amt) return; addLiability(lender,amt,0,document.getElementById('dueDate').value,""); render();
            });
            document.getElementById('addDebtor')?.addEventListener('click', () => {
                const cust=document.getElementById('debtCust').value, amt=parseFloat(document.getElementById('debtAmt').value);
                if(!cust||!amt) return; addDebtor(cust,amt,document.getElementById('debtDue').value,""); render();
            });
            document.querySelectorAll('[data-repay]').forEach(btn => btn.addEventListener('click', (e) => {
                const id=parseInt(btn.dataset.repay);
                const amt=parseFloat(prompt("Repay amount (ZMW)"));
                if(amt) repayLiability(id,amt); render();
            }));
            document.querySelectorAll('[data-paydebt]').forEach(btn => btn.addEventListener('click', (e) => {
                const id=parseInt(btn.dataset.paydebt);
                const amt=parseFloat(prompt("Receive payment (ZMW)"));
                if(amt) receiveDebtPayment(id,amt); render();
            }));
            document.querySelectorAll('[data-apr]').forEach(btn => btn.addEventListener('click', (e) => { approveWithdrawal(parseInt(btn.dataset.apr)); render(); }));
            document.getElementById('generateReport')?.addEventListener('click', () => {
                const month = document.getElementById('monthSelect').value;
                const filtered = state.cashTransactions.filter(t => new Date(t.date).toLocaleString('default',{month:'long',year:'numeric'}) === month);
                const html = `<h3>Report ${month}</h3>${filtered.map(t => `<div>${new Date(t.date).toLocaleDateString()} ${t.type}: ZMW ${t.amountZMW.toFixed(2)} | USD ${t.amountUSD.toFixed(2)} | ${t.description}</div>`).join('')}`;
                const win = window.open(); win.document.write(`<html><head><title>Gold Report</title><style>body{font-family:monospace;padding:20px}</style></head><body>${html}</body></html>`); win.print();
            });
        }
        if(currentUser.role === 'shareholder') document.getElementById('requestWBtn')?.addEventListener('click', () => { const amt=parseFloat(prompt("Amount ZMW")); if(amt) requestWithdrawalZMW(currentUser.shareholderId, amt); render(); });
        document.getElementById('clickZMW')?.addEventListener('click', () => modalData = { title: "ZMW Cash History", items: state.cashTransactions.map(t => `${new Date(t.date).toLocaleString()} ${t.type}: ${formatZMW(t.amountZMW)} | ${t.description} | Balance: ${formatZMW(t.runningBalanceZMW)}`) });
        document.getElementById('clickUSD')?.addEventListener('click', () => modalData = { title: "USD Cash History", items: state.cashTransactions.map(t => `${new Date(t.date).toLocaleString()} ${t.type}: ${formatUSD(t.amountUSD)} | ${t.description} | Balance: ${formatUSD(t.runningBalanceUSD)}`) });
        document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar')?.classList.toggle('open'));
    }

    function renderModal() {
        const div = document.createElement('div'); div.className = 'modal'; div.innerHTML = `<div class="modal-content"><h3>${modalData.title}</h3><div style="max-height:60vh;overflow-y:auto">${modalData.items.map(i=>`<div style="border-bottom:1px solid #333;padding:6px 0">${i}</div>`).join('')}</div><button class="btn-sm" onclick="closeModal()">Close</button></div>`;
        document.body.appendChild(div); window.closeModal = () => { modalData = null; document.body.removeChild(div); render(); };
    }

    render();
</script>
</body>
</html>
