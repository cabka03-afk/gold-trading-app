<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gold Trading System</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Georgia, serif; background: #0a0a08; color: #f0ead6; min-height: 100vh; }

/* LOGIN */
.login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0a08; padding: 20px; }
.login-box { background: #1a1a17; border: 1px solid rgba(200,169,110,0.3); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 380px; }
.login-box h1 { font-size: 1.6rem; color: #c8a96e; text-align: center; margin-bottom: 4px; }
.login-box h3 { font-size: 0.75rem; color: #6b6558; text-align: center; margin-bottom: 28px; font-weight: normal; letter-spacing: 0.08em; text-transform: uppercase; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.72rem; color: #9a9080; margin-bottom: 5px; font-family: Arial, sans-serif; letter-spacing: 0.06em; text-transform: uppercase; }
.field input { width: 100%; padding: 12px 14px; background: #222220; border: 1px solid rgba(200,169,110,0.2); border-radius: 8px; color: #f0ead6; font-size: 0.9rem; font-family: Arial, sans-serif; outline: none; }
.field input:focus { border-color: rgba(200,169,110,0.5); }
.btn-gold { width: 100%; padding: 13px; background: linear-gradient(135deg, #8b6914, #c8a96e); border: none; border-radius: 8px; color: #0a0a08; font-size: 0.9rem; font-weight: bold; cursor: pointer; margin-top: 6px; font-family: Arial, sans-serif; }
.btn-gold:hover { opacity: 0.9; }
.err { color: #d96b6b; font-size: 0.8rem; text-align: center; margin-top: 8px; font-family: Arial, sans-serif; }
.creds { margin-top: 20px; background: rgba(200,169,110,0.05); border: 1px solid rgba(200,169,110,0.1); border-radius: 8px; padding: 14px; font-family: Arial, sans-serif; font-size: 0.73rem; color: #6b6558; line-height: 2; }
.creds strong { color: #c8a96e; }
.creds code { background: #222; color: #f0ead6; padding: 1px 5px; border-radius: 3px; font-size: 0.7rem; }

/* LAYOUT */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 200px; background: #111110; border-right: 1px solid rgba(200,169,110,0.1); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
.sidebar-top { padding: 20px 16px; border-bottom: 1px solid rgba(200,169,110,0.1); }
.sidebar-top h2 { color: #c8a96e; font-size: 1rem; }
.sidebar-top p { color: #6b6558; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; font-family: Arial, sans-serif; }
.nav { flex: 1; padding: 12px 10px; }
.nav-btn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 11px; border: none; background: none; color: #9a9080; font-size: 0.82rem; font-family: Arial, sans-serif; cursor: pointer; border-radius: 7px; text-align: left; margin-bottom: 2px; transition: all 0.15s; }
.nav-btn:hover { background: #1a1a17; color: #f0ead6; }
.nav-btn.active { background: rgba(200,169,110,0.12); color: #c8a96e; }
.sidebar-bottom { padding: 14px; border-top: 1px solid rgba(200,169,110,0.1); }
.user-box { background: #1a1a17; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.user-box .uname { font-size: 0.82rem; color: #f0ead6; font-family: Arial, sans-serif; }
.user-box .urole { font-size: 0.65rem; color: #6b6558; font-family: Arial, sans-serif; text-transform: capitalize; }
.btn-logout { width: 100%; padding: 8px; background: none; border: 1px solid rgba(200,169,110,0.2); border-radius: 7px; color: #9a9080; font-family: Arial, sans-serif; font-size: 0.75rem; cursor: pointer; }
.btn-logout:hover { border-color: #d96b6b; color: #d96b6b; }

/* CONTENT */
.content { margin-left: 200px; flex: 1; padding: 28px; }
.page-title { margin-bottom: 22px; }
.page-title h1 { font-size: 1.6rem; color: #f0ead6; }
.page-title p { font-size: 0.77rem; color: #6b6558; margin-top: 3px; font-family: Arial, sans-serif; }

/* STATS */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card { background: #111110; border: 1px solid rgba(200,169,110,0.12); border-radius: 10px; padding: 18px 20px; }
.stat-card .label { font-size: 0.67rem; color: #6b6558; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; font-family: Arial, sans-serif; }
.stat-card .value { font-size: 1.7rem; color: #c8a96e; font-weight: bold; }
.stat-card .value.green { color: #5cb87a; }
.stat-card .value.red { color: #d96b6b; }

/* CARD */
.card { background: #111110; border: 1px solid rgba(200,169,110,0.12); border-radius: 10px; padding: 22px; margin-bottom: 18px; }
.card-title { font-size: 1.05rem; color: #f0ead6; margin-bottom: 16px; }

/* BALANCE LIST */
.bal-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.bal-item:last-child { border-bottom: none; }
.bal-left { display: flex; align-items: center; gap: 10px; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, #8b6914, #c8a96e); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #0a0a08; font-family: Arial, sans-serif; }
.bal-name { font-size: 0.88rem; font-family: Arial, sans-serif; }
.bal-sub { font-size: 0.68rem; color: #6b6558; font-family: Arial, sans-serif; }
.bal-right { display: flex; align-items: center; gap: 10px; }
.bal-amount { font-size: 1.2rem; color: #c8a96e; font-weight: bold; }

/* BUTTONS */
.btn-sm { padding: 6px 13px; background: rgba(200,169,110,0.1); border: 1px solid rgba(200,169,110,0.22); color: #c8a96e; border-radius: 6px; font-family: Arial, sans-serif; font-size: 0.73rem; cursor: pointer; }
.btn-sm:hover { background: rgba(200,169,110,0.2); }
.btn-approve { padding: 6px 13px; background: rgba(92,184,122,0.1); border: 1px solid rgba(92,184,122,0.22); color: #5cb87a; border-radius: 6px; font-family: Arial, sans-serif; font-size: 0.73rem; cursor: pointer; }
.btn-approve:hover { background: rgba(92,184,122,0.2); }
.btn-action { padding: 11px 20px; background: linear-gradient(135deg, #8b6914, #c8a96e); border: none; border-radius: 8px; color: #0a0a08; font-weight: bold; font-family: Arial, sans-serif; font-size: 0.82rem; cursor: pointer; width: 100%; margin-top: 6px; }
.btn-action:hover { opacity: 0.9; }

/* FORM */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 0.68rem; color: #9a9080; margin-bottom: 5px; font-family: Arial, sans-serif; text-transform: uppercase; letter-spacing: 0.06em; }
.form-group input { width: 100%; padding: 10px 12px; background: #1a1a17; border: 1px solid rgba(200,169,110,0.18); border-radius: 7px; color: #f0ead6; font-family: Arial, sans-serif; font-size: 0.87rem; outline: none; }
.form-group input:focus { border-color: rgba(200,169,110,0.4); }

/* TABLE */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; }
th { padding: 9px 13px; font-size: 0.65rem; color: #6b6558; text-transform: uppercase; letter-spacing: 0.06em; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); font-weight: normal; }
td { padding: 12px 13px; font-size: 0.83rem; border-bottom: 1px solid rgba(255,255,255,0.03); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

/* BADGE */
.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.7rem; font-family: Arial, sans-serif; font-weight: bold; }
.badge-pending { background: rgba(200,169,110,0.1); color: #c8a96e; border: 1px solid rgba(200,169,110,0.2); }
.badge-approved { background: rgba(92,184,122,0.1); color: #5cb87a; border: 1px solid rgba(92,184,122,0.2); }

.green { color: #5cb87a; }
.red { color: #d96b6b; }
.muted { color: #6b6558; }
.empty { text-align: center; padding: 36px; color: #6b6558; font-family: Arial, sans-serif; font-size: 0.83rem; }

/* MOBILE */
.mobile-bar { display: none; }
@media(max-width: 768px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.25s; }
  .sidebar.open { transform: translateX(0); }
  .content { margin-left: 0; padding: 16px; }
  .mobile-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #111110; border-bottom: 1px solid rgba(200,169,110,0.1); position: sticky; top: 0; z-index: 5; }
  .mobile-bar h2 { color: #c8a96e; font-size: 1rem; }
  .hamburger { background: none; border: none; color: #f0ead6; font-size: 1.3rem; cursor: pointer; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9; display: none; }
  .overlay.show { display: block; }
  .stats { grid-template-columns: 1fr 1fr; }
  .grid2 { grid-template-columns: 1fr; }
}
@media(min-width: 769px) { .mobile-bar { display: none; } .overlay { display: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
var DF = {
  goldPurchases: [], goldSales: [], expenses: [], surveyRevenues: [],
  withdrawalRequests: [],
  shareholders: [
    {id:1, name:"Ahmed", password:"ahmed123", balance:0},
    {id:2, name:"Sara",  password:"sara123",  balance:0},
    {id:3, name:"Omar",  password:"omar123",  balance:0}
  ],
  companyCash: 0
};

function loadData() { try { return JSON.parse(localStorage.getItem('gtd3')) || DF; } catch(e) { return DF; } }
function saveData(d) { localStorage.setItem('gtd3', JSON.stringify(d)); }

var data = loadData();
var user = null;
var tab = 'dashboard';
var sideOpen = false;

function f$(n) { return '$' + (parseFloat(n)||0).toFixed(2); }
function fg(n) { return (parseFloat(n)||0).toFixed(2) + 'g'; }
function fd(iso) { return new Date(iso).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'2-digit'}); }
function ini(n) { return n.slice(0,2).toUpperCase(); }
function pc(v) { return v >= 0 ? 'green' : 'red'; }

function getStats() {
  var b = data.goldPurchases.reduce(function(s,p){return s+p.grams;}, 0);
  var sol = data.goldSales.reduce(function(s,p){return s+p.grams;}, 0);
  var gv = data.goldPurchases.reduce(function(s,p){return s+p.totalCost;}, 0);
  var sr = data.goldSales.reduce(function(s,p){return s+p.totalRevenue;}, 0);
  var ex = data.expenses.reduce(function(s,e){return s+e.amount;}, 0);
  var sv = data.surveyRevenues.reduce(function(s,r){return s+r.amount;}, 0);
  var gp = data.goldSales.reduce(function(s,p){return s+p.profit;}, 0);
  return {b:b, sol:sol, inv:b-sol, gv:gv, sr:sr, ex:ex, sv:sv, gp:gp, net:gp+sv-ex};
}

function addBuy(g,r) {
  var c = g*r;
  data.goldPurchases.push({id:Date.now(), date:new Date().toISOString(), grams:g, rate:r, totalCost:c, remainingGrams:g});
  data.companyCash -= c;
  saveData(data); render();
}
function addSell(g,r) {
  var rem=g, cb=0;
  data.goldPurchases.forEach(function(p) {
    if(rem<=0||p.remainingGrams<=0) return;
    var t=Math.min(p.remainingGrams,rem); cb+=t*p.rate; p.remainingGrams-=t; rem-=t;
  });
  var rev=g*r, pf=rev-cb, ps=pf/3;
  data.goldSales.push({id:Date.now(), date:new Date().toISOString(), grams:g, sellRate:r, totalRevenue:rev, profit:pf, profitPerShareholder:ps});
  data.shareholders.forEach(function(s){s.balance+=ps;});
  data.companyCash+=rev;
  saveData(data); render();
}
function addExp(desc,amt) {
  var ps=amt/3;
  data.expenses.push({id:Date.now(), date:new Date().toISOString(), description:desc, amount:amt});
  data.shareholders.forEach(function(s){s.balance-=ps;});
  data.companyCash-=amt;
  saveData(data); render();
}
function addSurv(amt) {
  var ps=amt/3;
  data.surveyRevenues.push({id:Date.now(), date:new Date().toISOString(), amount:amt, dividendPerPerson:ps});
  data.shareholders.forEach(function(s){s.balance+=ps;});
  data.companyCash+=amt;
  saveData(data); render();
}
function reqW(sid,amt) {
  var sh=data.shareholders.find(function(s){return s.id===sid;});
  if(!sh||sh.balance<amt){alert('Insufficient balance!');return;}
  data.withdrawalRequests.push({id:Date.now(), date:new Date().toISOString(), shareholderId:sid, shareholderName:sh.name, amount:amt, status:'pending'});
  saveData(data); render();
}
function appW(rid) {
  var r=data.withdrawalRequests.find(function(x){return x.id===rid;});
  if(!r||r.status!=='pending') return;
  var sh=data.shareholders.find(function(s){return s.id===r.shareholderId;});
  if(sh) sh.balance-=r.amount;
  r.status='approved'; data.companyCash-=r.amount;
  saveData(data); render();
}

function render() {
  document.getElementById('app').innerHTML = user ? appHTML() : loginHTML();
  bindEvents();
}

function loginHTML() {
  return '<div class="login-page"><div class="login-box">' +
    '<h1>💰 Gold Trading</h1>' +
    '<h3>Shareholder &amp; Dividend System</h3>' +
    '<div class="field"><label>Username</label><input id="un" type="text" placeholder="Enter username"/></div>' +
    '<div class="field"><label>Password</label><input id="pw" type="password" placeholder="Enter password"/></div>' +
    '<button class="btn-gold" id="lbtn">Sign In</button>' +
    '<div id="ler" class="err"></div>' +
    '<div class="creds"><strong>Login Credentials</strong><br/>' +
    '&#128081; Admin &nbsp;<code>admin</code> / <code>admin123</code><br/>' +
    '&#128100; Ahmed &nbsp;<code>ahmed</code> / <code>ahmed123</code><br/>' +
    '&#128100; Sara &nbsp;&nbsp;<code>sara</code> / <code>sara123</code><br/>' +
    '&#128100; Omar &nbsp;&nbsp;<code>omar</code> / <code>omar123</code>' +
    '</div></div></div>';
}

function appHTML() {
  var isA = user.role === 'admin';
  var s = getStats();
  var tabs = [
    {id:'dashboard', label:'&#9632; Dashboard'},
    {id:'transactions', label:'&#8597; Transactions'},
    {id:'shareholders', label:'&#9679; Shareholders'},
    {id:'withdrawals', label:'&#9675; Withdrawals'},
    {id:'reports', label:'&#9632; Reports'}
  ];
  var nav = tabs.map(function(t) {
    return '<button class="nav-btn' + (tab===t.id?' active':'') + '" data-tab="' + t.id + '">' + t.label + '</button>';
  }).join('');
  var a = ini(user.name);
  var sidebar = '<div class="sidebar" id="sb">' +
    '<div class="sidebar-top"><h2>&#x1F4B0; Gold Trading</h2><p>Management System</p></div>' +
    '<nav class="nav">' + nav + '</nav>' +
    '<div class="sidebar-bottom">' +
    '<div class="user-box"><div class="uname">' + user.name + '</div><div class="urole">' + user.role + '</div></div>' +
    '<button class="btn-logout" id="lout">Sign Out</button>' +
    '</div></div>';
  var mbar = '<div class="mobile-bar"><button class="hamburger" id="mbtn">&#9776;</button>' +
    '<h2>&#x1F4B0; Gold Trading</h2><div style="width:24px"></div></div>';
  var ovl = '<div class="overlay" id="ovl"></div>';
  var pg = '';
  if(tab==='dashboard') pg = dashHTML(s,isA);
  else if(tab==='transactions') pg = txHTML(isA);
  else if(tab==='shareholders') pg = shHTML(isA);
  else if(tab==='withdrawals') pg = wdHTML(isA);
  else if(tab==='reports') pg = rpHTML(s,isA);
  return ovl + sidebar + mbar + '<div class="content">' + pg + '</div>';
}

function dashHTML(s,isA) {
  var rows = data.shareholders.map(function(x) {
    return '<div class="bal-item">' +
      '<div class="bal-left"><div class="avatar">' + ini(x.name) + '</div>' +
      '<div><div class="bal-name">' + x.name + '</div><div class="bal-sub">Shareholder</div></div></div>' +
      '<div class="bal-right"><div class="bal-amount">' + f$(x.balance) + '</div>' +
      (!isA && user.shareholderId===x.id ? '<button class="btn-sm" data-w="'+x.id+'">Withdraw</button>' : '') +
      '</div></div>';
  }).join('');
  return '<div class="page-title"><h1>Dashboard</h1><p>Overview of your gold trading operations</p></div>' +
    '<div class="stats">' +
    '<div class="stat-card"><div class="label">Company Cash</div><div class="value">' + f$(data.companyCash) + '</div></div>' +
    '<div class="stat-card"><div class="label">Gold Inventory</div><div class="value">' + fg(s.inv) + '</div></div>' +
    '<div class="stat-card"><div class="label">Gold Profit</div><div class="value ' + pc(s.gp) + '">' + f$(s.gp) + '</div></div>' +
    '<div class="stat-card"><div class="label">Net Profit</div><div class="value ' + pc(s.net) + '">' + f$(s.net) + '</div></div>' +
    '</div>' +
    '<div class="card"><div class="card-title">Shareholder Balances</div>' + rows + '</div>';
}

function txHTML(isA) {
  if(!isA) return '<div class="page-title"><h1>Transactions</h1></div><div class="card"><div class="empty">&#9888;&#65039; Only Admin can record transactions.<br/><br/>Shareholders can view reports and request withdrawals.</div></div>';
  return '<div class="page-title"><h1>Transactions</h1><p>Record purchases, sales, expenses and revenue</p></div>' +
    '<div class="grid2">' +
    '<div class="card"><div class="card-title">&#x2193; Buy Gold</div>' +
    '<div class="form-group"><label>Grams</label><input id="bg" type="number" placeholder="0.00"/></div>' +
    '<div class="form-group"><label>Rate per gram ($)</label><input id="br" type="number" placeholder="0.00"/></div>' +
    '<button class="btn-action" id="abuy">Record Purchase</button></div>' +
    '<div class="card"><div class="card-title">&#x2191; Sell Gold</div>' +
    '<div class="form-group"><label>Grams</label><input id="sg" type="number" placeholder="0.00"/></div>' +
    '<div class="form-group"><label>Sell rate ($)</label><input id="sr2" type="number" placeholder="0.00"/></div>' +
    '<button class="btn-action" id="asell">Record Sale</button></div>' +
    '<div class="card"><div class="card-title">&#x2212; Add Expense</div>' +
    '<div class="form-group"><label>Description</label><input id="ed" type="text" placeholder="e.g. Office rent"/></div>' +
    '<div class="form-group"><label>Amount ($)</label><input id="ea" type="number" placeholder="0.00"/></div>' +
    '<button class="btn-action" id="aexp">Add Expense</button></div>' +
    '<div class="card"><div class="card-title">&#x2B; Survey Revenue</div>' +
    '<div class="form-group"><label>Total Amount ($)</label><input id="sa" type="number" placeholder="0.00"/></div>' +
    '<button class="btn-action" id="asurv">Add &amp; Distribute</button></div>' +
    '</div>';
}

function shHTML(isA) {
  var rows = data.shareholders.map(function(x) {
    return '<tr><td><div style="display:flex;align-items:center;gap:10px">' +
      '<div class="avatar" style="width:30px;height:30px;font-size:11px;">' + ini(x.name) + '</div>' + x.name +
      '</div></td><td class="' + pc(x.balance) + '">' + f$(x.balance) + '</td>' +
      (!isA ? '<td>' + (user.shareholderId===x.id ? '<button class="btn-sm" data-w="'+x.id+'">Withdraw</button>' : '&#8212;') + '</td>' : '') +
      '</tr>';
  }).join('');
  return '<div class="page-title"><h1>Shareholders</h1><p>Equity balances and management</p></div>' +
    '<div class="card"><div class="card-title">Shareholder Overview</div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Balance</th>' + (!isA?'<th>Action</th>':'') + '</tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div></div>';
}

function wdHTML(isA) {
  var reqs = data.withdrawalRequests.filter(function(r){ return isA || r.shareholderId===user.shareholderId; });
  var rows = reqs.length===0
    ? '<tr><td colspan="5" style="text-align:center;padding:36px;color:#6b6558;">No withdrawal requests yet</td></tr>'
    : reqs.map(function(r) {
        return '<tr><td>' + fd(r.date) + '</td><td>' + r.shareholderName + '</td><td>' + f$(r.amount) + '</td>' +
          '<td><span class="badge ' + (r.status==='pending'?'badge-pending':'badge-approved') + '">' +
          (r.status==='pending'?'Pending':'Approved') + '</span></td>' +
          (isA ? '<td>' + (r.status==='pending'?'<button class="btn-approve" data-ap="'+r.id+'">Approve &amp; Pay</button>':'&#8212;') + '</td>' : '') +
          '</tr>';
      }).join('');
  return '<div class="page-title"><h1>Withdrawals</h1><p>Manage shareholder withdrawal requests</p></div>' +
    '<div class="card"><div class="card-title">Withdrawal Requests</div>' +
    '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Shareholder</th><th>Amount</th><th>Status</th>' +
    (isA?'<th>Action</th>':'') + '</tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

function rpHTML(s,isA) {
  var sh = user.shareholderId ? data.shareholders.find(function(x){return x.id===user.shareholderId;}) : null;
  return '<div class="page-title"><h1>Reports</h1><p>Financial performance overview</p></div>' +
    '<div class="grid2">' +
    '<div class="card"><div class="card-title">Gold Trading Summary</div><table><tbody>' +
    '<tr><td class="muted">Total Bought</td><td style="text-align:right">' + fg(s.b) + '</td></tr>' +
    '<tr><td class="muted">Total Sold</td><td style="text-align:right">' + fg(s.sol) + '</td></tr>' +
    '<tr><td class="muted">Inventory</td><td style="text-align:right">' + fg(s.inv) + '</td></tr>' +
    '<tr><td class="muted">Purchase Value</td><td style="text-align:right">' + f$(s.gv) + '</td></tr>' +
    '<tr><td class="muted">Sales Revenue</td><td style="text-align:right">' + f$(s.sr) + '</td></tr>' +
    '<tr><td class="muted">Gold Profit</td><td style="text-align:right" class="' + pc(s.gp) + '">' + f$(s.gp) + '</td></tr>' +
    '</tbody></table></div>' +
    '<div class="card"><div class="card-title">Revenue &amp; Expenses</div><table><tbody>' +
    '<tr><td class="muted">Survey Revenue</td><td style="text-align:right">' + f$(s.sv) + '</td></tr>' +
    '<tr><td class="muted">Total Expenses</td><td style="text-align:right" class="red">' + f$(s.ex) + '</td></tr>' +
    '<tr><td class="muted">Company Cash</td><td style="text-align:right">' + f$(data.companyCash) + '</td></tr>' +
    '<tr><td><strong>Net Profit</strong></td><td style="text-align:right"><strong class="' + pc(s.net) + '">' + f$(s.net) + '</strong></td></tr>' +
    '</tbody></table></div>' +
    (!isA && sh ? '<div class="card"><div class="card-title">Your Balance</div>' +
    '<div class="value ' + pc(sh.balance) + '" style="font-size:2rem;margin-bottom:16px">' + f$(sh.balance) + '</div>' +
    '<button class="btn-action" style="width:auto;padding:10px 20px" data-w="' + sh.id + '">Request Withdrawal</button></div>' : '') +
    '</div>';
}

function bindEvents() {
  var lb = document.getElementById('lbtn');
  if(lb) {
    function doLogin() {
      var un = document.getElementById('un').value.trim();
      var pw = document.getElementById('pw').value;
      if(un==='admin' && pw==='admin123') { user={role:'admin',name:'Admin'}; tab='dashboard'; render(); return; }
      var sh = data.shareholders.find(function(s){ return s.name.toLowerCase()===un.toLowerCase() && s.password===pw; });
      if(sh) { user={role:'shareholder',name:sh.name,shareholderId:sh.id}; tab='dashboard'; render(); return; }
      document.getElementById('ler').textContent = 'Invalid username or password';
    }
    lb.addEventListener('click', doLogin);
    document.getElementById('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  }

  var lo = document.getElementById('lout');
  if(lo) lo.addEventListener('click', function(){ user=null; render(); });

  document.querySelectorAll('[data-tab]').forEach(function(b) {
    b.addEventListener('click', function() {
      tab = b.dataset.tab; sideOpen=false;
      var s=document.getElementById('sb'), o=document.getElementById('ovl');
      if(s) s.classList.remove('open');
      if(o) o.classList.remove('show');
      render();
    });
  });

  var mb = document.getElementById('mbtn');
  if(mb) mb.addEventListener('click', function(){
    sideOpen=!sideOpen;
    document.getElementById('sb').classList.toggle('open',sideOpen);
    document.getElementById('ovl').classList.toggle('show',sideOpen);
  });
  var ov = document.getElementById('ovl');
  if(ov) ov.addEventListener('click', function(){
    sideOpen=false;
    document.getElementById('sb').classList.remove('open');
    ov.classList.remove('show');
  });

  var ab = document.getElementById('abuy');
  if(ab) ab.addEventListener('click', function(){
    var g=parseFloat(document.getElementById('bg').value), r=parseFloat(document.getElementById('br').value);
    if(!g||!r) return alert('Enter grams and rate'); addBuy(g,r);
  });
  var as = document.getElementById('asell');
  if(as) as.addEventListener('click', function(){
    var g=parseFloat(document.getElementById('sg').value), r=parseFloat(document.getElementById('sr2').value);
    if(!g||!r) return alert('Enter grams and rate'); addSell(g,r);
  });
  var ae = document.getElementById('aexp');
  if(ae) ae.addEventListener('click', function(){
    var d=document.getElementById('ed').value.trim(), a=parseFloat(document.getElementById('ea').value);
    if(!d||!a) return alert('Enter description and amount'); addExp(d,a);
  });
  var av = document.getElementById('asurv');
  if(av) av.addEventListener('click', function(){
    var a=parseFloat(document.getElementById('sa').value);
    if(!a) return alert('Enter amount'); addSurv(a);
  });

  document.querySelectorAll('[data-w]').forEach(function(b) {
    b.addEventListener('click', function(){
      var sid=parseInt(b.dataset.w);
      var sh=data.shareholders.find(function(s){return s.id===sid;});
      var a=parseFloat(prompt('Withdraw amount\nCurrent balance: ' + f$(sh.balance)));
      if(isNaN(a)||a<=0) return; reqW(sid,a);
    });
  });
  document.querySelectorAll('[data-ap]').forEach(function(b) {
    b.addEventListener('click', function(){
      if(confirm('Approve and pay this withdrawal?')) appW(parseInt(b.dataset.ap));
    });
  });
}

render();
</script>
</body>
</html>
