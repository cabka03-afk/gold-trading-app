<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gold Trading Pro | Complete Accounting + Deposits + Date Reports</title>
     <style>
          body { background: black; }
    .login-card { background: #131210; }
    .card { background: #11110e; }
    /* ========== BRIGHT REPORTS PAGE ONLY ========== */
        .report-container {
            background: #fef9ef !important;

            padding: 20px !important;
            color: #1e1b15 !important;

        .report-header {
            background: linear-gradient(135deg, #1e5631, #3a7d2c) !important;
            color: white !important;
            padding: 18px 22px !important;
            border-radius: 16px !important;
            margin-bottom: 20px !important;
        }
        
        .report-header h3 {
            color: white !important;
            font-size: 1.3rem !important;

        .report-summary {
            background: white !important;
            border-radius: 16px !important;
            padding: 15px !important;
            margin-bottom: 20px !important;
            display: flex !important;
            gap: 15px !important;
            flex-wrap: wrap !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important;

        }
        
        .summary-card {
            flex: 1 !important;

        }
        
        .summary-card .label {
            font-size: 0.7rem !important;

            text-transform: uppercase !important;
        }
        
        .summary-card .value {

            font-weight: bold !important;
        }
        
        .summary-card .value.positive {
            color: #2b6e2f !important;
        }
        
        .summary-card .value.negative {
            color: #c0392b !important;
        }
        
        .mashiin-card {
            background: #fff8e7 !important;
            border: 1px solid #e8dcc8 !important;
            border-radius: 16px !important;
            padding: 16px !important;
            margin-bottom: 20px !important;
        }
        
        .mashiin-card .label {
            color: #b8860b !important;
            font-size: 0.7rem !important;
        }
        
        .mashiin-card .value {
            font-size: 1.3rem !important;
            font-weight: bold !important;
            color: #8b6914 !important;
        }
        
        .transaction-list {
            background: white !important;
            border-radius: 16px !important;
            overflow: hidden !important;
            border: 1px solid #e2d5bd !important;
        }
        
        .transaction-list-header {
            background: #efe5d5 !important;

        .transaction-item {
            border-bottom: 1px solid #eee5d8 !important;

        .transaction-type {
            font-weight: 600 !important;
            padding: 3px 10px !important;
            border-radius: 30px !important;

            margin: 0 10px !important;
            min-width: 130px !important;
            text-align: center !important;
        }
        
        .transaction-type.GOLD_PURCHASE { background: #fff3e0 !important; color: #e65100 !important; }
        .transaction-type.GOLD_SALE { background: #e8f5e9 !important; color: #2e7d32 !important; }
        .transaction-type.SURVEY_REVENUE { background: #e3f2fd !important; color: #1565c0 !important; }
        .transaction-type.EXPENSE { background: #ffebee !important; color: #c62828 !important; }
        .transaction-type.DEPOSIT { background: #e0f2f1 !important; color: #00695c !important; }
        .transaction-type.WITHDRAWAL { background: #fce4ec !important; color: #ad1457 !important; }
        .transaction-type.EXCHANGE { background: #f3e5f5 !important; color: #6a1b9a !important; }
        
        .transaction-desc {
            flex: 2 !important;
            font-size: 0.85rem !important;
            color: #2c2c2c !important;
            margin: 0 10px !important;
        }
        
        .transaction-amount {
            font-weight: bold !important;
            font-size: 1rem !important;
            min-width: 100px !important;
            text-align: right !important;
        }
        
        .transaction-amount.positive {
            color: #2e7d32 !important;
        }
        
        .transaction-amount.negative {
            color: #c62828 !important;
        }
        
        /* Override dark background for report output area */
        #reportOutput {
            background: transparent !important;
        }
        
        .card:has(#reportOutput) {
            background: #f5efe3 !important;
        }
        
        /* Make the filter bar bright too */
        .filter-bar, .report-filters {
            background: #f5efe3 !important;
            padding: 12px !important;
            border-radius: 16px !important;
            margin-bottom: 15px !important;
        }
        
        .filter-btn {
            background: white !important;
            border: 1px solid #d4c5a8 !important;
            color: #4a3e2c !important;
        }
        
        .filter-btn:hover {
            background: #c8a96e !important;
            color: white !important;
        }
        
        select, input {
            background: white !important;
            border: 1px solid #d4c5a8 !important;
            color: #1e1b15 !important;
        }
        
        .btn-sm {
            background: #c8a96e !important;
            color: white !important;
        }
        
        .btn-sm:hover {
            background: #a87f2a !important;
        }
        
        @media print {
            .sidebar, .mobile-header, .filter-bar, .report-filters, .btn-sm, nav, .user-section {
                display: none !important;
            }
            .report-container {
                background: white !important;
                padding: 0 !important;
            }
            .content-main {
                margin: 0 !important;
                padding: 0 !important;
            }
        }
</style>
</head>
<body>
<div id="root"></div>

<script>
    // ------------------- DATA MODEL -------------------
    const defaultState = {
        companyCashZMW: 50000.0,
        companyCashUSD: 0.0,
        exchangeRate: 26.5,
        
        // All transaction logs with dates
        goldPurchases: [],      // id, date, grams, ratePerGram, grossAmount, mashiinFee, transportFee, netPaid, salesRep, remainingGrams
        goldSales: [],          // id, date, gramsSold, sellRateUSD, revenueUSD, costBasisUSD, profitUSD, conversionChoice, usdKept, zmwConverted
        expenses: [],           // id, date, description, amountZMW
        surveyRevenues: [],     // id, date, amountZMW, customerName
        exchangeLogs: [],       // id, date, fromCurr, toCurr, amount, rate, result
        deposits: [],           // id, date, type, source, amountZMW, description (type: shareholder, loan_payment, external)
        withdrawalRequests: [],
        cashTransactions: [],   // unified ledger for dashboard
        
        liabilities: [],
        debtors: [],
        
        shareholders: [
            { id: 1, name: "Yuusuf", password: "yuusuf123", balanceZMW: 0.0, role: "shareholder" },
            { id: 2, name: "Abdirisak", password: "abdirisak123", balanceZMW: 0.0, role: "shareholder" },
            { id: 3, name: "Ahmed", password: "ahmed123", balanceZMW: 0.0, role: "shareholder" }
        ],
        
        adminUser: { name: "Admin", password: "Muhiim1998", role: "admin" },
        managerUser: { name: "Samatar", password: "samatar123", role: "manager" },
        salesReps: ["Samatar", "Yuusuf", "Abdirisak", "Jamal"],
        defaultMashiin: 750,
        defaultTransport: 150
    };

    let state = JSON.parse(localStorage.getItem('gold_pro_acct_v2')) || JSON.parse(JSON.stringify(defaultState));
    let currentUser = null;
    let activeTab = "dashboard";
    let modalData = null;

    function persist() { localStorage.setItem('gold_pro_acct_v2', JSON.stringify(state)); }

    const formatZMW = (v) => 'K' + (parseFloat(v)||0).toFixed(2);
    const formatUSD = (v) => '$' + (parseFloat(v)||0).toFixed(2);
    const formatGrams = (g) => (parseFloat(g)||0).toFixed(2) + ' g';

    function addToCashTransactions(type, amountZMW, amountUSD, description, date) {
        state.cashTransactions.unshift({
            id: Date.now(), date: date || new Date().toISOString(), type, amountZMW, amountUSD, description,
            runningBalanceZMW: state.companyCashZMW,
            runningBalanceUSD: state.companyCashUSD
        });
        persist();
    }

    // ----- BUSINESS LOGIC WITH DATES -----
    function recordPurchase(grams, ratePerGram, mashiinAmt, transportAmt, salesRep, transDate) {
        const gross = grams * ratePerGram;
        const netPaid = gross - (mashiinAmt + transportAmt);
        if (netPaid < 0) throw new Error("Deductions exceed value");
        state.goldPurchases.push({
            id: Date.now(), date: transDate, grams, ratePerGram, grossAmount: gross,
            mashiinFee: mashiinAmt, transportFee: transportAmt, netPaid, salesRep, remainingGrams: grams
        });
        state.companyCashZMW -= netPaid;
        addToCashTransactions("GOLD_PURCHASE", -netPaid, 0, `Buy ${grams}g @ ${ratePerGram} ZMW/g, Rep:${salesRep}`, transDate);
        persist();
    }

    function recordSale(gramsSold, sellRateUSD, conversionChoice, customConvertUSD, transDate) {
        let remaining = gramsSold;
        let totalCostBasisZMW = 0;
        for (let p of state.goldPurchases) {
            if (remaining <= 0) break;
            if (p.remainingGrams <= 0) continue;
            const taken = Math.min(p.remainingGrams, remaining);
            const proportionCost = (taken / p.grams) * p.netPaid;
            totalCostBasisZMW += proportionCost;
            p.remainingGrams -= taken;
            remaining -= taken;
        }
        if (remaining > 0) throw new Error("Insufficient inventory");
        const revenueUSD = gramsSold * sellRateUSD;
        const costBasisUSD = totalCostBasisZMW / state.exchangeRate;
        const profitUSD = revenueUSD - costBasisUSD;
        const profitZMW = profitUSD * state.exchangeRate;
        const perShare = profitZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW += perShare);
        
        let usdKept = 0, zmwConverted = 0;
        if (conversionChoice === "keep_all") { usdKept = revenueUSD; state.companyCashUSD += revenueUSD; }
        else if (conversionChoice === "convert_all") { zmwConverted = revenueUSD * state.exchangeRate; state.companyCashZMW += zmwConverted; }
        else if (conversionChoice === "partial" && customConvertUSD > 0) {
            const convertUSD = Math.min(customConvertUSD, revenueUSD);
            zmwConverted = convertUSD * state.exchangeRate;
            usdKept = revenueUSD - convertUSD;
            state.companyCashZMW += zmwConverted;
            state.companyCashUSD += usdKept;
        }
        state.goldSales.push({ id: Date.now(), date: transDate, gramsSold, sellRateUSD, revenueUSD, profitUSD, conversionChoice, usdKept, zmwConverted });
        addToCashTransactions("GOLD_SALE", zmwConverted, usdKept, `Sold ${gramsSold}g @ ${sellRateUSD} USD/g, profit ${profitUSD} USD`, transDate);
        persist();
    }

    function addExpense(desc, amountZMW, transDate) {
        const perShare = amountZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW -= perShare);
        state.expenses.push({ id: Date.now(), date: transDate, description: desc, amountZMW });
        state.companyCashZMW -= amountZMW;
        addToCashTransactions("EXPENSE", -amountZMW, 0, desc, transDate);
        persist();
    }

    function addSurveyRevenue(amountZMW, customerName, transDate) {
        const perShare = amountZMW / state.shareholders.length;
        state.shareholders.forEach(sh => sh.balanceZMW += perShare);
        state.surveyRevenues.push({ id: Date.now(), date: transDate, amountZMW, customerName });
        state.companyCashZMW += amountZMW;
        addToCashTransactions("SURVEY_REVENUE", amountZMW, 0, `Survey from ${customerName}`, transDate);
        persist();
    }

    // DEPOSIT: Shareholder (increases balance), Loan Payment (reduces liability), External
    function addDeposit(type, source, amountZMW, description, transDate) {
        if (type === "shareholder") {
            const shareholder = state.shareholders.find(s => s.name === source);
            if (!shareholder) throw new Error("Shareholder not found");
            shareholder.balanceZMW += amountZMW;
            state.companyCashZMW += amountZMW;
            addToCashTransactions("DEPOSIT_SHAREHOLDER", amountZMW, 0, `Deposit from ${source}`, transDate);
        } else if (type === "loan_payment") {
            state.companyCashZMW += amountZMW;
            addToCashTransactions("DEPOSIT_LOAN", amountZMW, 0, `Loan payment from ${source}`, transDate);
        } else {
            state.companyCashZMW += amountZMW;
            addToCashTransactions("DEPOSIT_EXTERNAL", amountZMW, 0, `External deposit: ${description}`, transDate);
        }
        state.deposits.push({ id: Date.now(), date: transDate, type, source, amountZMW, description });
        persist();
    }

    function exchangeCurrency(fromCurr, amount, rate, transDate) {
        if (fromCurr === "ZMW") {
            if (state.companyCashZMW < amount) throw new Error("Insufficient ZMW");
            const usdReceived = amount / rate;
            state.companyCashZMW -= amount;
            state.companyCashUSD += usdReceived;
            addToCashTransactions("EXCHANGE", -amount, usdReceived, `ZMW → USD at rate ${rate}`, transDate);
        } else {
            if (state.companyCashUSD < amount) throw new Error("Insufficient USD");
            const zmwReceived = amount * rate;
            state.companyCashUSD -= amount;
            state.companyCashZMW += zmwReceived;
            addToCashTransactions("EXCHANGE", zmwReceived, -amount, `USD → ZMW at rate ${rate}`, transDate);
        }
        state.exchangeRate = rate;
        persist();
    }

    function requestWithdrawal(shareholderId, amountZMW) {
        const sh = state.shareholders.find(s => s.id === shareholderId);
        if (!sh || sh.balanceZMW < amountZMW) throw new Error("Insufficient balance");
        state.withdrawalRequests.push({ id: Date.now(), date: new Date().toISOString(), shareholderId, shareholderName: sh.name, amountZMW, status: "pending" });
        persist();
    }

    function approveWithdrawal(reqId) {
        const req = state.withdrawalRequests.find(r => r.id === reqId);
        if (!req || req.status !== "pending") return false;
        const shareholder = state.shareholders.find(s => s.id === req.shareholderId);
        if (!shareholder || shareholder.balanceZMW < req.amountZMW || state.companyCashZMW < req.amountZMW) return false;
        shareholder.balanceZMW -= req.amountZMW;
        state.companyCashZMW -= req.amountZMW;
        req.status = "approved";
        addToCashTransactions("WITHDRAWAL", -req.amountZMW, 0, `Withdrawal by ${shareholder.name}`, new Date().toISOString());
        persist();
        return true;
    }

    function getLastTransactions(limit = 10) {
        return state.cashTransactions.slice(0, limit);
    }

    function getPurchasesByRep() {
        const repMap = {};
        state.goldPurchases.forEach(p => {
            if (!repMap[p.salesRep]) repMap[p.salesRep] = { count: 0, totalGrams: 0, totalValue: 0 };
            repMap[p.salesRep].count++;
            repMap[p.salesRep].totalGrams += p.grams;
            repMap[p.salesRep].totalValue += p.netPaid;
        });
        return repMap;
    }

    function getSurveyByCustomer() {
        const custMap = {};
        state.surveyRevenues.forEach(s => {
            if (!custMap[s.customerName]) custMap[s.customerName] = { count: 0, total: 0 };
            custMap[s.customerName].count++;
            custMap[s.customerName].total += s.amountZMW;
        });
        return custMap;
    }

    // ---------- RENDER ----------
    function render() {
        const root = document.getElementById('root');
        if (!currentUser) {
            root.innerHTML = renderLogin();
            document.getElementById('loginBtn')?.addEventListener('click', doLogin);
        } else {
            root.innerHTML = renderApp();
            attachEvents();
        }
        if (modalData) renderModal();
    }

    function renderLogin() {
        return `<div class="login-screen"><div class="login-card">
            <h1>🏦 Gold Trade Pro</h1>
            <div class="field"><label>Username</label><input id="loginUser" placeholder="Admin / Samatar / Yuusuf" /></div>
            <div class="field"><label>Password</label><input id="loginPass" type="password" /></div>
            <button class="btn-gold" id="loginBtn">Access System</button>
            <div id="loginError" class="error-msg"></div>
        </div></div>`;
    }

    function doLogin() {
        const user = document.getElementById('loginUser').value.trim();
        const pwd = document.getElementById('loginPass').value;
        if (user === state.adminUser.name && pwd === state.adminUser.password) { currentUser = { name: "Admin", role: "admin" }; render(); return; }
        if (user === state.managerUser.name && pwd === state.managerUser.password) { currentUser = { name: "Samatar", role: "manager" }; render(); return; }
        const sh = state.shareholders.find(s => s.name.toLowerCase() === user.toLowerCase() && s.password === pwd);
        if (sh) { currentUser = { name: sh.name, role: "shareholder", shareholderId: sh.id }; render(); return; }
        document.getElementById('loginError').innerText = "Invalid credentials";
    }

    function renderApp() {
        const isPrivileged = (currentUser.role === 'admin' || currentUser.role === 'manager');
        const nav = [
            { id: "dashboard", label: "📊 Dashboard" }, { id: "purchase", label: "💎 Buy Gold" },
            { id: "sales", label: "💰 Sell Gold" }, { id: "survey", label: "📋 Survey" },
            { id: "deposits", label: "💵 Deposits" }, { id: "exchange", label: "🔄 Exchange" },
            { id: "reports", label: "📅 Reports" }, { id: "withdrawals", label: "🏧 Withdrawals" }
        ];
        const navBtns = nav.map(t => `<button class="nav-btn ${activeTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');
        let content = "";
        if (activeTab === "dashboard") content = dashboardHTML(isPrivileged);
        else if (activeTab === "purchase") content = purchaseHTML(isPrivileged);
        else if (activeTab === "sales") content = salesHTML(isPrivileged);
        else if (activeTab === "survey") content = surveyHTML(isPrivileged);
        else if (activeTab === "deposits") content = depositsHTML(isPrivileged);
        else if (activeTab === "exchange") content = exchangeHTML(isPrivileged);
        else if (activeTab === "reports") content = reportsHTML(isPrivileged);
        else if (activeTab === "withdrawals") content = withdrawalsHTML(isPrivileged);
        return `<div class="mobile-header"><button id="menuToggle" style="background:none;border:none;font-size:1.6rem;">☰</button><span>Gold Ledger</span><div></div></div>
        <div class="sidebar" id="sidebar"><div class="logo-area"><h2>⚜️ GOLD PRO</h2></div><div class="nav-menu">${navBtns}</div>
        <div class="user-section"><div class="user-badge"><div>${currentUser.name}</div><div style="font-size:0.7rem">${currentUser.role}</div></div>
        <button class="btn-outline" id="logoutBtn">Sign Out</button></div></div>
        <div class="content-main">${content}</div>`;
    }

    function dashboardHTML(isPrivileged) {
        const repData = getPurchasesByRep();
        const surveyData = getSurveyByCustomer();
        const lastTrans = getLastTransactions(10);
        const totalGoldStock = state.goldPurchases.reduce((a,b)=>a+b.grams,0) - state.goldSales.reduce((a,b)=>a+b.gramsSold,0);
        return `<div class="stats-row">
            <div class="stat-card" id="clickZMW"><div class="stat-label">💰 ZMW Cash</div><div class="stat-value">${formatZMW(state.companyCashZMW)}</div></div>
            <div class="stat-card" id="clickUSD"><div class="stat-label">💵 USD Cash</div><div class="stat-value">${formatUSD(state.companyCashUSD)}</div></div>
            <div class="stat-card"><div class="stat-label">📦 Gold Stock</div><div class="stat-value">${formatGrams(totalGoldStock)}</div></div>
            <div class="stat-card"><div class="stat-label">⚖️ Net Equity</div><div class="stat-value">${formatZMW(state.companyCashZMW + (state.companyCashUSD*state.exchangeRate))}</div></div>
        </div>
        <div class="two-col">
            <div class="card"><div class="card-title">📊 Purchases by Sales Rep</div>${Object.entries(repData).map(([rep, d]) => `<div style="display:flex;justify-content:space-between"><span>${rep}</span><span>${d.count} buys | ${formatGrams(d.totalGrams)}</span></div>`).join('') || '<div class="muted">No purchases yet</div>'}</div>
            <div class="card"><div class="card-title">📋 Survey Revenue by Customer</div>${Object.entries(surveyData).map(([cust, d]) => `<div style="display:flex;justify-content:space-between"><span>${cust}</span><span>${formatZMW(d.total)} (${d.count} surveys)</span></div>`).join('') || '<div class="muted">No surveys yet</div>'}</div>
        </div>
        <div class="card"><div class="card-title">🕐 Last Transactions</div>${lastTrans.map(t => `<div style="border-bottom:1px solid #2a261d;padding:8px 0">${new Date(t.date).toLocaleString()} | ${t.type} | ${t.description} | ${formatZMW(t.amountZMW)}</div>`).join('')}</div>`;
    }

    function purchaseHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Only Admin/Manager</div></div>`;
        const today = new Date().toISOString().slice(0,10);
        return `<div class="card"><div class="card-title">🛒 Buy Gold + Mashiin/Transport</div>
            <div class="form-group"><label>Date</label><input type="date" id="purchaseDate" value="${today}" /></div>
            <div class="form-group"><label>Grams</label><input id="grams" type="number" /></div><div class="form-group"><label>Rate (ZMW/g)</label><input id="rate" type="number" /></div>
            <div class="form-group"><label>Mashiin (ZMW)</label><input id="mashiin" value="${state.defaultMashiin}" /></div>
            <div class="form-group"><label>Transport (ZMW)</label><input id="transport" value="${state.defaultTransport}" /></div>
            <div class="form-group"><label>Sales Rep</label><select id="rep">${state.salesReps.map(r=>`<option>${r}</option>`).join('')}</select></div>
            <button class="btn-action" id="doPurchase">Record Purchase</button></div>`;
    }

    function salesHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Manager/Admin only</div></div>`;
        const today = new Date().toISOString().slice(0,10);
        return `<div class="card"><div class="card-title">📈 Sell Gold (USD)</div>
            <div class="form-group"><label>Date</label><input type="date" id="saleDate" value="${today}" /></div>
            <div class="form-group"><label>Grams</label><input id="sellGrams" type="number" /></div>
            <div class="form-group"><label>Sell Rate (USD/g)</label><input id="sellRate" type="number" /></div>
            <div class="form-group"><label>Conversion</label><select id="conv"><option value="convert_all">All to ZMW</option><option value="keep_all">Keep USD</option><option value="partial">Partial to ZMW</option></select></div>
            <div id="partialBox" style="display:none"><div class="form-group"><label>USD to convert</label><input id="partialUsd" type="number" /></div></div>
            <button class="btn-action" id="doSale">Sell & Distribute Profit</button></div>`;
    }

    function surveyHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Manager/Admin only</div></div>`;
        const today = new Date().toISOString().slice(0,10);
        return `<div class="card"><div class="card-title">📋 Survey Revenue</div>
            <div class="form-group"><label>Date</label><input type="date" id="surveyDate" value="${today}" /></div>
            <div class="form-group"><label>Customer Name</label><input id="custName" /></div>
            <div class="form-group"><label>Amount (ZMW)</label><input id="survAmt" type="number" /></div>
            <button class="btn-action" id="doSurvey">Add & Distribute</button></div>`;
    }

    function depositsHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Manager/Admin only</div></div>`;
        const today = new Date().toISOString().slice(0,10);
        return `<div class="card"><div class="card-title">💵 Cash Deposits</div>
            <div class="form-group"><label>Date</label><input type="date" id="depositDate" value="${today}" /></div>
            <div class="form-group"><label>Type</label><select id="depositType"><option value="shareholder">Shareholder Deposit</option><option value="loan_payment">Loan Payment Received</option><option value="external">External Deposit</option></select></div>
            <div class="form-group"><label>Source/Name</label><input id="depositSource" placeholder="Shareholder name or payer" /></div>
            <div class="form-group"><label>Amount (ZMW)</label><input id="depositAmount" type="number" /></div>
            <div class="form-group"><label>Description</label><input id="depositDesc" placeholder="Optional notes" /></div>
            <button class="btn-action" id="doDeposit">Record Deposit</button></div>`;
    }

    function exchangeHTML(isPrivileged) {
        if (!isPrivileged) return `<div class="card"><div class="muted">Manager/Admin only</div></div>`;
        const today = new Date().toISOString().slice(0,10);
        return `<div class="card"><div class="card-title">💱 Currency Exchange</div>
            <div class="form-group"><label>Date</label><input type="date" id="exDate" value="${today}" /></div>
            <div class="form-group"><label>Direction</label><select id="exDir"><option value="ZMW">ZMW → USD</option><option value="USD">USD → ZMW</option></select></div>
            <div class="form-group"><label>Amount (source currency)</label><input id="exAmount" type="number" /></div>
            <div class="form-group"><label>Rate (1 USD = X ZMW)</label><input id="exRate" value="${state.exchangeRate}" /></div>
            <button class="btn-action" id="doExchange">Execute Exchange</button></div>`;
    }

        function reportsHTML(isPrivileged) {
        // Calculate Mashiin & Transport totals
        const totalMashiin = state.goldPurchases.reduce((sum, p) => sum + (p.mashiinFee || 0), 0);
        const totalTransport = state.goldPurchases.reduce((sum, p) => sum + (p.transportFee || 0), 0);
        
        return `<div class="card"><div class="card-title">📅 Reports with Date Filters</div>
            <div class="report-filters">
                <button class="filter-btn" data-filter="today">Today</button>
                <button class="filter-btn" data-filter="yesterday">Yesterday</button>
                <button class="filter-btn" data-filter="thisMonth">This Month</button>
                <button class="filter-btn" data-filter="lastMonth">Last Month</button>
                <button class="filter-btn" data-filter="custom">Custom Range</button>
            </div>
            <div id="customRange" style="display:none; gap:10px; margin-bottom:15px;"><input type="date" id="startDate" /><input type="date" id="endDate" /><button class="btn-sm" id="applyCustom">Apply</button></div>
            
            <div style="margin: 15px 0; padding: 12px; background: #1a1a17; border-radius: 16px;">
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div><span class="muted">⚙️ Total Mashiin Collected:</span> <strong class="stat-value" style="font-size:1.2rem">${formatZMW(totalMashiin)}</strong></div>
                    <div><span class="muted">🚚 Total Transport Collected:</span> <strong class="stat-value" style="font-size:1.2rem">${formatZMW(totalTransport)}</strong></div>
                </div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="font-size:0.75rem; margin-right:10px;">📌 Filter by Type:</label>
                <select id="reportTypeFilter" style="width: auto; display: inline-block; padding: 6px 12px;">
                    <option value="all">📊 All Transactions</option>
                    <option value="GOLD_PURCHASE">💎 Gold Purchases</option>
                    <option value="GOLD_SALE">💰 Gold Sales</option>
                    <option value="SURVEY_REVENUE">📋 Survey Revenue</option>
                    <option value="EXPENSE">📉 Expenses</option>
                    <option value="DEPOSIT">💵 Deposits</option>
                    <option value="WITHDRAWAL">🏧 Withdrawals</option>
                    <option value="EXCHANGE">🔄 Exchange</option>
                </select>
                <button class="btn-sm" id="applyTypeFilter" style="margin-left: 10px;">Apply Type Filter</button>
            </div>
            
            <div id="reportOutput"></div>
            <button class="btn-sm" id="printReport" style="margin-top:15px;">📄 Print Report</button>
        </div>`;
    }

    function withdrawalsHTML(isPrivileged) {
        const reqs = state.withdrawalRequests.filter(r => isPrivileged || r.shareholderId === currentUser.shareholderId);
        return `<div class="card"><div class="card-title">🏧 Withdrawals (ZMW)</div>
            ${!isPrivileged ? `<button class="btn-sm" id="requestWBtn">Request Withdrawal</button>` : ''}
            <table><thead><tr><th>User</th><th>Amount</th><th>Status</th>${isPrivileged ? '<th>Action</th>' : ''}</tr></thead>
            <tbody>${reqs.map(r => `<tr><td>${r.shareholderName}</td><td>${formatZMW(r.amountZMW)}</td><td class="${r.status}">${r.status}</td>${isPrivileged && r.status === 'pending' ? `<td><button class="btn-sm" data-apr="${r.id}">Approve</button></td>` : ''}</tr>`).join('')}</tbody></tr></div>`;
    }

    function attachEvents() {
        document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', (e) => { activeTab = btn.dataset.tab; render(); }));
        document.getElementById('logoutBtn')?.addEventListener('click', () => { currentUser = null; render(); });
        const isPriv = currentUser.role === 'admin' || currentUser.role === 'manager';
        if (isPriv) {
            document.getElementById('doPurchase')?.addEventListener('click', () => {
                const grams=parseFloat(document.getElementById('grams').value), rate=parseFloat(document.getElementById('rate').value);
                const m=parseFloat(document.getElementById('mashiin').value)||0, t=parseFloat(document.getElementById('transport').value)||0, rep=document.getElementById('rep').value, date=document.getElementById('purchaseDate').value;
                if(!grams||!rate) return alert("Invalid"); recordPurchase(grams,rate,m,t,rep,date); render();
            });
            document.getElementById('doSale')?.addEventListener('click', () => {
                const g=parseFloat(document.getElementById('sellGrams').value), rate=parseFloat(document.getElementById('sellRate').value);
                const conv=document.getElementById('conv').value, partial=parseFloat(document.getElementById('partialUsd').value)||0, date=document.getElementById('saleDate').value;
                if(!g||!rate) return; recordSale(g,rate,conv,partial,date); render();
            });
            document.getElementById('conv')?.addEventListener('change', e => document.getElementById('partialBox').style.display = e.target.value === 'partial' ? 'block' : 'none');
            document.getElementById('doSurvey')?.addEventListener('click', () => {
                const cust=document.getElementById('custName').value, amt=parseFloat(document.getElementById('survAmt').value), date=document.getElementById('surveyDate').value;
                if(!cust||!amt) return; addSurveyRevenue(amt,cust,date); render();
            });
            document.getElementById('doDeposit')?.addEventListener('click', () => {
                const type=document.getElementById('depositType').value, source=document.getElementById('depositSource').value, amt=parseFloat(document.getElementById('depositAmount').value), desc=document.getElementById('depositDesc').value, date=document.getElementById('depositDate').value;
                if(!source||!amt) return; addDeposit(type,source,amt,desc,date); render();
            });
            document.getElementById('doExchange')?.addEventListener('click', () => {
                const dir=document.getElementById('exDir').value, amt=parseFloat(document.getElementById('exAmount').value), rate=parseFloat(document.getElementById('exRate').value), date=document.getElementById('exDate').value;
                if(!amt||!rate) return; exchangeCurrency(dir,amt,rate,date); render();
            });
            document.querySelectorAll('[data-apr]').forEach(btn => btn.addEventListener('click', (e) => { approveWithdrawal(parseInt(btn.dataset.apr)); render(); }));
            
                   // Reports filtering
            const filterBtns = document.querySelectorAll('[data-filter]');
            const customDiv = document.getElementById('customRange');
            let currentStart = new Date();
            let currentEnd = new Date();
            
            filterBtns.forEach(btn => btn.addEventListener('click', () => {
                const filter = btn.dataset.filter;
                if (filter === 'custom') { customDiv.style.display = 'flex'; return; }
                customDiv.style.display = 'none';
                let start, end = new Date();
                const today = new Date();
                if (filter === 'today') { start = new Date(); start.setHours(0,0,0,0); end = new Date(); end.setHours(23,59,59,999); }
                else if (filter === 'yesterday') { start = new Date(); start.setDate(today.getDate()-1); start.setHours(0,0,0,0); end = new Date(start); end.setHours(23,59,59,999); }
                else if (filter === 'thisMonth') { start = new Date(today.getFullYear(), today.getMonth(), 1); end = new Date(today.getFullYear(), today.getMonth()+1, 0); }
                else if (filter === 'lastMonth') { start = new Date(today.getFullYear(), today.getMonth()-1, 1); end = new Date(today.getFullYear(), today.getMonth(), 0); }
                currentStart = start;
                currentEnd = end;
                const typeFilter = document.getElementById('reportTypeFilter')?.value || "all";
                generateReport(start, end, typeFilter);
            }));
            
            document.getElementById('applyCustom')?.addEventListener('click', () => {
                const start = new Date(document.getElementById('startDate').value); start.setHours(0,0,0,0);
                const end = new Date(document.getElementById('endDate').value); end.setHours(23,59,59,999);
                currentStart = start;
                currentEnd = end;
                const typeFilter = document.getElementById('reportTypeFilter')?.value || "all";
                generateReport(start, end, typeFilter);
                customDiv.style.display = 'none';
            });
            
            document.getElementById('applyTypeFilter')?.addEventListener('click', () => {
                if (currentStart && currentEnd) {
                    const typeFilter = document.getElementById('reportTypeFilter').value;
                    generateReport(currentStart, currentEnd, typeFilter);
                }
            });
            document.getElementById('printReport')?.addEventListener('click', () => { window.print(); });
        }
        if(currentUser.role === 'shareholder') document.getElementById('requestWBtn')?.addEventListener('click', () => { const amt=parseFloat(prompt("Amount ZMW")); if(amt) requestWithdrawal(currentUser.shareholderId, amt); render(); });
        document.getElementById('clickZMW')?.addEventListener('click', () => modalData = { title: "ZMW Cash History", items: state.cashTransactions.map(t => `${new Date(t.date).toLocaleString()} | ${t.type} | ${t.description} | Balance: ${formatZMW(t.runningBalanceZMW)}`) });
        document.getElementById('clickUSD')?.addEventListener('click', () => modalData = { title: "USD Cash History", items: state.cashTransactions.map(t => `${new Date(t.date).toLocaleString()} | ${t.type} | ${t.description} | Balance: ${formatUSD(t.runningBalanceUSD)}`) });
        document.getElementById('menuToggle')?.addEventListener('click', () => document.getElementById('sidebar')?.classList.toggle('open'));
    }

    let currentStartDate = null;
    let currentEndDate = null;
    let currentTypeFilter = "all";
    
    function generateReport(startDate, endDate, typeFilter = currentTypeFilter) {
        currentStartDate = startDate;
        currentEndDate = endDate;
        currentTypeFilter = typeFilter;
        
        let filtered = state.cashTransactions.filter(t => {
            const d = new Date(t.date);
            return d >= startDate && d <= endDate;
        });
        
        // Apply type filter
        if (typeFilter !== "all") {
            filtered = filtered.filter(t => t.type === typeFilter);
        }
        
        const totalIn = filtered.reduce((s,t)=> s + (t.amountZMW > 0 ? t.amountZMW : 0), 0);
        const totalOut = filtered.reduce((s,t)=> s + (t.amountZMW < 0 ? -t.amountZMW : 0), 0);
        
        // Calculate Mashiin & Transport for filtered period
        const filteredPurchases = state.goldPurchases.filter(p => {
            const d = new Date(p.date);
            return d >= startDate && d <= endDate;
        });
        const periodMashiin = filteredPurchases.reduce((sum, p) => sum + (p.mashiinFee || 0), 0);
        const periodTransport = filteredPurchases.reduce((sum, p) => sum + (p.transportFee || 0), 0);
        
        const typeLabel = typeFilter === "all" ? "All Transactions" : typeFilter.replace(/_/g, ' ');
        
        const html = `<h3>📊 Report: ${startDate.toLocaleDateString()} → ${endDate.toLocaleDateString()}</h3>
            <p><strong>Filter Type:</strong> ${typeLabel}</p>
            <div style="background: #1a1a17; padding: 12px; border-radius: 16px; margin: 12px 0;">
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div>💰 Total Inflows: <strong class="green">${formatZMW(totalIn)}</strong></div>
                    <div>📉 Total Outflows: <strong class="red">${formatZMW(totalOut)}</strong></div>
                    <div>📈 Net: <strong class="${(totalIn - totalOut) >= 0 ? 'green' : 'red'}">${formatZMW(totalIn - totalOut)}</strong></div>
                </div>
                ${(periodMashiin > 0 || periodTransport > 0) ? `<div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #333;">
                    <div>⚙️ Mashiin (this period): <strong>${formatZMW(periodMashiin)}</strong></div>
                    <div>🚚 Transport (this period): <strong>${formatZMW(periodTransport)}</strong></div>
                </div>` : ''}
            </div>
            <div style="max-height: 500px; overflow-y: auto;">
            ${filtered.map(t => `<div style="border-bottom:1px solid #2a261d;padding:8px 0">
                <span style="color:#a3946b; font-size:0.7rem;">${new Date(t.date).toLocaleString()}</span>
                <span style="margin-left: 10px; font-weight:500;">${t.type.replace(/_/g, ' ')}</span>
                <span style="margin-left: 10px;">${t.description}</span>
                <span style="float: right; ${t.amountZMW >= 0 ? 'color:#8bcb8b' : 'color:#e69474'}">${t.amountZMW >= 0 ? '+' : ''}${formatZMW(t.amountZMW)}</span>
            </div>`).join('')}
            ${filtered.length === 0 ? '<div class="muted" style="text-align:center;padding:40px;">No transactions found for this period and type</div>' : ''}
            </div>`;
        document.getElementById('reportOutput').innerHTML = html;
    }

    function renderModal() {
        const div = document.createElement('div'); div.className = 'modal'; div.innerHTML = `<div class="modal-content"><h3>${modalData.title}</h3><div style="max-height:60vh;overflow-y:auto">${modalData.items.map(i=>`<div style="border-bottom:1px solid #333;padding:6px 0">${i}</div>`).join('')}</div><button class="btn-sm" onclick="closeModal()">Close</button></div>`;
        document.body.appendChild(div); window.closeModal = () => { modalData = null; document.body.removeChild(div); render(); };
    }

    render();
</script>
</body>
</html>
