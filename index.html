<!DOCTYPE html>

    <style>
        /* FULL CSS - NOTHING REMOVED */

        .nav-menu { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; }
        .nav-menu { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; }

        .nav-btn.active, .nav-btn:hover { background: #25231c; color: #f5de9c; }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .form-group { margin-bottom: 16px; }

        input, select, textarea { width: 100%; background: #1e1d18; border: 1px solid #3f392b; padding: 10px 14px; border-radius: 36px; color: #f2e7cf; }
        .btn-action { background: linear-gradient(100deg, #9e7d30, #d6ae5a); border: none; padding: 12px; border-radius: 40px; font-weight: bold; color: #0c0a04; cursor: pointer; width: 100%; }
        .btn-sm { background: #2a271f; border: 1px solid #7a6b47; padding: 6px 14px; border-radius: 30px; color: #f0daa0; cursor: pointer; font-size: 0.7rem; }
        .btn-danger { background: #5a1e1e; border-color: #a54a4a; color: #ffb4b4; }
        .btn-danger:hover { background: #7a2a2a; }
        .green { color: #8bcb8b; }
        .red { color: #e69474; }
        .muted { color: #8e8160; }

        .modal-content { background: #181714; border-radius: 28px; padding: 28px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #2f2b20; }
        .user-row:hover { background: #1c1b16; }
        .mobile-header { display: none; }
        .loading { text-align: center; padding: 50px; color: #e2bc6e; font-size: 1.2rem; }
        .sync-status { position: fixed; bottom: 10px; right: 10px; background: #1a1a17; padding: 4px 12px; border-radius: 20px; font-size: 0.65rem; z-index: 100; }
        
        /* ========== BRIGHT REPORTS STYLES ========== */
        .report-container { background: #fef9ef; border-radius: 20px; padding: 20px; color: #1e1b15; margin-top: 15px; }
        .report-header { background: linear-gradient(135deg, #1e5631, #3a7d2c); color: white; padding: 18px 22px; border-radius: 16px; margin-bottom: 20px; }
        .report-header h3 { color: white; font-size: 1.3rem; margin-bottom: 6px; }
        .report-header p { color: rgba(255,255,255,0.85); font-size: 0.8rem; }
        .report-summary { background: white; border-radius: 16px; padding: 15px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2d5bd; }
        .summary-card { flex: 1; background: #faf7f0; padding: 12px; border-radius: 12px; text-align: center; }
        .summary-card .label { font-size: 0.7rem; color: #7a6846; text-transform: uppercase; letter-spacing: 0.05em; }
        .summary-card .value { font-size: 1.6rem; font-weight: bold; }
        .summary-card .value.positive { color: #2b6e2f; }
        .summary-card .value.negative { color: #c0392b; }
        .mashiin-card { background: #fff8e7; border: 1px solid #e8dcc8; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .mashiin-card .label { color: #b8860b; font-size: 0.7rem; text-transform: uppercase; }
        .mashiin-card .value { font-size: 1.3rem; font-weight: bold; color: #8b6914; }
        .transaction-list { background: white; border-radius: 16px; overflow: hidden; border: 1px solid #e2d5bd; }
        .transaction-list-header { background: #efe5d5; padding: 12px 15px; font-weight: bold; color: #5c4a2e; }
        .transaction-item { border-bottom: 1px solid #eee5d8; padding: 12px 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; background: white; transition: background 0.2s; }
        .transaction-item:hover { background: #fef7e8; }
        .transaction-date { font-size: 0.7rem; color: #8b7a5c; min-width: 140px; }
        .transaction-type { font-weight: 600; padding: 3px 10px; border-radius: 30px; font-size: 0.7rem; margin: 0 10px; min-width: 120px; text-align: center; }
        .transaction-type.PURCHASE { background: #fff3e0; color: #e65100; }
        .transaction-type.SALE { background: #e8f5e9; color: #2e7d32; }
        .transaction-type.SURVEY { background: #e3f2fd; color: #1565c0; }
        .transaction-type.EXPENSE { background: #ffebee; color: #c62828; }
        .transaction-type.DEPOSIT { background: #e0f2f1; color: #00695c; }
        .transaction-type.WITHDRAWAL { background: #fce4ec; color: #ad1457; }
        .transaction-type.EXCHANGE { background: #f3e5f5; color: #6a1b9a; }
        .transaction-desc { flex: 2; font-size: 0.85rem; color: #2c2c2c; margin: 0 10px; }
        .transaction-amount { font-weight: bold; font-size: 1rem; min-width: 100px; text-align: right; }
        .transaction-amount.positive { color: #2e7d32; }
        .transaction-amount.negative { color: #c62828; }
        .report-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; background: #f5efe3; padding: 12px; border-radius: 16px; }
        .filter-btn { background: white; border: 1px solid #d4c5a8; padding: 8px 16px; border-radius: 40px; cursor: pointer; font-size: 0.75rem; color: #4a3e2c; transition: all 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: #c8a96e; color: white; border-color: #c8a96e; }
        .type-filter-bar { background: #f5efe3; padding: 12px; border-radius: 16px; margin-bottom: 15px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .type-filter-bar select { width: auto; background: white; padding: 6px 12px; }
        
        @media (max-width: 760px) { .sidebar { transform: translateX(-100%); transition: 0.2s; } .sidebar.open { transform: translateX(0); } .content-main { margin-left: 0; padding: 18px; } .stats-row { grid-template-columns: 1fr 1fr; } .two-col, .three-col { grid-template-columns: 1fr; } .mobile-header { display: flex; justify-content: space-between; padding: 14px 18px; background: #0e0e0b; position: sticky; top: 0; z-index: 15; } }
        
        @media print { .sidebar, .mobile-header, .report-filters, .type-filter-bar, .btn-sm, .btn-action, nav, .user-section, .sync-status { display: none !important; } .report-container { background: white !important; padding: 0 !important; margin: 0 !important; } .content-main { margin: 0 !important; padding: 0 !important; } }
    </style>
</head>
<body>
<div id="root"><div class="loading">☁️ Loading cloud data...</div></div>
<div id="syncStatus" class="sync-status">🔄 Connecting...</div>

<script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
        apiKey: "AIzaSyB4uA5m3_1Ps-zaPLF6UWD5X4VOoHn0JxY",
        authDomain: "gold-trading-app-203b8.firebaseapp.com",
        projectId: "gold-trading-app-203b8",
        storageBucket: "gold-trading-app-203b8.firebasestorage.app",
        messagingSenderId: "240340562471",
        appId: "1:240340562471:web:816f7e0026783deccb5402"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    const settingsRef = db.collection('settings');
    const purchasesRef = db.collection('goldPurchases');
    const salesRef = db.collection('goldSales');
    const expensesRef = db.collection('expenses');
    const surveysRef = db.collection('surveyRevenues');
    const depositsRef = db.collection('deposits');
    const withdrawalsRef = db.collection('withdrawalRequests');
    const cashTransactionsRef = db.collection('cashTransactions');
    const shareholdersRef = db.collection('shareholders');
    
    let currentUser = null;
    let activeTab = "dashboard";
    let isLoading = true;
    let showPasswords = false;
    let appData = {
        companyCashZMW: 0,
        companyCashUSD: 0,
        exchangeRate: 26.5,
        goldPurchases: [],
        goldSales: [],
        expenses: [],
        surveyRevenues: [],
        withdrawalRequests: [],
        cashTransactions: [],
        shareholders: []
    };
    
    const formatZMW = (v) => 'K' + (parseFloat(v)||0).toFixed(2);
    const formatUSD = (v) => '$' + (parseFloat(v)||0).toFixed(2);
    const formatGrams = (g) => (parseFloat(g)||0).toFixed(2) + ' g';
    
    // Core function to dynamically calculate live cash metrics from data sources
    function recalculateLiveBalances() {
        let zmwInflows = 0;
        let zmwOutflows = 0;
        let usdInflows = 0;
        let usdOutflows = 0;

        // 1. Process structured cash history transaction entries
        appData.cashTransactions.forEach(t => {
            const zAmt = parseFloat(t.amountZMW) || 0;
            const uAmt = parseFloat(t.amountUSD) || 0;

            if (zAmt > 0) zmwInflows += zAmt;
            else if (zAmt < 0) zmwOutflows += Math.abs(zAmt);

            if (uAmt > 0) usdInflows += uAmt;
            else if (uAmt < 0) usdOutflows += Math.abs(uAmt);
        });

        appData.companyCashZMW = zmwInflows - zmwOutflows;
        appData.companyCashUSD = usdInflows - usdOutflows;
    }

    // Load all data from Firestore
    async function loadAllData() {
        try {
            const settingsDoc = await settingsRef.doc('main').get();
            if (settingsDoc.exists) {
                appData.exchangeRate = settingsDoc.data().exchangeRate || 26.5;
            } else {
                await settingsRef.doc('main').set({ companyCashZMW: 0, companyCashUSD: 0, exchangeRate: 26.5 });
            }
            
            const shareholdersSnap = await shareholdersRef.get();
            appData.shareholders = [];
            if (shareholdersSnap.empty) {
                const defaults = [
                    { id: 1, name: "Yuusuf", password: "yuusuf123", balanceZMW: 0 },
                    { id: 2, name: "Abdirisak", password: "abdirisak123", balanceZMW: 0 },
                    { id: 3, name: "Ahmed", password: "ahmed123", balanceZMW: 0 }
                ];
                for (const sh of defaults) {
                    await shareholdersRef.doc(sh.id.toString()).set(sh);
                    appData.shareholders.push(sh);
                }
            } else {
                shareholdersSnap.forEach(doc => appData.shareholders.push({ id: parseInt(doc.id), ...doc.data() }));
            }
            
            const purchasesSnap = await purchasesRef.orderBy('date', 'desc').get();
            appData.goldPurchases = purchasesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const salesSnap = await salesRef.orderBy('date', 'desc').get();
            appData.goldSales = salesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const expensesSnap = await expensesRef.orderBy('date', 'desc').get();
            appData.expenses = expensesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const surveysSnap = await surveysRef.orderBy('date', 'desc').get();
            appData.surveyRevenues = surveysSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const depositsSnap = await depositsRef.orderBy('date', 'desc').get();
            appData.deposits = depositsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const withdrawalsSnap = await withdrawalsRef.orderBy('date', 'desc').get();
            appData.withdrawalRequests = withdrawalsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            const transactionsSnap = await cashTransactionsRef.orderBy('date', 'desc').limit(500).get();
            appData.cashTransactions = transactionsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
            
            recalculateLiveBalances();

            isLoading = false;
            document.getElementById('syncStatus').innerHTML = '✅ Cloud Connected';
            setTimeout(() => { const s = document.getElementById('syncStatus'); if(s) s.style.opacity = '0.6'; }, 2000);
            
            if (currentUser) { renderApp(); } else { showLogin(); }
        } catch(e) {
            console.error(e);
            document.getElementById('syncStatus').innerHTML = '⚠️ Offline Mode';
            isLoading = false;
            if (currentUser) { renderApp(); } else { showLogin(); }
        }
    }
    
    async function saveSettings() {
        await settingsRef.doc('main').set({
            companyCashZMW: appData.companyCashZMW,
            companyCashUSD: appData.companyCashUSD,
            exchangeRate: appData.exchangeRate
        });
    }
    
    async function addCashTransaction(type, amountZMW, amountUSD, description, date) {
        const trans = { id: Date.now().toString(), date: date || new Date().toISOString(), type, amountZMW, amountUSD, description, runningBalanceZMW: appData.companyCashZMW, runningBalanceUSD: appData.companyCashUSD };
        appData.cashTransactions.unshift(trans);
        await cashTransactionsRef.doc(trans.id).set(trans);
        recalculateLiveBalances();
    }
    
    async function deleteTransaction(transId) {
        if (!confirm("⚠️ Delete this transaction? This cannot be undone.")) return;
        const transaction = appData.cashTransactions.find(t => t.id === transId);
        if (!transaction) return;
        
        appData.cashTransactions = appData.cashTransactions.filter(t => t.id !== transId);
        await cashTransactionsRef.doc(transId).delete();
        recalculateLiveBalances();
        await saveSettings();
        renderApp();
        alert("✅ Transaction deleted");
    }
    
    // User Management
    async function addShareholder(name, password) {
        if (!name || !password) throw new Error("Name and password required");
        if (appData.shareholders.some(s => s.name === name)) throw new Error("Name exists");
        const newId = Math.max(...appData.shareholders.map(s=>s.id), 0) + 1;
        const newSh = { id: newId, name, password, balanceZMW: 0 };
        await shareholdersRef.doc(newId.toString()).set(newSh);
        appData.shareholders.push(newSh);
        return true;
    }
    
    async function deleteShareholder(id) {
        const sh = appData.shareholders.find(s => s.id === id);
        if (!sh) throw new Error("Not found");
        if (sh.balanceZMW !== 0) throw new Error(`Balance must be zero: ${formatZMW(sh.balanceZMW)}`);
        await shareholdersRef.doc(id.toString()).delete();
        appData.shareholders = appData.shareholders.filter(s => s.id !== id);
        return true;
    }
    
    // Business Functions
    async function addDeposit(type, source, amount, desc, date) {
        if (amount <= 0) throw new Error("Amount positive");
        if (type === "shareholder") {
            const sh = appData.shareholders.find(s => s.name === source);
            if (!sh) throw new Error("Shareholder not found");
            sh.balanceZMW += amount;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
            appData.companyCashZMW += amount;
            await saveSettings();
            await addCashTransaction("DEPOSIT", amount, 0, `Deposit from ${source}`, date);
        } else {
            appData.companyCashZMW += amount;
            await saveSettings();
            await addCashTransaction("DEPOSIT", amount, 0, `External: ${desc || source}`, date);
        }
        renderApp();
    }
    
    async function exchangeCurrency(fromCurr, amount, rate, date) {
        if (amount <= 0 || rate <= 0) throw new Error("Invalid");
        if (fromCurr === "ZMW") {
            if (appData.companyCashZMW < amount) throw new Error("Insufficient ZMW");
            const usdReceived = amount / rate;
            appData.companyCashZMW -= amount;
            appData.companyCashUSD += usdReceived;
            await saveSettings();
            await addCashTransaction("EXCHANGE", -amount, usdReceived, `ZMW → USD at ${rate}`, date);
        } else {
            if (appData.companyCashUSD < amount) throw new Error("Insufficient USD");
            const zmwReceived = amount * rate;
            appData.companyCashUSD -= amount;
            appData.companyCashZMW += zmwReceived;
            await saveSettings();
            await addCashTransaction("EXCHANGE", zmwReceived, -amount, `USD → ZMW at ${rate}`, date);
        }
        appData.exchangeRate = rate;
        await saveSettings();
        renderApp();
    }
    
    async function recordPurchase(g, r, m, t, rep, date) {
        const gross = g * r;
        const net = gross - (m + t);
        if (net < 0) throw new Error("Deductions exceed value");
        if (appData.companyCashZMW < net) throw new Error("Insufficient ZMW");
        const purchase = { id: Date.now().toString(), date, grams: g, ratePerGram: r, grossAmount: gross, mashiinFee: m, transportFee: t, netPaid: net, salesRep: rep, remainingGrams: g };
        await purchasesRef.doc(purchase.id).set(purchase);
        appData.goldPurchases.unshift(purchase);
        appData.companyCashZMW -= net;
        await saveSettings();
        await addCashTransaction("PURCHASE", -net, 0, `Buy ${g}g @ ${r} ZMW/g, Mashiin:${m}, Transport:${t}, Rep:${rep}`, date);
        renderApp();
    }
    
    async function recordSale(g, rate, convChoice, partialUsd, date) {
        let remaining = g;
        let costZMW = 0;
        for (let p of appData.goldPurchases) {
            if (remaining <= 0) break;
            if (p.remainingGrams <= 0) continue;
            const taken = Math.min(p.remainingGrams, remaining);
            costZMW += (taken / p.grams) * p.netPaid;
            p.remainingGrams -= taken;
            await purchasesRef.doc(p.id).update({ remainingGrams: p.remainingGrams });
            remaining -= taken;
        }
        if (remaining > 0) throw new Error("Insufficient inventory");
        
        const revenueUSD = g * rate;
        const costUSD = costZMW / appData.exchangeRate;
        const profitUSD = revenueUSD - costUSD;
        const profitZMW = profitUSD * appData.exchangeRate;
        const perShare = profitZMW / appData.shareholders.length;
        for (const sh of appData.shareholders) {
            sh.balanceZMW += perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        
        let usdKept = 0, zmwConverted = 0;
        if (convChoice === "keep_all") { usdKept = revenueUSD; appData.companyCashUSD += revenueUSD; }
        else if (convChoice === "convert_all") { zmwConverted = revenueUSD * appData.exchangeRate; appData.companyCashZMW += zmwConverted; }
        else if (convChoice === "partial" && partialUsd > 0) {
            const convertUSD = Math.min(partialUsd, revenueUSD);
            zmwConverted = convertUSD * appData.exchangeRate;
            usdKept = revenueUSD - convertUSD;
            appData.companyCashZMW += zmwConverted;
            appData.companyCashUSD += usdKept;
        }
        await saveSettings();
        
        await salesRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date, gramsSold: g, sellRateUSD: rate, revenueUSD, profitUSD });
        await addCashTransaction("SALE", zmwConverted, usdKept, `Sold ${g}g @ ${rate} USD/g, Profit: ${profitUSD.toFixed(2)} USD`, date);
        renderApp();
    }
    
    async function addExpense(desc, amt, date) {
        if (amt <= 0) throw new Error("Positive amount");
        if (appData.companyCashZMW < amt) throw new Error("Insufficient ZMW");
        const perShare = amt / appData.shareholders.length;
        for (const sh of appData.shareholders) {
            sh.balanceZMW -= perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        await expensesRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date, description: desc, amountZMW: amt });
        appData.companyCashZMW -= amt;
        await saveSettings();
        await addCashTransaction("EXPENSE", -amt, 0, desc, date);
        renderApp();
    }
    
    async function addSurveyRevenue(amt, cust, date) {
        const perShare = amt / appData.shareholders.length;
        for (const sh of appData.shareholders) {
            sh.balanceZMW += perShare;
            await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        }
        await surveysRef.doc(Date.now().toString()).set({ id: Date.now().toString(), date, amountZMW: amt, customerName: cust });
        appData.companyCashZMW += amt;
        await saveSettings();
        await addCashTransaction("SURVEY", amt, 0, `Survey from ${cust}`, date);
        renderApp();
    }
    
    async function requestWithdrawal(id, amt) {
        const sh = appData.shareholders.find(s => s.id === id);
        if (!sh || sh.balanceZMW < amt) throw new Error("Insufficient balance");
        const req = { id: Date.now().toString(), date: new Date().toISOString(), shareholderId: id, shareholderName: sh.name, amountZMW: amt, status: "pending" };
        await withdrawalsRef.doc(req.id).set(req);
        appData.withdrawalRequests.unshift(req);
        renderApp();
    }
    
    async function approveWithdrawal(reqId) {
        const req = appData.withdrawalRequests.find(r => r.id === reqId);
        if (!req || req.status !== "pending") return;
        const sh = appData.shareholders.find(s => s.id === req.shareholderId);
        if (!sh || sh.balanceZMW < req.amountZMW || appData.companyCashZMW < req.amountZMW) return;
        sh.balanceZMW -= req.amountZMW;
        await shareholdersRef.doc(sh.id.toString()).update({ balanceZMW: sh.balanceZMW });
        appData.companyCashZMW -= req.amountZMW;
        await saveSettings();
        req.status = "approved";
        await withdrawalsRef.doc(req.id).update({ status: "approved" });
        await addCashTransaction("WITHDRAWAL", -req.amountZMW, 0, `Withdrawal by ${sh.name}`, new Date().toISOString());
        renderApp();
    }

    let currentStart = null, currentEnd = null, currentType = "all";
    
    function getRange(filter) {
        const today = new Date();
        if (filter === 'today') { let s=new Date(); s.setHours(0,0,0,0); let e=new Date(); e.setHours(23,59,59,999); return {start:s, end:e}; }
        if (filter === 'yesterday') { let s=new Date(); s.setDate(today.getDate()-1); s.setHours(0,0,0,0); let e=new Date(s); e.setHours(23,59,59,999); return {start:s, end:e}; }
        if (filter === 'thisMonth') { return {start: new Date(today.getFullYear(), today.getMonth(), 1), end: new Date(today.getFullYear(), today.getMonth()+1, 0)}; }
        if (filter === 'lastMonth') { return {start: new Date(today.getFullYear(), today.getMonth()-1, 1), end: new Date(today.getFullYear(), today.getMonth(), 0)}; }
        if (filter === 'thisYear') { return {start: new Date(today.getFullYear(), 0, 1), end: new Date(today.getFullYear(), 11, 31)}; }
        return {start: new Date(0), end: new Date()};
    }

                            <div class="form-group"><label>New Entity Name</label><input type="text" id="newShName"></div>
                            <div class="form-group"><label>Secure Access Keypass</label><input type="text" id="newShPass"></div>
                        </div>
                        <button class="btn-action" onclick="submitCreateShareholder()" style="margin-bottom:24px;">REGISTER PARTNER STRUCT</button>
                    ` : `
                        <p class="muted" style="margin-bottom:15px;">⚠️ Master clearance privileges required to inject or remove structural equity entities.</p>
                    `}
                    <div class="form-group">
                        <button class="btn-sm" onclick="showPasswords = !showPasswords; renderApp();">${showPasswords ? '🙈 Mask Secure Access Credentials' : '👁️ Audit Clear Passwords'}</button>
                    </div>
                    <div style="overflow-x:auto; margin-top:15px;">
                        <table style="width:100%; border-collapse:collapse; text-align:left; font-size:0.85rem;">
                            <thead><tr style="border-bottom:1px solid #333; color:#a3946b;"><th style="padding:8px;">ID</th><th>Name</th><th>Keypass</th><th>Balance</th><th>Action Context</th></tr></thead>
                            <tbody>
                                ${appData.shareholders.map(s => `
                                    <tr style="border-bottom:1px solid #1f1d18;">
                                        <td style="padding:8px;">${s.id}</td>
                                        <td><strong>${s.name}</strong></td>
                                        <td><code>${showPasswords ? s.password : '••••••••'}</code></td>
                                        <td class="green">${formatZMW(s.balanceZMW)}</td>
                                        <td>
                                            ${currentUser.role === 'admin' ? `<button class="btn-sm btn-danger" onclick="submitDeleteShareholder(${s.id})">REVOKE PRIVILEGES</button>` : `<span class="muted">No Access</span>`}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
        }

        document.getElementById('root').innerHTML = `
            <div class="mobile-header">
                <h2>Gold Trading Pro</h2>
                <button class="btn-sm" onclick="document.getElementById('sidebarWidget').classList.toggle('open')">☰ Menu</button>
            </div>
            <div class="sidebar" id="sidebarWidget">
                <div class="logo-area">
                    <h2>Gold Trading Pro</h2>
                    <p style="font-size:0.65rem; color:#7a6d4e; letter-spacing:1px; margin-top:2px;">ENTERPRISE COMPILATION</p>
                </div>
                <nav class="nav-menu">
                    <button class="nav-btn ${activeTab==='dashboard'?'active':''}" onclick="switchTab('dashboard')">📊 Main Board Dashboard</button>
                    <button class="nav-btn ${activeTab==='purchases'?'active':''}" onclick="switchTab('purchases')">⚖️ Mine Procurements</button>
                    <button class="nav-btn ${activeTab==='sales'?'active':''}" onclick="switchTab('sales')">🛫 Bullion Exports</button>
                    <button class="nav-btn ${activeTab==='expenses'?'active':''}" onclick="switchTab('expenses')">📉 Costs & Auxiliary Inflows</button>
                    <button class="nav-btn ${activeTab==='payouts'?'active':''}" onclick="switchTab('payouts')">💸 Capital Payout Routing</button>
                    <button class="nav-btn ${activeTab==='reports'?'active':''}" onclick="switchTab('reports')">📋 Audit Trial Ledger Records</button>
                    <button class="nav-btn ${activeTab==='settings'?'active':''}" onclick="switchTab('settings')">👥 Shareholder Config Engine</button>
                </nav>
                <div class="user-section">
                    <div class="user-badge">
                        <div style="font-size:0.65rem; color:#a3946b;">AUTHENTICATED CONTEXT</div>
                        <div style="font-size:0.9rem; font-weight:bold; color:#f0daa0; margin-top:2px;">${currentUser.name}</div>
                        <div style="font-size:0.7rem; color:#6b6247; margin-top:1px;">Role Context: ${currentUser.role.toUpperCase()}</div>
                    </div>
                    <button class="btn-outline" onclick="handleLogout()">TERMINATE SESSION</button>
                </div>
            </div>
            <main class="content-main">${mainViewHtml}</main>
        `;
        
        // Post-render UI updates
        const inputs = document.querySelectorAll('input[type="datetime-local"]');
        const nowStr = new Date().toISOString().substring(0,16);
        inputs.forEach(i => { if(!i.value) i.value = nowStr; });
        
        if (activeTab === "reports") {
            const range = getRange(currentTypeFilterPeriod);
            currentStart = range.start;
            currentEnd = range.end;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById('f-' + currentTypeFilterPeriod);
            if (activeBtn) activeBtn.classList.add('active');
            const drop = document.getElementById('filterTypeDropdown');
            if (drop) drop.value = currentType;
            generateReport();
        }
    }

    let currentTypeFilterPeriod = "all";
    function setPeriodFilter(p) {
        currentTypeFilterPeriod = p;
        const range = getRange(p);
        currentStart = range.start;
        currentEnd = range.end;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('f-' + p).classList.add('active');
        generateReport();
    }
    
    function setTypeFilter(val) {
        currentType = val;
        generateReport();
    }

    // Dynamic UI Execution Methods
    async function submitDeposit() {
        try {
            const type = document.getElementById('depType').value;
            const source = type === 'shareholder' ? document.getElementById('depSourceSh').value : 'External Stream';
            const desc = document.getElementById('depDesc').value;
            const amt = parseFloat(document.getElementById('depAmt').value) || 0;
            const date = new Date(document.getElementById('depDate').value).toISOString();
            await addDeposit(type, source, amt, desc, date);
            alert("✅ Deposit initialized successfully.");
        } catch(e) { alert("❌ " + e.message); }
    }

    async function submitExchange() {
        try {
            const from = document.getElementById('exFrom').value;
            const amt = parseFloat(document.getElementById('exAmt').value) || 0;
            const rate = parseFloat(document.getElementById('exRate').value) || 0;
            const date = new Date(document.getElementById('exDate').value).toISOString();
            await exchangeCurrency(from, amt, rate, date);
            alert("✅ Reserves swapped successfully.");
        } catch(e) { alert("❌ " + e.message); }
    }

    async function submitPurchase() {
        try {
            const g = parseFloat(document.getElementById('purGrams').value) || 0;
            const r = parseFloat(document.getElementById('purRate').value) || 0;
            const m = parseFloat(document.getElementById('purMashiin').value) || 0;
            const t = parseFloat(document.getElementById('purTransport').value) || 0;
            const rep = document.getElementById('purRep').value;
            const date = new Date(document.getElementById('purDate').value).toISOString();
            await recordPurchase(g, r, m, t, rep, date);
            alert("✅ Purchase finalized.");
        } catch(e) { alert("❌ " + e.message); }
    }

    async function submitSale() {
        try {
            const g = parseFloat(document.getElementById('saleGrams').value) || 0;
            const r = parseFloat(document.getElementById('saleRate').value) || 0;
            const conv = document.getElementById('saleConv').value;
            const partialUsd = parseFloat(document.getElementById('salePartialUsd').value) || 0;
            const date = new Date(document.getElementById('saleDate').value).toISOString();
            await recordSale(g, r, conv, partialUsd, date);
            alert("✅ Export transaction realized.");
        } catch(e) { alert("❌ " + e.message); }
    }

    async function submitExpense() {
        try {
            const desc = document.getElementById('expDesc').value;
            const amt = parseFloat(document.getElementById('expAmt').value) || 0;
            const date = new Date(document.getElementById('expDate').value).toISOString();
            await addExpense(desc, amt, date);
            alert("✅ Expense posted to ledgers.");
        } catch(e) { alert("❌ " + e.message); }
    }

    async function submitSurvey() {
        try {
            const cust = document.getElementById('srvCust').value;
            const amt = parseFloat(document.getElementById('srvAmt').value) || 0;
            const date = new Date(document.getElementById('srvDate').value).toISOString();
            await addSurveyRevenue(amt, cust, date);
            alert("✅ Survey project tracking realized.");
        } catch(e) { alert("❌ " + e.message); }
    }

    async function submitWithdrawalRequest() {
        try {
            const amt = parseFloat(document.getElementById('witAmt').value) || 0;
            await requestWithdrawal(currentUser.id, amt);
            alert("✅ Request sent to pending routing queue.");
        } catch(e) { alert("❌ " + e.message); }
    }

    async function executeApproval(id) {
        try {
            await approveWithdrawal(id);
            alert("✅ Outflow approved.");
        } catch(e) { alert("❌ Execution failed: " + e.message); }
    }

    async function submitCreateShareholder() {
        try {
            const n = document.getElementById('newShName').value;
            const p = document.getElementById('newShPass').value;
            await addShareholder(n, p);
            alert("✅ Registered structural entity.");
            renderApp();
        } catch(e) { alert("❌ " + e.message); }
    }

    async function submitDeleteShareholder(id) {
        try {
            if(confirm("⚠️ Completely drop this partner structure configuration from database records?")) {
                await deleteShareholder(id);
                alert("✅ Dropped entity.");
                renderApp();
            }
        } catch(e) { alert("❌ " + e.message); }
    }

    // Initialize System Engine Application on start
    loadAllData();
</script>
</body>
</html>
